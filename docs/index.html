<script>window.CF_VERSION="2026.10.22-1952-7857c2f";
/* Candito Forever – PWA-Schicht.
   Ersetzt die claude.ai-Laufzeit (window.claude.use) durch lokale Gegenstücke:
   - 'db'        → Datenbank im Gerätespeicher (IndexedDB), gleiche Schnittstelle wie in der Claude-Version
   - 'downloads' → iOS-Teilen-Menü („In Dateien sichern“ / iCloud Drive), sonst normaler Download
   - 'sample'    → nicht verfügbar (Claude-Analyse und Bild-Lesen gibt es nur in der Claude-Version) */
(function(){
  'use strict';
  var DBN='candito-forever', ST='docs', MAXBK=60;
  var idb=null, mem=new Map(), listeners=[];
  var clone=function(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v))};
  var opened=new Promise(function(res){
    try{var r=indexedDB.open(DBN,1);
      r.onupgradeneeded=function(){r.result.createObjectStore(ST)};
      r.onsuccess=function(){idb=r.result;res()};
      r.onerror=function(){res()};r.onblocked=function(){res()};
    }catch(e){res()}
  });
  var loaded=opened.then(function(){return new Promise(function(res){
    if(!idb)return res();
    try{var rq=idb.transaction(ST).objectStore(ST).openCursor();
      rq.onsuccess=function(){var c=rq.result;if(c){mem.set(String(c.key),c.value);c.continue()}else res()};
      rq.onerror=function(){res()};
    }catch(e){res()}
  })});
  function tx(fn){if(!idb)return Promise.resolve();return new Promise(function(res,rej){try{var t=idb.transaction(ST,'readwrite');fn(t.objectStore(ST));t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}}catch(e){rej(e)}})}
  function colOf(p){return p.slice(0,p.indexOf('/'))}
  function colSnap(n){var docs=[];mem.forEach(function(v,k){if(colOf(k)===n){var id=k.slice(n.length+1);docs.push({id:id,exists:true,data:function(){return clone(v)}})}});return {docs:docs,size:docs.length,empty:!docs.length}}
  function docSnap(p){var v=mem.get(p);return {id:p.split('/').pop(),exists:v!==undefined,data:function(){return clone(v)}}}
  function notify(p){var c=colOf(p);listeners.slice().forEach(function(l){if(l.t==='c'&&l.n===c)setTimeout(function(){l.cb(colSnap(c))},0);else if(l.t==='d'&&l.n===p)setTimeout(function(){l.cb(docSnap(p))},0)})}
  function prune(){var ks=[];mem.forEach(function(v,k){if(colOf(k)==='backup')ks.push(k)});if(ks.length<=MAXBK)return;ks.sort();var del=ks.slice(0,ks.length-MAXBK);del.forEach(function(k){mem.delete(k)});tx(function(s){del.forEach(function(k){s.delete(k)})}).catch(function(){})}
  function listen(t,n,cb){var l={t:t,n:n,cb:cb};listeners.push(l);loaded.then(function(){if(listeners.indexOf(l)>=0)cb(t==='c'?colSnap(n):docSnap(n))});return function(){var i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)}}
  function docRef(p){return {
    id:p.split('/').pop(),
    set:function(data,opt){return loaded.then(function(){var v=(opt&&opt.merge)?Object.assign({},mem.get(p)||{},clone(data)):clone(data);mem.set(p,v);notify(p);var w=tx(function(s){s.put(v,p)});if(colOf(p)==='backup')prune();return w})},
    update:function(data){return this.set(data,{merge:true})},
    delete:function(){return loaded.then(function(){mem.delete(p);notify(p);return tx(function(s){s.delete(p)})})},
    get:function(){return loaded.then(function(){return docSnap(p)})},
    onSnapshot:function(cb){return listen('d',p,cb)}
  }}
  var db={
    collection:function(n){return {onSnapshot:function(cb){return listen('c',n,cb)},doc:function(id){return docRef(n+'/'+id)},get:function(){return loaded.then(function(){return colSnap(n)})}}},
    doc:function(p){return docRef(p)}
  };
  var downloads={save:function(o){
    var name=o.filename||'datei.txt',type=o.mimeType||(/\.json$/.test(name)?'application/json':/\.csv$/.test(name)?'text/csv':'text/plain');
    var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:type});
    var mark=function(){if(/sicherung/.test(name)){try{localStorage.setItem('cf-lastexport',String(Date.now()))}catch(e){}window.dispatchEvent(new Event('cf-exported'))}};
    var file=null;try{file=new File([blob],name,{type:type})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).then(mark)
    }
    mark();
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);return Promise.resolve();
  }};
  window.claude={use:function(n){return Promise.resolve(n==='db'?db:n==='downloads'?downloads:null)}};
  window.CF_PWA={db:db,loaded:loaded};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();

<script>/* Fehlerprotokoll: unerwartete Fehler nur auf diesem Gerät mitschreiben (max. 30, gleiche zusammengezählt) – keine Trainingsdaten */
(function(){var K='cf-errlog';function rd(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}}
function add(msg,src,stk){try{msg=String(msg||'Fehler').slice(0,240);var l=rd(),v='';try{var u=typeof S!=='undefined'&&S&&S.ui;v=u?(document.body&&document.body.classList.contains('gymopen')?'gym':u.tab||''):''}catch(e){}
 var key=msg+'|'+(src||'');for(var i=0;i<l.length;i++){if(l[i].k===key){l[i].n=(l[i].n||1)+1;l[i].t=Date.now();l[i].v=v||l[i].v;l.unshift(l.splice(i,1)[0]);localStorage.setItem(K,JSON.stringify(l));return}}
 l.unshift({k:key,m:msg,s:src||'',st:String(stk||'').split('\n').slice(0,4).join('\n').slice(0,600),t:Date.now(),v:v,ver:window.CF_VERSION||'',n:1});localStorage.setItem(K,JSON.stringify(l.slice(0,30)))}catch(e){}}
window.cfErr={add:add,list:rd,clear:function(){try{localStorage.removeItem(K)}catch(e){}}};
addEventListener('error',function(e){if(!e||e.target&&e.target!==window&&e.target.tagName)return;var f=String(e.filename||'').split('/').pop();add(e.message,f?f+':'+e.lineno+':'+e.colno:'',e.error&&e.error.stack)},true);
addEventListener('unhandledrejection',function(e){var r=e&&e.reason;if(r&&r.name==='AbortError')return;add('Promise: '+(r&&r.message||r),'',r&&r.stack)})})();</script>

<style>
/* Gestaltung angelehnt an das Powerlifting Coach Cockpit: ein dunkles Erscheinungsbild, Karten mit 20px Radius,
   Archivo (kondensiert) für Leistungszahlen, Manrope für Text, JetBrains Mono für Technik.
   Layout: Phone = Kopf (Woche/Tag), Inhalt, Tab-Leiste unten; ab 960px Seitenleiste. Jeder Trainingstag hat eine eigene Farbe. */
:root{--bg:#090a0e;--bg2:#1c1f27;--card:#15171d;--raise:#242833;--line:#262a35;--line2:#3a3f4d;--ink:#f5f5f6;--ink2:#c3c6cf;--mut:#a5aab6;--brand:#ed2438;--action:#d21c2f;--hi:#ff5a5f;--brand-soft:rgba(237,36,56,.12);--ok:#43c08a;--ok-soft:rgba(67,192,138,.12);--warn:#e39150;--warn-soft:rgba(227,145,80,.13);--cyan:#57c7d4;--sq:#f0625d;--bp:#e3b34c;--dl:#6e9fd6;--acc:#8e93a1;--day:#f0625d;--day-soft:rgba(240,98,93,.14);--d:"Archivo","Manrope",-apple-system,system-ui,sans-serif;--f:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--r-s:10px;--r-m:14px;--r-l:20px;--tab:64px;--sh:inset 0 1px 0 rgba(255,255,255,.04),0 12px 28px -20px rgba(0,0,0,.9);--ease:cubic-bezier(.2,.7,.2,1);--mo-1:.16s;--mo-2:.26s;--mo-3:.36s;--mo-ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{color:var(--ink)}
body{font-family:var(--f);font-weight:600;font-size:14.5px;line-height:1.45;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
body{padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.disp{font-family:var(--d);font-stretch:64%;font-weight:900;line-height:.95;letter-spacing:0;text-wrap:balance}
.zahl{font-family:var(--d);font-stretch:72%;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.zahl small{font-family:var(--f);font-size:.4em;font-weight:600;color:var(--mut);margin-left:3px}
/* ---------- Rahmen ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:grid;gap:10px}
.marke{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .3s}
.logo i{border-radius:50%}
.marke .mt{display:flex;flex-direction:column;min-width:0;flex:1}
.marke b{line-height:1.1;white-space:nowrap}
.marke span{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.sync.on i{background:var(--ok)}
.sync.err i{background:var(--warn)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:var(--r-s);background:transparent;color:var(--ink2);font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 2px;transition:background .2s}
.seg button small{font-size:11.5px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line2) inset}
.seg button[aria-pressed="true"] small{color:var(--ink2)}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.st.done{background:var(--ok)}
.st.part{background:var(--warn)}
body.tmr main{padding-bottom:calc(var(--tab) + 120px + env(safe-area-inset-bottom,0px))}
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tab) + 40px + env(safe-area-inset-bottom,0px))}
#view{display:grid;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.nav button{position:relative;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;transition:color .2s var(--ease),background .2s}

@media (min-width:960px){.nav{top:0;right:auto;width:224px;height:auto;display:flex;flex-direction:column;gap:4px;padding:calc(150px + env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px));border-top:0;border-right:1px solid var(--line);background:rgba(12,16,22,.96)}
.nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;font-size:14px}
.nav button[aria-current="page"]{background:var(--card)}

.top{padding-left:224px}
main{padding-left:calc(224px + 36px);padding-right:36px;max-width:calc(1180px + 224px)}
.tbar{left:224px!important}}
/* ---------- Karten ---------- */
.card{position:relative;min-width:0;padding:18px}
.ct{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.h2{font-family:var(--d);font-stretch:104%;font-weight:750}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.red{background:var(--brand-soft);border-color:transparent;color:var(--hi)}
.chip.day{border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--bg2);font-weight:700;font-size:14px;color:var(--ink);transition:border-color .2s,background .2s,transform .12s}
.btn:hover{border-color:var(--mut)}
.btn:active{transform:scale(.98)}
.btn.primary{color:#fff}
.btn.klein{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.aktionen{display:flex;flex-wrap:wrap;gap:8px}
.aktionen .primary{flex:1 1 220px}
/* Tageskopf */
.hero{padding:20px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--day) 22%,transparent),transparent);pointer-events:none}
.hero .disp{font-size:clamp(34px,10vw,52px);margin-top:6px}
.hero .disp span{color:var(--day)}
/* Tagesinfo */
details.info>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}

details.info>summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s var(--ease)}

.hinw li::before{counter-increment:h;content:counter(h);width:24px;height:24px;border-radius:50%;background:var(--day-soft);color:var(--day);font-weight:800;font-size:12px;display:grid;place-items:center}
.sec{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--mut);margin:18px 0 6px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}

.pl.ok{color:var(--ok)}
/* Übungsblock */
.blk{display:grid;gap:12px}
.blk.opt{border-style:dashed}

.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;justify-items:center}

/* ================= Feinschliff ================= */
:root{--hair:rgba(255,255,255,.075);--hair2:rgba(255,255,255,.12);--goldline:rgba(226,176,74,.34);--ease2:cubic-bezier(.2,.8,.2,1)}
html{-webkit-tap-highlight-color:transparent}
#gym [data-step],[data-t="add"]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
/* Lesbarkeit: Fließ- und Nebentexte kräftiger */
:where(small,.mut,.note,.note2,.pts,.rx,.tsub,.rpedesc,.ghy,.phs,.mprog,.marke>div>span,.marke>span,.plc-m span,label,td,th,li,input,textarea,select){font-weight:600}
:where(p){font-weight:600}
.mtred span{font-weight:inherit!important;font-size:inherit!important;white-space:nowrap;overflow:visible}
svg text{font-weight:600}
.progsw button small{font-size:11px!important}
::selection{background:rgba(237,36,56,.35)}
.zahl,.num,[data-count],.tt,.gtm-t b,.stp input{font-variant-numeric:tabular-nums}
/* Karten: ruhiger, edler */
.card{border-radius:20px!important;border:1px solid var(--hair)!important}
.card:not(.hero)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,220,150,.035),transparent 38%)}
.lt-only>.card::after,.gym .gdock .card::after{display:none}
.hero.card,.card.hero,.card.rep{border-color:var(--goldline)!important}
/* Überschriften */
.eyebrow{text-transform:uppercase;letter-spacing:.12em!important;font-weight:800!important;color:#a39a88}
.h2{letter-spacing:-.005em}
.sect{display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.sect::before{content:"";width:4px;height:20px;border-radius:3px;background:linear-gradient(180deg,#ff5a68,#c4121f);box-shadow:0 0 12px rgba(237,36,56,.5)}
/* Interaktion */
button,.btn,.cta,.prow,.tlc,.iconbtn{transition:transform .14s var(--ease2),background-color .2s,border-color .2s,box-shadow .2s,opacity .2s}
button:active:not(:disabled),.btn:active,.cta:active{transform:scale(.975)}
:focus-visible{outline:2px solid #e2b04a!important;outline-offset:2px}
button:disabled{opacity:.42}
/* Bottom-Navigation */
.nav{-webkit-backdrop-filter:blur(20px) saturate(160%)!important;backdrop-filter:blur(20px) saturate(160%)!important;border-top:0!important;box-shadow:0 -1px 0 rgba(255,255,255,.06),0 -20px 40px -20px rgba(0,0,0,.9)}
.nav::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(226,176,74,.45),transparent)}
.nav button{letter-spacing:.01em}
.nav button:not([aria-current="page"]){color:#8d8a84}
/* Leere Zustände */
.leer{border:1px dashed rgba(255,255,255,.1)!important;background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 8px,transparent 8px 16px)!important;color:#8f8b83!important;border-radius:14px!important}
/* Kopfzeile */
.top{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05)!important}
/* Listenzeilen */
.prow{border-radius:14px}
.prbtn:active{background:rgba(255,255,255,.03)}
/* WHOOP-Zeile auf Heute */
.fsc .gp{display:flex!important;width:100%;align-items:center;gap:12px;padding:10px 12px!important;border-radius:14px!important;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015))!important;border:1px solid var(--hair2)!important;text-align:left}
.lt .eyebrow,.glowt .eyebrow{letter-spacing:.05em!important;font-size:11px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbcap .eyebrow{white-space:nowrap}
/* Wochen-/Blocklabel in der Zeitleiste */
.tlh{gap:7px!important;font-size:14px!important;line-height:1;padding:2px 0 3px}
.tlh .tlwk{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.04em;color:#1a1408;background:linear-gradient(180deg,#f3d27a,#c9962f);padding:4px 7px 3px;border-radius:7px;box-shadow:0 0 12px -2px rgba(226,176,74,.5)}
.tlh .tln{font-family:var(--d);font-weight:800;font-size:15px;color:#f2f0ea!important;letter-spacing:-.005em}
.tlh .tlp{width:52px!important;height:5px!important;border-radius:3px!important;background:rgba(255,255,255,.08)!important}
.tlw:not(.cur) .tlwk{background:rgba(255,255,255,.1);color:#d9d5cc;box-shadow:none}
.tlw:not(.cur) .tln{color:#b8b3a8!important}
.tlw.cur .tln{text-shadow:0 0 18px rgba(237,36,56,.35)}
/* Performance */
html.boot .top,html.boot #view,html.boot .nav{opacity:0}
.top,#view,.nav{transition:opacity .28s ease}
html.boot #view.enter>*{animation:none!important}
.top,.nav{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.top{background:#070706!important}
.nav{background:linear-gradient(180deg,#0d0c0a,#050505)!important}
.card:not(.hero)::after{display:none!important}
.card{background:linear-gradient(180deg,#171511 0%,#0d0c0a 40%,#0a0908 100%)!important}
#view>section:nth-child(n+4),#view>.card:nth-child(n+4){contain-intrinsic-size:auto 420px}
.gdock{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:linear-gradient(180deg,rgba(9,10,14,0),#0b0c10 18px)!important}
.gsync textarea{width:100%;margin-top:6px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--ink);padding:10px;font-family:var(--mono);font-size:12px;resize:vertical}
.gsync .gsl{display:block;margin-top:14px;font-size:13px;color:var(--ink2)}
.gsync #gsmsg{color:var(--ok);margin-top:6px}
/* WHOOP-Karte auf Heute */
.fsc .bbcap{border-top:0!important;margin-top:0!important;padding-top:0!important}
.wcard{padding:0!important;overflow:hidden;border-color:color-mix(in srgb,var(--zc) 45%,transparent)!important;background:linear-gradient(105deg,color-mix(in srgb,var(--zc) 20%,#0d0c0a) 0%,#0d0c0a 62%)!important}
.wcard.z-none{border-style:dashed!important;border-color:rgba(226,176,74,.55)!important;background:linear-gradient(105deg,rgba(226,176,74,.14),#0d0c0a 65%)!important}
.wc-btn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;width:100%;padding:16px;background:none;border:0;color:inherit;text-align:left;cursor:pointer}
.wc-ring{position:relative;width:64px;height:64px;display:grid;place-items:center}

.wc-t{display:grid;gap:3px;min-width:0}
.wc-t small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#a39a88}
.wc-t b{font-size:17px;font-weight:800;color:var(--zc);line-height:1.2}
.wcard.z-none .wc-t b{color:#f2f0ea}
.wc-t em{font-style:normal;font-size:12.5px;color:var(--ink2);line-height:1.35}

/* Flüssigkeit: teure Effekte global aus */
*,*::before,*::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.hpic{filter:none!important}
.marke b.mtred,.logo.lg2{filter:none!important}

.btn.ghost{background:transparent!important;border:1px solid rgba(255,255,255,.14)!important;color:var(--ink2)!important}

/* Erfolg/erledigt in Juggernaut-Hellblau statt Grün */

/* Juggernaut-Ideen 1–11 */
/* 11 Schrift */
html[data-theme=blue]{--d:"CFJ","Poppins","Manrope",system-ui,sans-serif;--f:"CFJ","Poppins","Manrope",system-ui,sans-serif}
/* 1 Readiness groß */
body.jx #view .card.jr.jx-jr{background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--zc) 34%,transparent),transparent 65%),linear-gradient(180deg,#10161a,#0b0d10)!important;border-color:color-mix(in srgb,var(--zc) 28%,#26272e)!important}
body.jx .jx-jr .jr-hero{display:grid!important;grid-template-columns:auto minmax(0,1fr)!important;align-items:end!important;gap:6px 14px!important;justify-items:start!important;text-align:left!important}
body.jx .jx-jr .jr-ring{width:auto!important;height:auto!important;display:block!important}

body.jx .jx-jr .jr-num{position:static!important;display:flex!important;align-items:baseline;gap:4px}
body.jx .jx-jr .jr-num b{font:900 104px/0.86 var(--d)!important;letter-spacing:-.04em!important;color:#fff!important;text-shadow:0 0 30px color-mix(in srgb,var(--zc) 45%,transparent)}
body.jx .jx-jr .jr-num em{font:500 30px var(--d)!important;color:#8e909a!important;font-style:normal}
body.jx .jx-jr .jr-side{grid-column:1/-1;display:grid!important;gap:2px;justify-items:start!important}

body.jx .jx-jr .jr-s{order:2;color:#c9cad1!important;font-size:15px!important}
body.jx .jx-jr .jr-d{position:absolute;right:18px;top:64px;justify-self:end;display:grid!important;justify-items:start;background:none!important;border:0!important}
body.jx .jx-jr .jr-d b{font:800 26px var(--d)!important;color:#fff!important}
body.jx .jx-jr .jr-d small{color:#8e909a!important;font-size:13px!important}
body.jx .jx-jr .jr-art{opacity:.55}
body.jx .jx-jr .jr-top span{letter-spacing:.14em!important}
/* 2 Raster */
body.jx #view .jx-grid{display:grid!important;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px;text-align:left;width:100%;padding:16px 16px 12px!important;color:#fff;font:inherit;cursor:pointer}
.jx-gl{display:grid}.jx-gl b{font:800 40px/1 var(--d)}.jx-gl span{font:700 20px var(--d);color:#8e909a;margin-top:2px}.jx-gl small{color:#8e909a;font-size:12.5px;margin-top:4px}
.jx-gg{display:grid;gap:7px 6px;justify-content:end}
.jx-gg b{font:600 11px var(--f);color:#8e909a;text-align:center}
.jx-gg i{width:22px;height:22px;border-radius:6px;border:1.6px solid #4a4c55;box-sizing:border-box}
.jx-gg i.ok{background:#5aaee8;border-color:#5aaee8}.jx-gg i.live{border-color:#5aaee8;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 10px #5aaee8}
.jx-more{grid-column:1/-1;justify-self:end;color:#5b7cff;font-weight:700;font-size:15px}

.jx-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.jx-th{display:flex;align-items:center;gap:6px;margin:0;color:#c9cad1;font-weight:700;font-size:15px}.jx-th svg{width:17px;height:17px;fill:none;stroke:#5b7cff;stroke-width:1.9}
.jx-t>b{font:800 24px var(--d)}.jx-t>small{color:#8e909a;font-size:12.5px}
.jx-ml{width:100%;height:46px;margin-top:8px}
.jx-ax{display:flex;justify-content:space-between;padding:4px 4px 0;color:#8e909a;font-size:12px;font-weight:600}
/* 4 Kraft */
.jx-max{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
body.jx #view .jx-m{position:relative;display:grid;gap:2px;justify-items:start;text-align:left;padding:14px 12px 12px!important;color:#fff;font:inherit;cursor:pointer;min-height:100px;align-content:start}
.jx-m b{font:800 22px var(--d)}.jx-m b em{font-style:normal;font-size:15px}.jx-m small{color:#c9cad1;font-size:13.5px;font-weight:600}.jx-m span{color:#8e909a;font-size:11.5px}
.jx-m svg{position:absolute;right:8px;top:14px;width:18px;height:18px;fill:none;stroke:#5b7cff;stroke-width:2.2}
/* 6 Fortsetzen */
.jx-res{position:fixed;left:24px;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:31;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:999px;border:1.5px solid rgba(255,255,255,.6);background:rgba(8,8,10,.94);color:#fff;font:inherit;box-shadow:0 12px 30px -10px #000}
.jx-res svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.2;background:#fff;stroke:#000;border-radius:50%;padding:3px;box-sizing:border-box}
.jx-res span{display:grid;text-align:left}.jx-res b{font:800 17px var(--d)}.jx-res small{color:#8e909a;font-size:12px}

.jx-sg{margin:10px 0 0;font:700 15px var(--f);color:#fff}

.jx-note b{font-size:15px}.jx-note span{display:flex;align-items:center;gap:6px;color:#5b7cff;font-weight:700;font-size:15px}.jx-note svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}

#gym .gl-top{position:sticky;top:0;z-index:5}
/* 8 Kalender */
body.jx #view .jx-cal{padding:16px!important;display:grid;gap:10px}
.jx-ch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}.jx-ch p{margin:0;flex:1 1 140px;min-width:0;color:#c9cad1;font-weight:700;font-size:15px}
.jx-vt{display:flex;gap:2px;padding:3px;border-radius:14px;background:#1a1b21}.jx-vt button{width:44px;height:36px;border:0;border-radius:11px;background:none;display:grid;place-items:center}.jx-vt button[aria-pressed=true]{background:#3d63f5}.jx-vt svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.8}
.jx-mh{display:flex;align-items:center;justify-content:center;gap:8px}.jx-mh b{font:800 19px var(--d);flex:0 1 190px;min-width:0;text-align:center}.jx-mh button{width:44px;height:44px;border:0;background:none;color:#fff;font-size:28px}
.jx-wd,.jx-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.jx-wd span{text-align:center;color:#8e909a;font-size:13px;font-weight:600}
.jx-days span{aspect-ratio:1.15;display:grid;place-items:center;border-radius:9px;font:600 15px var(--f);color:#fff;background:#0c1638}
.jx-days span.out{background:none;color:#4a4c55}.jx-days span.tr{background:#5aaee8;color:#fff;font-weight:800}.jx-days span.pl{background:#1b2c6e}.jx-days span.fu{background:none;border:1.6px solid #2e3038}.jx-days span.pa{background:#0c1638}
.jx-days span.td{box-shadow:0 0 0 2px #fff inset}
.jx-lg{display:flex;flex-wrap:wrap;gap:12px;margin:2px 0 0;color:#8e909a;font-size:12.5px}.jx-lg span{display:flex;align-items:center;gap:6px}.jx-lg i{width:12px;height:12px;border-radius:4px}.jx-lg i.tr{background:#5aaee8}.jx-lg i.pl{background:#1b2c6e}.jx-lg i.fu{border:1.5px solid #4a4c55}

html[data-theme=blue] body .sbi{background:transparent!important;box-shadow:none!important;border:0!important}
/* Hype wie Juggernaut-Legende: dunkle Pille, farbiger Punkt */
html[data-theme=blue] body .hype{background:#161a2a!important;border:0!important;box-shadow:inset 0 0 0 1px #262b3e!important;padding:5px 12px 5px 10px!important;border-radius:999px!important;gap:7px!important}

html[data-theme=blue] body .hype .hic{width:9px!important;height:9px!important;border-radius:50%!important;background:currentColor!important;box-shadow:none!important}

html[data-theme=blue] body .hype .htx b{font-weight:600!important;color:#fff!important}

/* Gym-Liste wie Juggernaut: große Übungstitel, viel Luft, Werkzeuge als schlichte Symbol-Leiste */

<script>
/* Candito Forever – App-Rahmen: Offline/Updates, Sicherungs-Erinnerung, Installationshinweis */
(function(){
  'use strict';
  var VERSION=window.CF_VERSION||'dev';
  var box=document.createElement('div');box.id='cfbar';box.setAttribute('role','status');document.body.appendChild(box);
  function show(html,cls){box.className='cfbar '+(cls||'');box.innerHTML=html;box.hidden=false}
  function hide(){box.hidden=true;box.innerHTML=''}
  hide();

  /* ---------- Service Worker: offline + Updates ---------- */
  var waiting=null,reloading=false,wantReload=false;
  var tried=0;try{tried=+sessionStorage.getItem('cf-upd-tried')||0}catch(e){}
  function offerUpdate(w,ver){waiting=w||waiting;if(document.body.classList.contains('gymopen')){offerUpdate.later=true;return}show('<div class="cft"><b>Neue Version verfügbar</b><small>'+(ver?'Version '+ver+' · ':'')+'Deine Daten bleiben erhalten.</small></div><button type="button" data-cf="upd">Aktualisieren</button>'+(tried?'<button type="button" data-cf="force">Erzwingen</button>':''),'upd')}
  /* Harter Weg, wenn der normale Wechsel hängt: Service Worker abmelden, App-Cache leeren, Seite frisch vom Server laden. Trainingsdaten (localStorage/IndexedDB) bleiben unberührt. */
  function forceUpdate(){try{sessionStorage.removeItem('cf-upd-tried')}catch(e){}
    var done=false,go=function(){if(done)return;done=true;location.replace(location.pathname+'?fresh='+Date.now())};
    setTimeout(go,4000);
    var p1=('serviceWorker' in navigator)?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}).catch(function(){}):Promise.resolve();
    var p2=('caches' in window)?caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('cf-app-')===0}).map(function(k){return caches.delete(k)}))}).catch(function(){}):Promise.resolve();
    Promise.all([p1,p2]).then(go,go)}
  window.CF_FORCE_UPDATE=forceUpdate;
  try{if(location.search.indexOf('fresh=')>=0)history.replaceState(null,'',location.pathname)}catch(e){}
  document.addEventListener('click',function(e){if(e.target.closest('[data-cf-force]')){forceUpdate()}});
  /* Zusätzlich zur Service-Worker-Meldung: version.json direkt prüfen (ohne Cache) – falls der Worker-Wechsel hängt. */
  function checkVersion(){try{fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j&&j.version&&j.version!==VERSION&&box.hidden)offerUpdate(null,j.version)}).catch(function(){})}catch(e){}}
  setTimeout(checkVersion,6000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')setTimeout(checkVersion,800)});
  setInterval(function(){if(offerUpdate.later&&!document.body.classList.contains('gymopen')){offerUpdate.later=false;offerUpdate()}},3000);
  if('serviceWorker' in navigator&&location.protocol!=='file:'){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      if(reg.waiting&&navigator.serviceWorker.controller)offerUpdate(reg.waiting);
      reg.addEventListener('updatefound',function(){var nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',function(){if(nw.state==='installed'&&navigator.serviceWorker.controller)offerUpdate(nw)})});
      var check=function(){reg.update().catch(function(){})};
      document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check()});
      setInterval(check,30*60*1000);
    }).catch(function(){});
    var hadCtrl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloading)return;if(wantReload){reloading=true;location.reload();return}if(hadCtrl)offerUpdate(null);hadCtrl=true});
  }

  /* ---------- Erinnerung: Sicherung in iCloud ---------- */
  function lastExport(){try{return +localStorage.getItem('cf-lastexport')||0}catch(e){return 0}}
  function snoozed(){try{return +localStorage.getItem('cf-bksnooze')||0}catch(e){return 0}}
  function hasData(){try{return typeof totalOk==='function'&&totalOk()>0}catch(e){return false}}
  function checkBackup(){
    if(!box.hidden&&box.classList.contains('upd'))return;
    var d=Date.now(),le=lastExport();
    if(box.classList.contains('bk'))hide();return; /* Erinnerung erscheint jetzt als Karte auf „Heute“ */
    if(!hasData()||d-le<7*864e5||d<snoozed()){if(box.classList.contains('bk'))hide();return}
    show('<div class="cft"><b>Sicherung fällig</b><small>'+(le?'Letzte iCloud-Sicherung vor '+Math.floor((d-le)/864e5)+' Tagen':'Noch keine Sicherung in iCloud gespeichert')+'</small></div><button type="button" data-cf="bk">Jetzt sichern</button><button type="button" class="x" data-cf="later" aria-label="Später erinnern">✕</button>','bk');
  }
  window.addEventListener('cf-exported',function(){if(box.classList.contains('bk'))hide()});
  setTimeout(checkBackup,4000);setInterval(checkBackup,60*1000);

  box.addEventListener('click',function(e){var b=e.target.closest('[data-cf]');if(!b)return;var a=b.dataset.cf;
    if(a==='force'){b.disabled=true;b.textContent='Lädt …';forceUpdate();return}
    if(a==='upd'){wantReload=true;b.disabled=true;b.textContent='Lädt …';try{sessionStorage.setItem('cf-upd-tried',String(tried+1))}catch(err){}
      navigator.serviceWorker.getRegistration().then(function(r){var w=(r&&r.waiting)||(waiting&&waiting.state!=='redundant'?waiting:null);if(w&&w.state!=='activated'){w.postMessage('skip')}else{reloading=true;location.reload()}}).catch(function(){location.reload()});
      setTimeout(function(){if(!reloading){reloading=true;location.reload()}},2500)}
    if(a==='bk'){try{downloadBackup()}catch(err){}}
    if(a==='later'){try{localStorage.setItem('cf-bksnooze',String(Date.now()+2*864e5))}catch(err){}hide()}
  });

  /* ---------- Hinweis: zum Home-Bildschirm hinzufügen (nur Safari, nicht installiert) ---------- */
  var standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  document.documentElement.classList.toggle('cf-standalone',standalone);
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  try{if(ios&&!standalone&&!localStorage.getItem('cf-installhint')){
    setTimeout(function(){if(!box.hidden)return;show('<div class="cft"><b>Als App installieren</b><small>Tippe unten auf <span class="sh">Teilen</span> und dann „Zum Home-Bildschirm“.</small></div><button type="button" class="x" data-cf="later" aria-label="Schließen">✕</button>','inst');localStorage.setItem('cf-installhint','1')},2500)
  }}catch(e){}

  window.CF_APP={version:VERSION,checkBackup:checkBackup};
})();

</script>
