<script>window.CF_VERSION="2026.10.21-0646-8628f55";
/* Candito Forever – PWA-Schicht.
   Ersetzt die claude.ai-Laufzeit (window.claude.use) durch lokale Gegenstücke:
   - 'db'        → Datenbank im Gerätespeicher (IndexedDB), gleiche Schnittstelle wie in der Claude-Version
   - 'downloads' → iOS-Teilen-Menü („In Dateien sichern“ / iCloud Drive), sonst normaler Download
   - 'sample'    → nicht verfügbar (Claude-Analyse und Bild-Lesen gibt es nur in der Claude-Version) */
(function(){
  'use strict';
  var DBN='candito-forever', ST='docs', MAXBK=60;
  var idb=null, mem=new Map(), listeners=[];
  var clone=function(v){return v===undefined?undefined:JSON.parse(JSON.stringify(v))};
  var opened=new Promise(function(res){
    try{var r=indexedDB.open(DBN,1);
      r.onupgradeneeded=function(){r.result.createObjectStore(ST)};
      r.onsuccess=function(){idb=r.result;res()};
      r.onerror=function(){res()};r.onblocked=function(){res()};
    }catch(e){res()}
  });
  var loaded=opened.then(function(){return new Promise(function(res){
    if(!idb)return res();
    try{var rq=idb.transaction(ST).objectStore(ST).openCursor();
      rq.onsuccess=function(){var c=rq.result;if(c){mem.set(String(c.key),c.value);c.continue()}else res()};
      rq.onerror=function(){res()};
    }catch(e){res()}
  })});
  function tx(fn){if(!idb)return Promise.resolve();return new Promise(function(res,rej){try{var t=idb.transaction(ST,'readwrite');fn(t.objectStore(ST));t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};t.onabort=function(){rej(t.error)}}catch(e){rej(e)}})}
  function colOf(p){return p.slice(0,p.indexOf('/'))}
  function colSnap(n){var docs=[];mem.forEach(function(v,k){if(colOf(k)===n){var id=k.slice(n.length+1);docs.push({id:id,exists:true,data:function(){return clone(v)}})}});return {docs:docs,size:docs.length,empty:!docs.length}}
  function docSnap(p){var v=mem.get(p);return {id:p.split('/').pop(),exists:v!==undefined,data:function(){return clone(v)}}}
  function notify(p){var c=colOf(p);listeners.slice().forEach(function(l){if(l.t==='c'&&l.n===c)setTimeout(function(){l.cb(colSnap(c))},0);else if(l.t==='d'&&l.n===p)setTimeout(function(){l.cb(docSnap(p))},0)})}
  function prune(){var ks=[];mem.forEach(function(v,k){if(colOf(k)==='backup')ks.push(k)});if(ks.length<=MAXBK)return;ks.sort();var del=ks.slice(0,ks.length-MAXBK);del.forEach(function(k){mem.delete(k)});tx(function(s){del.forEach(function(k){s.delete(k)})}).catch(function(){})}
  function listen(t,n,cb){var l={t:t,n:n,cb:cb};listeners.push(l);loaded.then(function(){if(listeners.indexOf(l)>=0)cb(t==='c'?colSnap(n):docSnap(n))});return function(){var i=listeners.indexOf(l);if(i>=0)listeners.splice(i,1)}}
  function docRef(p){return {
    id:p.split('/').pop(),
    set:function(data,opt){return loaded.then(function(){var v=(opt&&opt.merge)?Object.assign({},mem.get(p)||{},clone(data)):clone(data);mem.set(p,v);notify(p);var w=tx(function(s){s.put(v,p)});if(colOf(p)==='backup')prune();return w})},
    update:function(data){return this.set(data,{merge:true})},
    delete:function(){return loaded.then(function(){mem.delete(p);notify(p);return tx(function(s){s.delete(p)})})},
    get:function(){return loaded.then(function(){return docSnap(p)})},
    onSnapshot:function(cb){return listen('d',p,cb)}
  }}
  var db={
    collection:function(n){return {onSnapshot:function(cb){return listen('c',n,cb)},doc:function(id){return docRef(n+'/'+id)},get:function(){return loaded.then(function(){return colSnap(n)})}}},
    doc:function(p){return docRef(p)}
  };
  var downloads={save:function(o){
    var name=o.filename||'datei.txt',type=o.mimeType||(/\.json$/.test(name)?'application/json':/\.csv$/.test(name)?'text/csv':'text/plain');
    var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:type});
    var mark=function(){if(/sicherung/.test(name)){try{localStorage.setItem('cf-lastexport',String(Date.now()))}catch(e){}window.dispatchEvent(new Event('cf-exported'))}};
    var file=null;try{file=new File([blob],name,{type:type})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:name}).then(mark)
    }
    mark();
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);return Promise.resolve();
  }};
  window.claude={use:function(n){return Promise.resolve(n==='db'?db:n==='downloads'?downloads:null)}};
  window.CF_PWA={db:db,loaded:loaded};
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();

<script>/* Fehlerprotokoll: unerwartete Fehler nur auf diesem Gerät mitschreiben (max. 30, gleiche zusammengezählt) – keine Trainingsdaten */
(function(){var K='cf-errlog';function rd(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}}
function add(msg,src,stk){try{msg=String(msg||'Fehler').slice(0,240);var l=rd(),v='';try{var u=typeof S!=='undefined'&&S&&S.ui;v=u?(document.body&&document.body.classList.contains('gymopen')?'gym':u.tab||''):''}catch(e){}
 var key=msg+'|'+(src||'');for(var i=0;i<l.length;i++){if(l[i].k===key){l[i].n=(l[i].n||1)+1;l[i].t=Date.now();l[i].v=v||l[i].v;l.unshift(l.splice(i,1)[0]);localStorage.setItem(K,JSON.stringify(l));return}}
 l.unshift({k:key,m:msg,s:src||'',st:String(stk||'').split('\n').slice(0,4).join('\n').slice(0,600),t:Date.now(),v:v,ver:window.CF_VERSION||'',n:1});localStorage.setItem(K,JSON.stringify(l.slice(0,30)))}catch(e){}}
window.cfErr={add:add,list:rd,clear:function(){try{localStorage.removeItem(K)}catch(e){}}};
addEventListener('error',function(e){if(!e||e.target&&e.target!==window&&e.target.tagName)return;var f=String(e.filename||'').split('/').pop();add(e.message,f?f+':'+e.lineno+':'+e.colno:'',e.error&&e.error.stack)},true);
addEventListener('unhandledrejection',function(e){var r=e&&e.reason;if(r&&r.name==='AbortError')return;add('Promise: '+(r&&r.message||r),'',r&&r.stack)})})();</script>

<style>
/* Gestaltung angelehnt an das Powerlifting Coach Cockpit: ein dunkles Erscheinungsbild, Karten mit 20px Radius,
   Archivo (kondensiert) für Leistungszahlen, Manrope für Text, JetBrains Mono für Technik.
   Layout: Phone = Kopf (Woche/Tag), Inhalt, Tab-Leiste unten; ab 960px Seitenleiste. Jeder Trainingstag hat eine eigene Farbe. */
:root{--bg:#090a0e;--bg2:#1c1f27;--card:#15171d;--raise:#242833;--line:#262a35;--line2:#3a3f4d;--ink:#f5f5f6;--ink2:#c3c6cf;--mut:#a5aab6;--brand:#ed2438;--action:#d21c2f;--hi:#ff5a5f;--brand-soft:rgba(237,36,56,.12);--ok:#43c08a;--ok-soft:rgba(67,192,138,.12);--warn:#e39150;--warn-soft:rgba(227,145,80,.13);--cyan:#57c7d4;--sq:#f0625d;--bp:#e3b34c;--dl:#6e9fd6;--acc:#8e93a1;--day:#f0625d;--day-soft:rgba(240,98,93,.14);--d:"Archivo","Manrope",-apple-system,system-ui,sans-serif;--f:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--r-s:10px;--r-m:14px;--r-l:20px;--tab:64px;--sh:inset 0 1px 0 rgba(255,255,255,.04),0 12px 28px -20px rgba(0,0,0,.9);--ease:cubic-bezier(.2,.7,.2,1);--mo-1:.16s;--mo-2:.26s;--mo-3:.36s;--mo-ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{color:var(--ink)}
body{font-family:var(--f);font-weight:600;font-size:14.5px;line-height:1.45;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
body{padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.disp{font-family:var(--d);font-stretch:64%;font-weight:900;line-height:.95;letter-spacing:0;text-wrap:balance}
.zahl{font-family:var(--d);font-stretch:72%;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.zahl small{font-family:var(--f);font-size:.4em;font-weight:600;color:var(--mut);margin-left:3px}
/* ---------- Rahmen ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:grid;gap:10px}
.marke{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .3s}
.logo i{border-radius:50%}
.marke .mt{display:flex;flex-direction:column;min-width:0;flex:1}
.marke b{line-height:1.1;white-space:nowrap}
.marke span{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.sync.on i{background:var(--ok)}
.sync.err i{background:var(--warn)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:var(--r-s);background:transparent;color:var(--ink2);font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 2px;transition:background .2s}
.seg button small{font-size:11.5px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line2) inset}
.seg button[aria-pressed="true"] small{color:var(--ink2)}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.st.done{background:var(--ok)}
.st.part{background:var(--warn)}
body.tmr main{padding-bottom:calc(var(--tab) + 120px + env(safe-area-inset-bottom,0px))}
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tab) + 40px + env(safe-area-inset-bottom,0px))}
#view{display:grid;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
.nav button{position:relative;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;transition:color .2s var(--ease),background .2s}

@media (min-width:960px){.nav{top:0;right:auto;width:224px;height:auto;display:flex;flex-direction:column;gap:4px;padding:calc(150px + env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px));border-top:0;border-right:1px solid var(--line);background:rgba(12,16,22,.96)}
.nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;font-size:14px}
.nav button[aria-current="page"]{background:var(--card)}
.nav button[aria-current="page"]::before{top:12px;bottom:12px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
.top{padding-left:224px}
main{padding-left:calc(224px + 36px);padding-right:36px;max-width:calc(1180px + 224px)}
.tbar{left:224px!important}}
/* ---------- Karten ---------- */
.card{position:relative;min-width:0;padding:18px}
.ct{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.h2{font-family:var(--d);font-stretch:104%;font-weight:750}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.red{background:var(--brand-soft);border-color:transparent;color:var(--hi)}
.chip.day{border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--bg2);font-weight:700;font-size:14px;color:var(--ink);transition:border-color .2s,background .2s,transform .12s}
.btn:hover{border-color:var(--mut)}
.btn:active{transform:scale(.98)}
.btn.primary{color:#fff}
.btn.klein{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.aktionen{display:flex;flex-wrap:wrap;gap:8px}
.aktionen .primary{flex:1 1 220px}
/* Tageskopf */
.hero{padding:20px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--day) 22%,transparent),transparent);pointer-events:none}
.hero .disp{font-size:clamp(34px,10vw,52px);margin-top:6px}
.hero .disp span{color:var(--day)}
/* Tagesinfo */
details.info>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}

details.info>summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s var(--ease)}

.hinw li::before{counter-increment:h;content:counter(h);width:24px;height:24px;border-radius:50%;background:var(--day-soft);color:var(--day);font-weight:800;font-size:12px;display:grid;place-items:center}
.sec{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--mut);margin:18px 0 6px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}

.pl.ok{color:var(--ok)}
/* Übungsblock */
.blk{display:grid;gap:12px}
.blk.opt{border-style:dashed}

.durin input:focus{outline:0;border-color:var(--day)}
.durin small{font-size:11px;color:var(--mut)}
.wnav{display:flex;gap:6px}
.wnav .iconbtn[disabled]{opacity:.35}
.wt-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 14px}
.wt-sum>div{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);min-width:0}
.wt-sum .zahl{white-space:nowrap}
.wt-sum .zahl small{display:inline;margin-left:3px}
.wt-sum>div>small{display:block;font-size:11.5px;font-weight:700;color:var(--mut)}
.wt-sum .zahl{font-size:26px;display:block;margin-top:2px}
.wbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.wbc{display:grid;justify-items:center;gap:6px;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.wbv{font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap}
.wbv em{font-style:normal}
.wbt{position:relative;width:100%;max-width:58px;height:120px;border-radius:12px;background:rgba(255,255,255,.035);overflow:hidden}
.wbt .pl{position:absolute;left:0;right:0;bottom:0;border:1.5px dashed color-mix(in srgb,var(--c) 45%,transparent);border-bottom:0;border-radius:10px 10px 0 0}
.wbt .fl{position:absolute;left:5px;right:5px;bottom:0;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));box-shadow:0 0 18px -4px var(--c);transition:height .6s var(--ease)}
.wbc small{font-size:12px;font-weight:800;color:var(--mut)}
.wbc.run .fl{background:linear-gradient(180deg,var(--ok),rgba(67,192,138,.35))}
@media (prefers-reduced-motion:no-preference){.wbc.run .fl{animation:puls2 1.6s ease-in-out infinite}}
.fx.sum .eyebrow{color:var(--ok)}
@media (max-width:420px){.srow{grid-template-columns:24px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:5px}
.ck{width:44px}
.kr .zahl{font-size:28px}
.card{padding:16px}}
/* ===================== Glas-Ebene ===================== */
:root{--glass:linear-gradient(140deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 45%,rgba(255,255,255,.02));--glass-b:rgba(255,255,255,.15);--glass-hl:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.35)}
.sheet-in,.fx-in,.tbar-in,.toast,.tipbox{background:var(--glass),rgba(20,22,29,.52)!important;-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--glass-b)!important;box-shadow:var(--glass-hl),0 30px 70px -24px rgba(0,0,0,.85)!important;position:relative;overflow:hidden}
.sheet-in::before,.fx-in::before,.tbar-in::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 60% at 15% -10%,rgba(255,255,255,.16),transparent 55%),radial-gradient(80% 40% at 100% 0%,color-mix(in srgb,var(--day) 18%,transparent),transparent 60%)}
.sheet-in>*,.fx-in>*,.tbar-in>*{position:relative}
.sheet{background:rgba(4,5,8,.38)!important;-webkit-backdrop-filter:blur(3px)!important;backdrop-filter:blur(3px)!important}
.sheet-in{border-bottom:0!important}
.fx.pr{background:rgba(4,5,8,.42)!important;-webkit-backdrop-filter:blur(4px)!important;backdrop-filter:blur(4px)!important}
.fx.pr .fx-in{box-shadow:var(--glass-hl),0 0 0 1px rgba(240,185,15,.35),0 30px 90px -20px rgba(240,185,15,.35)!important}
.fx.sum .fx-in{box-shadow:var(--glass-hl),0 0 0 1px rgba(67,192,138,.35),0 30px 90px -20px rgba(67,192,138,.35)!important}
.fx.done .fx-in{box-shadow:var(--glass-hl),0 0 0 1px rgba(67,192,138,.3),0 24px 60px -20px rgba(67,192,138,.4)!important}
.tbar-in{border-radius:20px}
.tbar.over .tbar-in{box-shadow:var(--glass-hl),0 0 0 1px var(--brand),0 20px 50px -18px rgba(237,36,56,.6)!important}
.toast{color:var(--ink)!important;border-radius:999px}
.tipbox{color:var(--ink)!important}
.sheet-in .next,.sheet-in .card,.sheet-in .kpis>div{background:rgba(255,255,255,.05)!important;border-color:rgba(255,255,255,.1)!important;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)!important}
.sheet-in .presets button,.sheet-in .rbtn,.sheet-in .tog,.sheet-in .iconbtn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}
.sheet-in .play{background:rgba(255,255,255,.92);box-shadow:0 10px 30px -10px rgba(255,255,255,.4)}
/* Gym-Knopf als Glaslinse */
.nav .fab span{background:radial-gradient(circle at 32% 26%,rgba(255,150,155,.95),rgba(225,30,50,.78) 52%,rgba(110,8,20,.85))!important;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -6px 12px rgba(80,0,10,.55),0 0 0 1px rgba(255,255,255,.18),0 12px 28px -8px rgba(237,36,56,.8),0 0 0 4px rgba(9,10,14,.6)!important;position:relative;overflow:hidden}
.nav .fab span::after{content:"";position:absolute;left:18%;top:9%;width:46%;height:30%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0));pointer-events:none}
@media (min-width:960px){.nav .fab span{background:none!important;box-shadow:none!important;backdrop-filter:none}
.nav .fab span::after{display:none}}
/* Zeitleiste in Glas */
.tlc{border-color:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tlc.done:not(.sel){background:linear-gradient(180deg,rgba(67,192,138,.2),rgba(67,192,138,.04)),rgba(20,22,29,.45)}
.iconbtn{background:var(--glass),rgba(20,22,29,.5);border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.sync{background:var(--glass),rgba(20,22,29,.5);border-color:rgba(255,255,255,.12)}
/* Hype & Hinweise in Glas */
.gpill{border-color:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.whint2{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sessbtn.start{color:#fff;background:linear-gradient(135deg,#ff4d55,var(--action));border-color:transparent;font-family:var(--f);font-weight:800}
.sessbtn.start svg{fill:#fff}
.sessbtn.done{color:var(--mut);border-color:var(--line2);background:rgba(255,255,255,.04)}
.sbi{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff4d55,var(--action));box-shadow:0 8px 20px -6px rgba(237,36,56,.8)}
.sbi svg{width:22px;height:22px;fill:#fff}
.lico.img{background:none;box-shadow:none;border-radius:0}
.lico.img img{width:108%;height:108%;max-width:none;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.lt img.licoimg{width:34px;height:34px;display:block;margin-bottom:4px}
/* Performance: Unschärfe nur noch auf schwebenden Elementen */
.card,.tlc,.gpill,.whint2,.gp,.iconbtn,.sync{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.amb i{will-change:auto}
.amb{contain:strict}
.bb3d{contain:layout paint}
.adh{margin:0;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--raise)}
.adh>b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.adh.hit{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft)}
.adh.hit>b{color:var(--ok)}
.adh.miss{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-soft)}
.adh.miss>b{color:var(--warn)}
.adh>div{display:flex;flex-wrap:wrap;gap:8px}
.adh span{display:inline-flex;flex-direction:column;padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.25);font-weight:700;font-size:14px}
.adh span small{font-weight:600;font-size:11.5px;color:var(--mut)}
.adh span.ok{color:var(--ok)}
.adh span.off{color:var(--warn)}
.calh{margin:10px 2px 0;font-size:12.5px;line-height:1.45;color:var(--mut);padding:8px 10px;border-radius:12px;background:var(--warn-soft)}
.calh b{color:var(--ink)}
.adk{display:flex;gap:16px;align-items:center}
.adr{position:relative;flex:none;width:96px;height:96px}
.adr>b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px}
.adr>b small{font-size:13px;margin-left:1px}
.adws{display:grid;gap:10px;margin-top:16px}
.adw{display:grid;grid-template-columns:34px 1fr 1fr;gap:10px;align-items:center}
.adw>b{font-family:var(--m);font-size:13px;color:var(--mut)}
.adw.dim{grid-template-columns:34px 1fr;opacity:.55}
.adw.dim small{font-size:12.5px;color:var(--mut)}
.adb{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.adb span{font-size:11.5px;color:var(--mut)}
.adb em{font-style:normal;font-family:var(--m);font-size:12.5px;grid-row:1}
.adb i{grid-column:1/-1;height:6px;border-radius:4px;background:var(--raise);position:relative;overflow:hidden}
.adb i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--v);background:var(--c);border-radius:4px}
.adl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.adl li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.adl li .dot{margin-top:6px}
.adl small{display:block;color:var(--warn);font-size:12.5px;margin-top:2px}
.cals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.cal{padding:12px;border-radius:16px;background:var(--raise);border-top:3px solid var(--c)}
.cal>b{display:block;font-size:16px;margin-top:4px}
.cal>b.ok{color:var(--ok)}
.cal>b.warn{color:var(--warn)}
.cal>small{display:block;font-size:12px;color:var(--mut);margin-top:2px;min-height:2.6em}
.calbar{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;margin-top:10px;font-size:11px;color:var(--mut)}
.calbar i{position:relative;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--warn),var(--ok) 35%,var(--ok) 65%,var(--warn))}
.calbar em{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--bg,#0b0c10);transform:translate(-50%,-50%)}
.tab.rec{font-size:13px}
.tab.rec td,.tab.rec th{white-space:nowrap;padding-left:6px;padding-right:6px}
.tab.rec td:first-child{white-space:normal;padding-left:0}
.tab.rec th:first-child{padding-left:0}
/* ---- Hype-Badges v2 ---- */
.hype{position:relative;display:inline-flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:14px;line-height:1;white-space:nowrap;box-shadow:none;font-size:inherit;overflow:hidden;isolation:isolate}
.hype::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 55%);pointer-events:none;z-index:-1}
.hype .hic{display:grid;place-items:center;width:28px;height:28px;border-radius:10px;flex:none}
.hype .hic svg{width:17px;height:17px;fill:currentColor}
.hype .htx{display:flex;flex-direction:column;gap:2px}
.hype .htx small{font-family:var(--m);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.hype .htx b{font-family:var(--d);font-size:14px;font-weight:800;letter-spacing:.01em}
.hype .hmt{display:inline-flex;gap:3px;margin-left:3px}
.hype .hmt i{width:5px;height:16px;border-radius:3px;background:currentColor;opacity:.22;transform:skewX(-14deg)}
.hype.l .hmt i:nth-child(1),.hype.m .hmt i:nth-child(-n+2),.hype.h .hmt i{opacity:1}
/* hoch: Feuer */
.hype.h{color:#fff;background:linear-gradient(135deg,#ff6a3d 0%,#ed2438 55%,#b3122a 100%);box-shadow:0 0 0 1px rgba(255,120,90,.55) inset,0 6px 20px -6px rgba(237,36,56,.75)}
.hype.h .hic{background:rgba(0,0,0,.22);color:#ffd27a;box-shadow:0 0 12px -2px rgba(255,190,90,.8)}
.hype.h .hmt i{background:#fff}
/* moderat: Blitz */
.hype.m{color:#ffb36b;background:linear-gradient(135deg,rgba(227,145,80,.24),rgba(227,145,80,.08));box-shadow:0 0 0 1px rgba(227,145,80,.5) inset}
.hype.m .hic{background:linear-gradient(135deg,#f0a35e,#d9772e);color:#2a1606}
/* niedrig: ruhig */
.hype.l{color:#7fd8e3;background:rgba(87,199,212,.07);box-shadow:0 0 0 1px rgba(87,199,212,.28) inset}
.hype.l::after{display:none}
.hype.l .hic{background:rgba(87,199,212,.14);color:var(--cyan)}
.hype.l .htx b{font-weight:700}
@media (prefers-reduced-motion:no-preference){.hype.h .hic svg{animation:flk 2.4s ease-in-out 3;transform-origin:50% 90%}
@keyframes flk{0%,100%{transform:scale(1)}50%{transform:scale(1.08) rotate(-2deg)}}}
.bkl{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.bkl li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:var(--raise)}
.bkl li span{display:flex;flex-direction:column;gap:2px;min-width:0}
.bkl li b{font-size:14px}
.bkl li small{font-size:12px;color:var(--mut)}
.btn.sm{padding:7px 12px;font-size:13px;min-height:0}
/* ===================== LUX: Schwarz-Gold (Referenzdesign) ===================== */
:root{--gold:#e2b04a;--gold2:#f6d58a;--gold-d:#9c7426;--gold-l:rgba(226,176,74,.34);--gold-s:rgba(226,176,74,.12);--bg:#050505;--card:#0d0c0a;--raise:#17150f;--line:#24211a;--line2:#3a3426}
html,body{background:#050505}
body::after{background:radial-gradient(120% 60% at 50% -10%,rgba(226,176,74,.10),transparent 60%),radial-gradient(80% 50% at 100% 100%,rgba(226,176,74,.05),transparent 70%)!important}
.amb{display:none}
.logo{background:radial-gradient(circle at 35% 30%,var(--gold2),var(--gold) 45%,var(--gold-d))!important;box-shadow:0 0 0 2px rgba(0,0,0,.6) inset,0 0 18px -4px rgba(226,176,74,.7)!important}
.logo i{background:#0b0a08!important;width:13px;height:13px;box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.marke b{font-family:var(--f);font-stretch:100%;font-weight:800;font-size:16.5px;letter-spacing:-.01em}
.logo.lg2{background:none!important;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(237,36,56,.45))}
.logo.lg2 svg{width:100%;height:100%;display:block}
.marke b.mtred{display:block;font-family:"Archivo",var(--f);font-stretch:75%;font-weight:900;text-transform:uppercase;font-size:clamp(26px,8.6vw,36px);line-height:1;overflow:visible;letter-spacing:.01em;white-space:nowrap;padding-bottom:1px;color:#ff2f43;background:linear-gradient(180deg,#ff8f98 0%,#ff3749 40%,#dc172b 64%,#a50c1b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.65)) drop-shadow(0 0 14px rgba(237,36,56,.35))}
.marke .mt{gap:3px}
.marke .psub{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.marke .psub .t2{font-style:normal;flex:none;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#f1f1f3;padding:3px 6px 2px;border-radius:5px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03))}
.marke .psub #progsub{min-width:0}
.marke span{font-size:11.5px}
#sync{display:none!important}
.iconbtn.dots{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.16)}
.iconbtn.dots svg.cog{fill:none;stroke:#eceef2;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;width:22px;height:22px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.iconbtn.dots{background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.14),rgba(255,255,255,.03) 60%)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 12px rgba(0,0,0,.5)}
.iconbtn.dots:active svg.cog{transform:rotate(60deg)}
/* Zeitleiste */
.tl{gap:10px}
.tlr{gap:6px!important}
.tlh{color:var(--ink2)!important}
.tlh .tlp b{background:var(--ok)!important}
.tlc{width:42px!important;height:50px!important;border-radius:12px!important;background:linear-gradient(180deg,#121110,#0a0908)!important;border:1px solid rgba(255,255,255,.1)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)!important}
.tlc small{font-size:11px!important}
.tlc b{font-size:17px!important}
.tlc i{bottom:5px!important;width:12px!important;height:2px!important}
.tlc.done{border-color:rgba(67,192,138,.55)!important;background:linear-gradient(180deg,rgba(67,192,138,.16),#0a0908)!important}
.tlc.sel{background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#b8862e)!important;border-color:var(--gold2)!important;color:#141006!important;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 6px 18px -6px rgba(226,176,74,.8)!important}
.tlc.sel small{color:rgba(20,16,6,.75)!important}
.tlc.sel i{background:#141006!important;opacity:.6!important}
.tlc.today::after{background:var(--brand)!important}
/* Karten */
.card.lux,.card.hero{border:1.5px solid rgba(226,176,74,.55)!important;box-shadow:inset 0 1px 0 rgba(255,225,160,.12),0 0 0 1px rgba(0,0,0,.6),0 0 34px -10px rgba(226,176,74,.35),0 24px 48px -28px rgba(0,0,0,.95)!important;background:radial-gradient(120% 90% at 85% 40%,rgba(226,176,74,.16),transparent 55%),linear-gradient(180deg,#14120d,#090806)!important;position:relative;overflow:hidden}
.chip.day{background:rgba(226,176,74,.1)!important;color:var(--gold2)!important;border:1px solid rgba(226,176,74,.45)!important}
.chip.plain{border-color:rgba(255,255,255,.18)!important}
.disp span,.home-t span,.thero span{color:var(--c,var(--gold))!important;background:none!important;-webkit-text-fill-color:currentColor}
.home .home-t,.thero{font-family:var(--d);font-weight:900;font-stretch:85%;font-size:clamp(38px,11vw,52px)!important;line-height:1;letter-spacing:-.015em;margin-top:8px}
.thero{font-size:clamp(32px,9vw,44px)!important;margin:0}
.greet .disp{font-size:clamp(26px,7.4vw,34px)!important}
/* Heute: Hero */
.hstage{position:relative;display:grid;grid-template-columns:minmax(0,1fr);min-height:190px;margin:14px 0 16px}
.hst{position:relative;z-index:2;display:grid;grid-template-columns:1fr;gap:14px;align-content:center;max-width:52%}
.hst li{display:flex;gap:12px;align-items:center;white-space:nowrap}
.hst i,.tstats i{flex:none;display:grid;place-items:center}
.hst i svg,.tstats i svg{width:18px;height:18px;fill:none;stroke:var(--ink2);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hst span,.tstats span{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.hst b,.tstats b{font-family:var(--d);font-weight:900;font-size:21px}
.hst small,.tstats small{font-size:11.5px;color:var(--ink2);margin-top:2px}
.hbb{position:absolute!important;right:-36px;top:-6px;bottom:-6px;width:68%!important;height:auto!important;min-height:0!important;margin:0!important;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%);mask-image:linear-gradient(90deg,transparent,#000 22%)}
.hbb canvas{width:100%!important;height:100%!important}
.fsc{display:grid;gap:12px}
.fsc .gp{justify-self:start}
/* Training: Hero */
.trh .tsub{font-size:13px;color:var(--ink2);margin-top:6px}
.tstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
.tstats>div{display:flex;gap:7px;align-items:center;padding:9px 8px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.1);min-width:0}
.tstats i{border-radius:8px}
.tstats i svg{width:15px;height:15px}
.tstats b{font-size:17px;white-space:nowrap}
.tstats small{font-size:11px;line-height:1.15}
.trh .aktionen{flex-wrap:wrap}
.trh .aktionen .cta{flex:1 1 100%}

/* ================= Feinschliff ================= */
:root{--hair:rgba(255,255,255,.075);--hair2:rgba(255,255,255,.12);--goldline:rgba(226,176,74,.34);--ease2:cubic-bezier(.2,.8,.2,1)}
html{-webkit-tap-highlight-color:transparent}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
/* Lesbarkeit: Fließ- und Nebentexte kräftiger */
:where(small,.mut,.note,.note2,.pts,.rx,.tsub,.rpedesc,.ghy,.phs,.mprog,.marke>div>span,.marke>span,.plc-m span,label,td,th,li,input,textarea,select){font-weight:600}
:where(p){font-weight:600}
.mtred span{font-weight:inherit!important;font-size:inherit!important;white-space:nowrap;overflow:visible}
svg text{font-weight:600}
.progsw button small{font-size:11px!important}
::selection{background:rgba(237,36,56,.35)}
.zahl,.num,[data-count],.tt,.gtm-t b,.stp input{font-variant-numeric:tabular-nums}
/* Karten: ruhiger, edler */
.card{border-radius:20px!important;border:1px solid var(--hair)!important}
.card:not(.hero)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,220,150,.035),transparent 38%)}
.lt-only>.card::after,.gym .gdock .card::after{display:none}
.hero.card,.card.hero,.card.rep{border-color:var(--goldline)!important}
/* Überschriften */
.eyebrow{text-transform:uppercase;letter-spacing:.12em!important;font-weight:800!important;color:#a39a88}
.h2{letter-spacing:-.005em}
.sect{display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.sect::before{content:"";width:4px;height:20px;border-radius:3px;background:linear-gradient(180deg,#ff5a68,#c4121f);box-shadow:0 0 12px rgba(237,36,56,.5)}
/* Interaktion */
button,.btn,.cta,.prow,.tlc,.iconbtn{transition:transform .14s var(--ease2),background-color .2s,border-color .2s,box-shadow .2s,opacity .2s}
button:active:not(:disabled),.btn:active,.cta:active{transform:scale(.975)}
:focus-visible{outline:2px solid #e2b04a!important;outline-offset:2px}
button:disabled{opacity:.42}
/* Bottom-Navigation */
.nav{-webkit-backdrop-filter:blur(20px) saturate(160%)!important;backdrop-filter:blur(20px) saturate(160%)!important;border-top:0!important;box-shadow:0 -1px 0 rgba(255,255,255,.06),0 -20px 40px -20px rgba(0,0,0,.9)}
.nav::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(226,176,74,.45),transparent)}
.nav button{letter-spacing:.01em}
.nav button:not([aria-current="page"]){color:#8d8a84}
/* Leere Zustände */
.leer{border:1px dashed rgba(255,255,255,.1)!important;background:repeating-linear-gradient(135deg,rgba(255,255,255,.012) 0 8px,transparent 8px 16px)!important;color:#8f8b83!important;border-radius:14px!important}
/* Kopfzeile */
.top{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05)!important}
/* Listenzeilen */
.prow{border-radius:14px}
.prbtn:active{background:rgba(255,255,255,.03)}
/* WHOOP-Zeile auf Heute */
.fsc .gp{display:flex!important;width:100%;align-items:center;gap:12px;padding:10px 12px!important;border-radius:14px!important;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015))!important;border:1px solid var(--hair2)!important;text-align:left}
.lt .eyebrow,.glowt .eyebrow{letter-spacing:.05em!important;font-size:11px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbcap .eyebrow{white-space:nowrap}
/* Wochen-/Blocklabel in der Zeitleiste */
.tlh{gap:7px!important;font-size:14px!important;line-height:1;padding:2px 0 3px}
.tlh .tlwk{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:800;letter-spacing:.04em;color:#1a1408;background:linear-gradient(180deg,#f3d27a,#c9962f);padding:4px 7px 3px;border-radius:7px;box-shadow:0 0 12px -2px rgba(226,176,74,.5)}
.tlh .tln{font-family:var(--d);font-weight:800;font-size:15px;color:#f2f0ea!important;letter-spacing:-.005em}
.tlh .tlp{width:52px!important;height:5px!important;border-radius:3px!important;background:rgba(255,255,255,.08)!important}
.tlw:not(.cur) .tlwk{background:rgba(255,255,255,.1);color:#d9d5cc;box-shadow:none}
.tlw:not(.cur) .tln{color:#b8b3a8!important}
.tlw.cur .tln{text-shadow:0 0 18px rgba(237,36,56,.35)}
/* Performance */
html.boot .top,html.boot #view,html.boot .nav{opacity:0}
.top,#view,.nav{transition:opacity .28s ease}
html.boot #view.enter>*{animation:none!important}
.top,.nav{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.top{background:#070706!important}
.nav{background:linear-gradient(180deg,#0d0c0a,#050505)!important}
.card:not(.hero)::after{display:none!important}
.card{background:linear-gradient(180deg,#171511 0%,#0d0c0a 40%,#0a0908 100%)!important}
#view>section:nth-child(n+4),#view>.card:nth-child(n+4){contain-intrinsic-size:auto 420px}
.gdock{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:linear-gradient(180deg,rgba(9,10,14,0),#0b0c10 18px)!important}

.wc-btn{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center;width:100%;padding:16px;background:none;border:0;color:inherit;text-align:left;cursor:pointer}

*,*::before,*::after{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

.ck-note{margin:8px 0 0;font-size:11.5px;color:var(--mut);line-height:1.4}
.lockhint{margin:10px 2px 0;font-size:11.5px;line-height:1.45;color:var(--mut)}
.lockhint-x{border:0;background:none;color:#7fa8ff;font:700 11.5px var(--f);padding:0 0 0 4px}
.hsec{margin:14px 2px 10px}
.hsec .phs{font-size:12px;color:var(--mut)}
.jr-erh{position:relative;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:10px}
.jr-erh .erh-r{grid-template-columns:repeat(var(--n,2),1fr);max-width:280px;margin:0 auto 14px;gap:10px}
.jr-erh .erh-r>div{gap:8px}
.jr-erh .erh-ring{width:66px;height:66px}
.jr-erh .erh-ring svg{width:100%;height:100%;display:block}
.jr-erh .erh-ring b{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.jr-erh .erh-r small{font-size:12px;line-height:1.2}
.ck-opt{margin:0 0 10px}
.ck-opt summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px dashed var(--line);border-radius:16px;color:#c7cbd6}
.ck-opt summary::-webkit-details-marker{display:none}
.ck-opt summary::before{content:'';width:8px;height:8px;border-right:2px solid #7fa8ff;border-bottom:2px solid #7fa8ff;transform:rotate(-45deg);margin:0 4px 0 2px;transition:transform .2s}
.ck-opt[open] summary::before{transform:rotate(45deg)}
.ck-opt summary b{font-size:14px;font-weight:800;color:#fff;white-space:nowrap}
.ck-opt summary small{font-size:11.5px;color:var(--mut);flex:1;min-width:0}
.ck-opt[open] summary{margin-bottom:8px;border-style:solid}
.ck-yn{margin-top:8px}
.ck-yn button{background:rgba(255,255,255,.04)}
.ck-sub{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ck-mind{display:flex;gap:10px;align-items:flex-start}
.ck-mind svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--ink2);stroke-width:1.8;stroke-linejoin:round;margin-top:4px}
.ck-mind textarea{flex:1;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;resize:none}
.ck-mind textarea:focus{outline:none}
.ck-foot{grid-template-columns:1fr 2fr;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:#0c0d11}
.ck-foot .btn{height:50px;font-size:15px;font-weight:800}
.ck-in.rest .ck-h{color:#7fa8ff}
.rd-row{display:flex;align-items:center;gap:12px}
.rd-row>div{display:flex;flex-direction:column;gap:2px}
.rd-row b{font-size:14px}
.rd-row small{font-size:12px;color:var(--ink2)}
.rd-h{display:flex;gap:8px}
.rd-h span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.rd-h em{font:800 11px var(--mono);font-style:normal;color:var(--ink2)}
.rd-h b{position:relative;display:block;width:100%;max-width:34px;height:64px;border-radius:9px;background:#25282f;overflow:hidden}
.rd-h i{position:absolute;left:0;right:0;bottom:0;border-radius:8px}
.rd-h small{font-size:11px;color:var(--mut)}
.plc{overflow:hidden}
.plc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plc-t{display:flex;align-items:center;gap:8px;margin:0;font-size:21px;font-weight:800}
.plc-t svg{width:20px;height:20px;fill:none;stroke:#5b7cff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plc-h small{display:block;margin-top:2px;font-size:13.5px;color:var(--ink2)}
.plc-go{width:34px;height:34px;border:0;background:none;color:#5b7cff;padding:0;flex:none}
.plc-go svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.plc-c{position:relative;margin:12px 0 0}
.plc-svg{width:100%;height:150px;display:block}
.plc-m{position:relative;height:18px;margin-top:4px}
.plc-pins{position:relative;height:18px}
.plc-pins.two{height:38px}
.plc-pins.two .ptst{top:20px}
.plc-pin{position:absolute;top:0;font-size:11px!important;line-height:16px;height:16px;font-weight:800;white-space:nowrap;padding:0 6px!important;border-radius:999px;margin:0!important;min-width:0!important}
.plc-pin.pnow{background:#fff;color:#0b1020}
.plc-pin.ptst{background:#e8484f;color:#fff}
.plc-m span{position:absolute;top:0;font-size:11px;color:var(--mut);white-space:nowrap;padding-left:3px;border-left:1px solid rgba(255,255,255,.18)}
.plc-leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plc-leg span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--raise);font-size:12.5px;font-weight:600}
.plc-leg i{width:11px;height:11px;border-radius:50%}
.plc-leg svg{width:15px;height:15px;fill:none;stroke:#5b7cff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rf-ckh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rf-ckh b{font-size:14px}
.rf-cks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rf-cks span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:999px;border:1px solid var(--line2)}
.rf-cks i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.rf-w{margin:8px 0 0;font-size:12.5px;color:#f0a066}
.rf-m{margin:8px 0 0;font-size:13px;font-style:italic;color:var(--ink2)}
.rf-bar{position:relative;height:38px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin:6px 0 12px}
.rf-bar i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:linear-gradient(90deg,#e8484f,#f3c969 45%,#43c08a 80%);background-size:calc(100vw - 64px) 100%;transition:width .4s}
.rf-bar b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:17px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.rf-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rf-c{border:1px solid var(--line2);border-radius:14px;padding:9px 6px;background:var(--raise);display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.rf-ch{display:flex;flex-direction:column;align-items:center;gap:3px}
.rf-ch b{font-size:13px}
.rf-ch .evid{font-size:11px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rf-ch .evid .et{display:none}
.rf-c small{font-size:11px;color:var(--ink2);line-height:1.3}
.rf-ring{width:56px;height:56px}
.rf-ring text{font:800 14px var(--mono);fill:var(--ink)}
.rf-v{margin:12px 0;padding:12px 14px;border-radius:14px;border:1.5px solid;font-size:14px;line-height:1.45}
.rf-v p{margin:0}
.rf-v.g{border-color:rgba(67,192,138,.6);background:rgba(67,192,138,.07)}
.rf-v.y{border-color:rgba(243,201,105,.6);background:rgba(243,201,105,.07)}
.rf-v.r{border-color:rgba(232,72,79,.6);background:rgba(232,72,79,.07)}
.rf-v.n{border-color:var(--line2)}
.rf-ck{border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:grid;gap:10px;background:rgba(255,255,255,.02)}
.rf-d{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.rf-d ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px}
.rf-d li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13.5px}
.rf-d li small{font-size:11px;color:var(--mut)}
.rf-d li b{font-family:var(--mono);font-size:13.5px;text-align:right}
.rf-d em{font-style:normal;font-size:11.5px;margin-left:4px}
.rf-d .up,.rf-d em.up{color:var(--ok)}
.rf-d .dn,.rf-d em.dn{color:var(--hi)}
.evid{display:inline-flex;align-items:center;gap:6px;flex:none;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.evid i{width:7px;height:7px;border-radius:50%;background:currentColor}
.evid.lo{color:#8a8f9b}
.evid.mid{color:#f0a066}
.evid.hi{color:var(--ok)}
.bo-l{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bo-r{border-left:3px solid var(--c);padding:6px 0 6px 10px;display:flex;flex-direction:column;gap:2px}
.bo-r b{font-size:13.5px}
.bo-r small{font-size:12px;color:var(--ink2);line-height:1.4}
.bo-g{display:grid;gap:10px;margin-top:4px}
.bo-c{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:14px;padding:11px 12px;background:var(--raise)}
.bo-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.bo-h b{font-size:15px}
.bo-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.bo-k span{display:flex;flex-direction:column;gap:2px}
.bo-k small{font-size:11px;color:var(--ink2)}
.bo-k b{font-family:var(--mono);font-size:16px}
.wuemp{font-style:normal;display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#f0a066;border:1px solid rgba(240,160,102,.45);background:rgba(240,160,102,.1);vertical-align:2px}
.vtag{display:inline-flex;align-self:flex-start;justify-self:start;width:max-content;margin:2px 0 4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);background:rgba(67,192,138,.12);border:1px solid rgba(67,192,138,.4)}
.empf{position:relative;z-index:2;display:grid;grid-template-columns:1fr;row-gap:1px;margin:4px 0 6px;padding:8px 12px;border-radius:14px;border:1.5px dashed #7fa8ff;background:rgba(18,24,44,.92);color:#b9ceff;width:min(210px,100%)}
.empf .et{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7fa8ff}
.empf b{font-family:var(--mono);font-size:22px;font-weight:800;color:#dbe6ff;justify-self:start;white-space:nowrap}
.empf small{grid-column:1/-1;font-size:11.5px;color:#9db4e6;margin-top:2px}
.gz-n .zahl.nokg{font-size:clamp(30px,9vw,42px);white-space:nowrap}
.stp .mid small.emp{color:#7fa8ff;font-weight:800;letter-spacing:.04em}
.pl small .emp,.tkg.emp{color:#7fa8ff}
.auto.emp{border:1.5px dashed #7fa8ff!important;background:rgba(90,130,255,.10)!important}
.auto.emp b{color:#dbe6ff}
.auto.emp .et{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7fa8ff;margin-right:6px}
.auto.emp em{color:#9db4e6}
/* ===== Geräte statt Langhantel ===== */
.ghero .geq{grid-column:2;grid-row:1/span 3;align-self:center;position:relative;width:min(168px,41vw);height:160px;margin:-8px 4px -8px 0;padding-bottom:14px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 55% at 60% 50%,rgba(226,176,74,.20),rgba(226,176,74,.05) 45%,transparent 72%)}
.geq .eqsvg{width:100%;height:100%;display:block}
.geqn{position:absolute;left:0;right:0;bottom:-2px;text-align:center;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
/* ===== Home: Plan- & Pause-Buttons ===== */
.hact2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.hab{display:flex;align-items:center;gap:9px;min-width:0;min-height:58px;padding:10px 12px;border-radius:16px;text-align:left;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.hab:active{transform:scale(.97)}
.hab>span:last-child{min-width:0}
.hab .hai{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:11px}
.hab svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hab b{display:block;font-size:14px;font-weight:800;line-height:1.15;white-space:nowrap}
.hab small{display:block;font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hab.plan{background:rgba(226,176,74,.10);border:1px solid rgba(226,176,74,.45)}
.hab.plan .hai{background:rgba(226,176,74,.18);color:#f0c46a}
.hab.pz{background:rgba(227,145,80,.10);border:1px solid rgba(227,145,80,.45)}
.hab.pz .hai{background:rgba(227,145,80,.18);color:#f0a066}
@media (max-width:350px){.hab small{display:none}}
/* ===== Tageskarte: Zweit-Buttons ===== */
.trh .aktionen{display:grid!important;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.trh .aktionen .cta{grid-column:1/-1}
.sbtn{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:50px;padding:8px 8px;border-radius:16px;font:inherit;color:var(--ink);cursor:pointer;transition:transform .12s,background .2s}
.sbtn:active{transform:scale(.97)}
.sbtn b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sbtn .sbi{display:grid;place-items:center;width:26px;height:26px;border-radius:10px;flex:none}
.sbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sbtn.g{background:rgba(226,176,74,.10);border:1px solid rgba(226,176,74,.45)}
.sbtn.g .sbi{background:rgba(226,176,74,.18);color:#f0c46a}
.sbtn.w{background:rgba(227,145,80,.10);border:1px solid rgba(227,145,80,.45)}
.sbtn.w .sbi{background:rgba(227,145,80,.18);color:#f0a066}
.sbtn.o{background:rgba(67,192,138,.10);border:1px solid rgba(67,192,138,.45)}
.sbtn.o .sbi{background:rgba(67,192,138,.18);color:#5fd6a0}
.sbtn.r{background:rgba(255,255,255,.03);border:1px solid rgba(232,72,79,.35);color:#d9d4cc}
.sbtn.r .sbi{background:rgba(232,72,79,.14);color:#f07a80}
.sbtn.rr{background:linear-gradient(135deg,#e8484f,#b3262d);border:1px solid #ff6b72;color:#fff}
.sbtn.rr .sbi{background:rgba(255,255,255,.18);color:#fff}
.ghero .bb3d.sm.db{-webkit-mask:none;mask:none;margin:-10px 0 -10px 0!important;background:radial-gradient(55% 50% at 50% 55%,rgba(226,176,74,.22),rgba(226,176,74,.06) 45%,transparent 72%)}
.bb3d.db .dbkg{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);z-index:2;padding:4px 11px;border-radius:999px;background:rgba(14,15,19,.88);border:1px solid rgba(243,201,105,.55);font-family:var(--mono);font-weight:800;font-size:13px;color:#f3d58a;white-space:nowrap}
.bb3d.db .dbkg small{font-family:var(--f);font-weight:600;font-size:11px;color:var(--mut);margin-left:2px}
/* ===== Gym: Wischen 3.0 (rAF, nur Transform) ===== */
#gym{touch-action:pan-y}
.gsw{display:grid;gap:10px;transform-origin:50% 35%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* Vorschau-Schild */
.swhint{position:fixed;top:44%;z-index:30;display:flex;align-items:center;gap:10px;max-width:64vw;padding:10px 14px 10px 10px;border-radius:18px;background:rgba(14,15,19,.96);border:1px solid rgba(243,201,105,.35);box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;will-change:transform,opacity}
.swhint.r{right:12px}
.swhint.l{left:12px;flex-direction:row-reverse;text-align:right;padding:10px 10px 10px 14px}
.swhint i{width:30px;height:30px;flex:none;border-radius:50%;background:rgba(243,201,105,.14);position:relative;transition:background .15s,transform .2s}
.swhint i::after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;border-top:2.5px solid #f3c969;border-right:2.5px solid #f3c969;transform:translateX(-2px) rotate(45deg);transition:border-color .15s}
.swhint.l i::after{transform:translateX(2px) rotate(-135deg)}
.swhint.go{border-color:#f3c969;background:rgba(40,32,14,.96)}
.swhint.go i{background:#f3c969;transform:scale(1.08)}
.swhint.go i::after{border-color:#1a1406}
.swhint span{min-width:0}
.swhint b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swhint small{display:block;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== Gym: gruppierte Werkzeuge ===== */
/* Pausen-Leiste */
.gpill{display:flex!important;align-items:center;gap:12px;padding:10px 10px 10px 12px!important;border-radius:20px!important;background:linear-gradient(90deg,rgba(67,192,138,.12),rgba(67,192,138,.03) 70%)!important;border:1px solid rgba(67,192,138,.28)!important;box-shadow:none!important}
.gpill .gpi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(67,192,138,.16);color:#5fd6a0;flex:none}
.gpill .gpi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.gpill .gpt{flex:1;min-width:0}
.gpill .gpt b{font-family:var(--mono);font-size:17px;font-weight:800;letter-spacing:.01em}
.gpill .gpt small{display:block;font-size:11.5px;color:var(--mut)}
.gpill .gpgo{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px!important;border-radius:999px!important;background:#43c08a!important;border:0!important;color:#06140d!important;font-weight:800;font-size:13.5px}
.gpill .gpgo svg{width:13px;height:13px;fill:currentColor}
/* ===== WHOOP-Karte im Trainings-Tab ===== */
#whoop.wcard{padding:18px!important;border:1px solid color-mix(in srgb,var(--wz) 35%,rgba(255,255,255,.08))!important;background:linear-gradient(160deg,color-mix(in srgb,var(--wz) 14%,#121318),#0e0f13 62%)!important;border-radius:24px;position:relative;overflow:hidden}
#whoop.wcard::before{content:"";position:absolute;left:24px;right:24px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--wz),transparent);display:block}
#whoop .wk{margin-bottom:12px}
#whoop.empty .h2{font-size:21px;letter-spacing:-.01em}
.we2{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin:4px 0 16px}
.we2-ring{position:relative;width:86px;height:86px;flex:none}
.we2-ring svg{width:100%;height:100%;display:block}
.we2-ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:22px;font-weight:800;color:rgba(255,255,255,.35)}
@media (prefers-reduced-motion:no-preference){.we2-arc{animation:wearc 3.2s cubic-bezier(.45,0,.55,1) infinite;transform-origin:50% 50%}
@keyframes wearc{0%{stroke-dasharray:20 232;transform:rotate(-90deg)}50%{stroke-dasharray:150 102;transform:rotate(90deg)}100%{stroke-dasharray:20 232;transform:rotate(270deg)}}}
.we2-t p{margin:0 0 10px;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.we2-chips{display:flex;flex-wrap:wrap;gap:5px}
.we2-chips span{font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:999px;background:rgba(90,209,230,.08);border:1px solid rgba(90,209,230,.25);color:#9fe3ef}
.we2-act{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}
.we2-b{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;overflow:hidden;min-height:52px;padding:0 10px;border-radius:16px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:transform .12s}
.we2-b:active{transform:scale(.97)}
.we2-b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.we2-b.pri{background:linear-gradient(135deg,#ff4d55,var(--action));border:0;color:#fff;box-shadow:0 8px 22px rgba(232,72,79,.28)}
.we2-b.sec{background:rgba(90,209,230,.08);border:1px solid rgba(90,209,230,.35);color:#cdeff5}
#whoop .we2-b{height:54px!important;min-height:0!important;padding:0 10px!important;margin:0!important;align-self:center}

    }).catch(function(){});
    var hadCtrl=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(reloading)return;if(wantReload){reloading=true;location.reload();return}if(hadCtrl)offerUpdate(null);hadCtrl=true});
  }

  /* ---------- Erinnerung: Sicherung in iCloud ---------- */
  function lastExport(){try{return +localStorage.getItem('cf-lastexport')||0}catch(e){return 0}}
  function snoozed(){try{return +localStorage.getItem('cf-bksnooze')||0}catch(e){return 0}}
  function hasData(){try{return typeof totalOk==='function'&&totalOk()>0}catch(e){return false}}
  function checkBackup(){
    if(!box.hidden&&box.classList.contains('upd'))return;
    var d=Date.now(),le=lastExport();
    if(box.classList.contains('bk'))hide();return; /* Erinnerung erscheint jetzt als Karte auf „Heute“ */
    if(!hasData()||d-le<7*864e5||d<snoozed()){if(box.classList.contains('bk'))hide();return}
    show('<div class="cft"><b>Sicherung fällig</b><small>'+(le?'Letzte iCloud-Sicherung vor '+Math.floor((d-le)/864e5)+' Tagen':'Noch keine Sicherung in iCloud gespeichert')+'</small></div><button type="button" data-cf="bk">Jetzt sichern</button><button type="button" class="x" data-cf="later" aria-label="Später erinnern">✕</button>','bk');
  }
  window.addEventListener('cf-exported',function(){if(box.classList.contains('bk'))hide()});
  setTimeout(checkBackup,4000);setInterval(checkBackup,60*1000);

  box.addEventListener('click',function(e){var b=e.target.closest('[data-cf]');if(!b)return;var a=b.dataset.cf;
    if(a==='force'){b.disabled=true;b.textContent='Lädt …';forceUpdate();return}
    if(a==='upd'){wantReload=true;b.disabled=true;b.textContent='Lädt …';try{sessionStorage.setItem('cf-upd-tried',String(tried+1))}catch(err){}
      navigator.serviceWorker.getRegistration().then(function(r){var w=(r&&r.waiting)||(waiting&&waiting.state!=='redundant'?waiting:null);if(w&&w.state!=='activated'){w.postMessage('skip')}else{reloading=true;location.reload()}}).catch(function(){location.reload()});
      setTimeout(function(){if(!reloading){reloading=true;location.reload()}},2500)}
    if(a==='bk'){try{downloadBackup()}catch(err){}}
    if(a==='later'){try{localStorage.setItem('cf-bksnooze',String(Date.now()+2*864e5))}catch(err){}hide()}
  });

  /* ---------- Hinweis: zum Home-Bildschirm hinzufügen (nur Safari, nicht installiert) ---------- */
  var standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  document.documentElement.classList.toggle('cf-standalone',standalone);
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  try{if(ios&&!standalone&&!localStorage.getItem('cf-installhint')){
    setTimeout(function(){if(!box.hidden)return;show('<div class="cft"><b>Als App installieren</b><small>Tippe unten auf <span class="sh">Teilen</span> und dann „Zum Home-Bildschirm“.</small></div><button type="button" class="x" data-cf="later" aria-label="Schließen">✕</button>','inst');localStorage.setItem('cf-installhint','1')},2500)
  }}catch(e){}

  window.CF_APP={version:VERSION,checkBackup:checkBackup};
})();

</script>
</body>
</html>
