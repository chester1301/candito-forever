/* ===================== Ladehilfe · Rückgängig · Speicherstatus · Zyklus-Bericht ===================== */
// 1) Scheiben-Ladehilfe: was muss an der Stange (pro Seite) geändert werden?
function barNow(w,d){const L=log(w,d);if(!L)return null;let best=null;
 L.b.forEach((bl,b)=>(bl||[]).forEach(s=>{if(s&&s.ok&&pnum(s.kg)&&(!best||(s.t||0)>(best.t||0)))best={kg:pnum(s.kg),t:s.t||0,e:P[w][d].b[b]&&P[w][d].b[b].e}}));return best}
function plateDiff(from,to){const a=plates(from),b=plates(to);let i=0;while(i<a.length&&i<b.length&&Math.abs(a[i]-b[i])<1e-6)i++;
 return {off:a.slice(i).reverse(),on:b.slice(i),keep:a.slice(0,i)}}
function loadHTML(w,d,kg){if(!kg)return '';const cur=barNow(w,d);if(!cur||Math.abs(cur.kg-kg)<1e-6)return cur&&Math.abs(cur.kg-kg)<1e-6?`<div class="ldh same"><span class="ldi"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></span><span><b>Stange bleibt so</b><small>gleiches Gewicht wie im letzten Satz (${nf(kg,2)} kg)</small></span></div>`:'';
 const D=plateDiff(cur.kg,kg),chip=(p,cls)=>`<i class="${cls}" style="--p:${PC[p]?PC[p][0]:'#888'}">${nf(p,2)}</i>`;
 const up=kg>cur.kg;
 return `<div class="ldh"><span class="ldi ${up?'up':'dn'}"><svg viewBox="0 0 24 24">${up?'<path d="M12 19V5M6 11l6-6 6 6"/>':'<path d="M12 5v14M6 13l6 6 6-6"/>'}</svg></span>
  <span class="ldt"><b>Umbauen: ${up?'+':'−'}${nf(Math.abs(kg-cur.kg)/2,2)} kg pro Seite</b><small>von ${nf(cur.kg,2)} auf ${nf(kg,2)} kg</small>
  <span class="ldr">${D.off.length?`<em>runter</em>${D.off.map(p=>chip(p,'off')).join('')}`:''}${D.on.length?`<em>drauf</em>${D.on.map(p=>chip(p,'on')).join('')}`:''}</span></span></div>`}

// 2) Rückgängig nach dem Abhaken
let UNDO=null;
function offerUndo(w,d,b,i,snap,tSnap){UNDO={w,d,b,i,snap,tSnap,at:Date.now()};let el=$('#undo');
 if(!el){el=document.createElement('div');el.id='undo';el.className='undo';document.body.appendChild(el);
  el.addEventListener('click',e=>{if(e.target.closest('[data-undo]'))doUndo()})}
 el.innerHTML=`<span>Satz ${i+1} abgehakt</span><button type="button" data-undo><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Rückgängig</button><i></i>`;
 el.hidden=false;el.classList.remove('run');void el.offsetWidth;el.classList.add('run');
 clearTimeout(offerUndo.t);offerUndo.t=setTimeout(()=>{el.hidden=true;UNDO=null},5000)}
function doUndo(){const u=UNDO;if(!u)return;UNDO=null;$('#undo').hidden=true;clearTimeout(offerUndo.t);
 const L=log(u.w,u.d,true);L.b[u.b][u.i]=JSON.parse(JSON.stringify(u.snap));
 if(u.tSnap){Object.assign(T,u.tSnap);saveT();if(!T.on)closeSheet()}
 saveLog(key(u.w,u.d));$('#fx').hidden=true;
 if(!$('#gym').hidden&&S.ui.w===u.w&&S.ui.d===u.d){G.b=u.b;G.i=u.i;renderGym()}else render();tick();toast('Satz wieder offen')}

// 4) Speicherstatus
const SAVEST={};
function setSave(id,st){SAVEST[id]=st;updSave()}
function saveStatus(k){if(!db)return {c:'loc',t:'Nur auf diesem Gerät gespeichert'};if(!navigator.onLine)return {c:'wait',t:'Offline – wird gesendet, sobald Netz da ist'};
 const st=SAVEST[k];if(st==='pending')return {c:'busy',t:'Wird gespeichert …'};if(st==='err')return {c:'wait',t:'Noch nicht gesendet – neuer Versuch läuft'};return {c:'ok',t:'Gespeichert & synchronisiert'}}
function saveHTML(k){const s=saveStatus(k);return `<p class="savest ${s.c}" data-savest="${k}"><i></i><span>${s.t}</span></p>`}
function updSave(){document.querySelectorAll('[data-savest]').forEach(el=>{const s=saveStatus(el.dataset.savest);el.className='savest '+s.c;el.querySelector('span').textContent=s.t})}
addEventListener('online',()=>{updSave();retrySaves()});addEventListener('offline',updSave);
function retrySaves(){Object.keys(SAVEST).forEach(id=>{if(SAVEST[id]==='err'){if(id==='meta')saveMeta();else if(S.logs[id])saveDoc('logs/'+id,id,S.logs[id])}})}
setInterval(()=>{if(navigator.onLine&&Object.values(SAVEST).includes('err'))retrySaves()},15000);

// 7) Zyklus-Abschlussbericht
function cycleData(){const A=allSets();const comp={sq:'csq',bp:'pbb',dl:'cdl'},RK={sq:'SQ',bp:'BP',dl:'DL'};
 const lifts=['sq','bp','dl'].map(g=>{const rk=refKg(RK[g]);const R0=REFS[RK[g]]&&REFS[RK[g]].w!=null?REFS[RK[g]]:null;const rs=R0?setOf(R0.w,R0.d,R0.b,0):{};const start=rk?(R0?e1rm(rk,pnum(rs.r)||1,pnum(rs.rpe)??9):rk):null;const refE=R0?P[R0.w][R0.d].b[R0.b].e:comp[g];const v=A.filter(s=>(s.e===comp[g]||s.e===refE)&&s.e1);const best=v.length?v.reduce((m,s)=>s.e1>m.e1?s:m):null;
  const am=AMI(g);let test=null;if(am>=0){const s=setOf(TWg(g),TDg(g),am,0);const kg=pnum(s.kg),r=pnum(s.r);if(kg&&r)test={kg,r,e1:e1rm(kg,r,pnum(s.rpe))}}
  const now=test?test.e1:best?best.e1:null;return {g,start,best,test,now,diff:start&&now?now-start:null}});
 let done=0,dur=0,ton=0;for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const L=log(w,d);if(dayStatus(w,d)==='done')done++;if(L&&L.dur)dur+=L.dur;ton+=dayTon(L)}
 const ad=adhAll().tot,cal=calib();const prs=Object.keys(EX).filter(e=>EX[e].m).reduce((n,e)=>{const ss=A.filter(s=>s.e===e);if(ss.length<2)return n;let c=0,m=0;ss.slice().sort((a,b)=>(a.w*ND()+a.d)-(b.w*ND()+b.d)).forEach(s=>{if(s.e1&&s.e1>m+.5){if(m)c++;m=s.e1}});return n+c},0);
 const st=lifts.every(l=>l.start)?lifts.reduce((a,l)=>a+l.start,0):null,nw=lifts.every(l=>l.now)?lifts.reduce((a,l)=>a+l.now,0):null;
 return {lifts,done,dur,ton,ad,cal,prs,st,nw,final:dayStatus(TW(),TD())==='done'||done===NS()}}
function reportHTML(){const R=cycleData();const N={sq:'Kniebeuge',bp:'Bankdrücken',dl:'Kreuzheben'};
 const row=l=>`<div class="rl" style="--c:${GC[l.g]}">${icoB(l.g)}<div class="rln"><b>${N[l.g]}</b><small>${l.test?`W4-Test ${nf(l.test.kg,2)} kg × ${l.test.r}`:l.best?`bester Satz ${nf(l.best.kg,2)} × ${l.best.r}`:'noch keine Sätze'}</small></div>
  <div class="rlv"><span>${l.start?nf(l.start,0):'–'}</span><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><b>${l.now?nf(l.now,0):'–'}</b>${l.diff!=null?`<em class="${l.diff>=0?'up':'dn'}">${l.diff>=0?'+':'−'}${nf(Math.abs(l.diff),0)}</em>`:''}</div></div>`;
 const cal=['sq','bp','dl'].map(g=>{const v=calibVerdict(R.cal[g]);return `<span class="${v.cls}">${N[g]}: ${v.t}</span>`}).join('');
 return `<div class="rep">
  <div class="rep-h"><p class="eyebrow">${R.final?'Zyklus abgeschlossen':'Zwischenstand · vorläufig'}</p><h2 class="disp">Intro-Zyklus <span>Bericht</span></h2></div>
  <div class="rep-tot"><div><small>Total (e1RM)</small><b class="zahl">${R.nw?nf(R.nw,0):'–'}<small>kg</small></b></div>${R.st&&R.nw?`<div class="rep-d ${R.nw>=R.st?'up':'dn'}">${R.nw>=R.st?'▲':'▼'} ${nf(Math.abs(R.nw-R.st),0)} kg<small>seit W1 (${nf(R.st,0)} kg)</small></div>`:''}</div>
  <p class="sec">Vorher → Nachher</p><div class="rls">${R.lifts.map(row).join('')}</div>
  <div class="rep-k"><div><small>Einheiten</small><b>${R.done}/${NS()}</b></div><div><small>Trainingszeit</small><b>${fmtHM(R.dur)}</b></div><div><small>Tonnage</small><b>${nf(R.ton/1000,1)} t</b></div>
   <div><small>Plan-Treue</small><b>${R.ad.ev?Math.round(R.ad.hit/R.ad.ev*100)+' %':'–'}</b></div><div><small>Umfang erfüllt</small><b>${R.ad.plan?Math.round(R.ad.done/R.ad.plan*100)+' %':'–'}</b></div><div><small>Neue Bestwerte</small><b>${R.prs}</b></div></div>
  <p class="sec">RPE-Kalibrierung</p><div class="rep-cal">${cal}</div>
  <p class="note2">Start = W1-Referenz-Single mit deinem eingetragenen RPE (ohne Angabe als RPE 9). Nachher = W4-AMRAP-Test, bis dahin bester Satz aus Wettkampf-Übung und Referenz-Variante. ${R.final?'':'Der Bericht wird bis zum Testtag laufend aktualisiert.'}</p>
 </div>`}
function openReport(){$('#xsheet').hidden=false;S.ui.ex=null;
 $('#xsheet').innerHTML=`<div class="sheet-in xs" role="dialog" aria-modal="true" aria-label="Zyklus-Bericht"><span class="grip"></span>
  <div class="sh-k"><span></span><button type="button" class="iconbtn" data-xclose aria-label="Schließen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  ${reportHTML()}<div class="aktionen"><button type="button" class="btn" data-repdl>Bericht speichern</button></div></div>`}
function reportText(){const R=cycleData();const N={sq:'Kniebeuge',bp:'Bankdrücken',dl:'Kreuzheben'};const L=[];
 L.push('INTRO-ZYKLUS · BERICHT'+(R.final?'':' (vorläufig)'),'Stand: '+new Date().toLocaleDateString('de-DE'),'');
 L.push('Total (e1RM): '+(R.nw?nf(R.nw,0)+' kg':'–')+(R.st&&R.nw?` (W1: ${nf(R.st,0)} kg, ${R.nw>=R.st?'+':'−'}${nf(Math.abs(R.nw-R.st),0)} kg)`:''),'');
 R.lifts.forEach(l=>L.push(`${N[l.g]}: ${l.start?nf(l.start,0):'–'} → ${l.now?nf(l.now,0):'–'} kg${l.diff!=null?` (${l.diff>=0?'+':'−'}${nf(Math.abs(l.diff),0)})`:''}`));
 L.push('',`Einheiten: ${R.done}/${NS()} · Trainingszeit: ${fmtHM(R.dur)} · Tonnage: ${nf(R.ton/1000,1)} t`,`Plan-Treue: ${R.ad.ev?Math.round(R.ad.hit/R.ad.ev*100)+' %':'–'} · Umfang: ${R.ad.plan?Math.round(R.ad.done/R.ad.plan*100)+' %':'–'} · neue Bestwerte: ${R.prs}`);
 L.push('RPE-Kalibrierung: '+['sq','bp','dl'].map(g=>N[g]+' '+calibVerdict(R.cal[g]).t).join(', '));return L.join('\n')}
document.addEventListener('click',e=>{if(e.target.closest('[data-report]')){openReport();return}
 if(e.target.closest('[data-repdl]')){(async()=>{try{const dl=await window.claude?.use?.('downloads');if(!dl){toast('Download hier nicht verfügbar');return}await dl.save({filename:'intro-zyklus-bericht.txt',data:reportText()});toast('Bericht gespeichert')}catch(_){toast('Download abgebrochen')}})()}});
function reportCardHTML(){const R=cycleData();return `<button type="button" class="card repc" data-report><span class="gci img"><img src="${LXI_REP}" alt=""></span><span class="rct"><p class="eyebrow">${R.final?'Zyklus abgeschlossen':'Zwischenstand'}</p><b>Zyklus-Bericht</b><small>Vorher → Nachher, Total, Plan-Treue, Trainingszeit</small></span><span class="rcv">${R.nw?`<b class="zahl">${nf(R.nw,0)}</b><small>kg Total</small>`:''}</span><svg class="tbc" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>`}
/* ===================== Wissen: Erklärungen zum Programm ===================== */
const WIS=[
 {id:'ziel',t:'Ziel des Intro-Zyklus',s:'Worum es in diesen 4 Wochen geht',ic:'target',items:[
  {q:'1. Ausgangswert mit aktuellen Trainingsmaxima',a:[
   'Das Besondere an diesem Programm: Du startest mit Trainingsmaxima auf Low-Bar Paused Squat, 3 Sekunden Pause Bench und Paused Deadlift. Das hat zwei Gründe.',
   '<b>1. Es liefert AKTUELLE Informationen.</b> Das ist enorm wichtig. Läuft dein Training schlecht, muss es früher besser gelaufen sein – und das ist lösbar, weil du alte Gewohnheiten jederzeit wieder aufnehmen kannst. Unlösbar wird es nur, wenn dein Ausgangspunkt falsch eingeschätzt wird. Wenn du vor 2,5 Jahren 184 kg gedrückt hast, bedeutet das heute nichts, wenn dein 3-Sekunden-Pause-Maximum jetzt bei 165 kg liegt.',
   'Erst Klarheit – dann lässt sich alles lösen.',
   '<b>2. Es schiebt dich Richtung Unterschätzen</b> – und das ist am Anfang fast immer ein Vorteil, um Schwung aufzubauen.']},
  {q:'2. Erst mit Prozenten das RPE-Schätzen üben',a:[
   'RPE muss kein Ratespiel sein.',
   'Dieses Intro-Programm gibt dir die Chance, zunächst mit Prozenten zu arbeiten und das RPE erst <b>nach</b> dem Satz zu bewerten. Nicht zerdenken – den Satz mit 100 % Fokus machen, dann bestmöglich einschätzen.',
   'Im 8-Wochen-Programm wird RPE dann <b>vorgegeben</b>. Es vorher aktiv beschreibend zu bewerten, ist einer der besten Wege, sich daran zu gewöhnen.',
   'Viele springen in ein RPE-Programm und nutzen sofort eine Umrechnungstabelle aus dem Internet. Das ist nicht schlecht, sollte aber der letzte Ausweg sein. RPE ist sehr individuell: In einer Studie zu AMRAP-Sätzen mit 80 % gab es bis zu <b>9 Wiederholungen Unterschied</b> bei gleichem Prozentsatz. Keine Tabelle kann dich vorhersagen.',
   'Erst einfach halten, notieren wie es lief – später haben wir mehr Werkzeuge. Mehr braucht es nicht.']},
  {q:'3. Erst moderates Volumen',a:[
   'Leicht ist das Programm keineswegs. Die Arbeitslast reicht für eine starke Basis, und wenn du Wiederholungsarbeit auf den Big 3 nicht gewohnt bist, wird es dich fordern.',
   'Trotzdem bleibt das Volumen am Anfang bewusst moderat:',
   '<b>1. Weniger Verletzungsrisiko.</b> Mit einer Hochvolumen-Phase einzusteigen klingt auf dem Papier gut. Bist du es aber nicht gewohnt, kippt das Verhältnis von akuter zu chronischer Belastung (letzte Woche wenig gemacht, diese Woche plötzlich 4 × 10 Kniebeugen).',
   'Eine Hochvolumen-Phase kommt später – nach den 4 Wochen Intro und dem 8-Wochen-Programm.',
   '<b>2. Du brauchst vielleicht weniger Volumen, als du denkst.</b> Besser erst mit moderatem Volumen Fortschritte machen und dann steigern. Wer sofort 5 × 5 oder 6 × 4 Kniebeugen ballert, macht sicher Fortschritte – aber womöglich mit „Junk Volume“.',
   'Kommst du damit sehr gut voran, weißt du: So viel mehr brauchst du vorerst nicht.']},
  {q:'4. Deine besten Wiederholungs-Rekorde schlagen',a:[
   'Dieser Zyklus macht Spaß. Man vergisst leicht, worum es beim Heben geht: Gewicht auf die Stange und mehr Gewicht oder mehr Wiederholungen schaffen als je zuvor. Ein simples Spiel.',
   'Wird Volumen zum Selbstzweck, ist schwer zu beurteilen, was Erfolg und was Misserfolg ist – man trainiert schnell ziellos.',
   'Das Ziel hier ist glasklar: aktuelle Daten sammeln, hart genug pushen für einen sinnvollen Reiz über eine breite Intensitätsspanne, dabei beschreibende RPE-Daten erfassen – und am Ende mit <b>90 %, 95 % oder 100 %</b> der Woche-1-Tests mehr Wiederholungen schaffen als je zuvor.',
   'Erreichst du in nur 4 Wochen fast oder sogar neue Bestwerte: <b>Mission erfüllt.</b>',
   'Wenn nicht, löst das längere 8-Wochen-Programm das – mit längerer Entwicklung, mehr Kreuzheben-Volumen und wahrscheinlich V1 (3× Kniebeuge) oder in Extremfällen V4 (3× Kniebeuge UND 6× Bank).']}]},
 {id:'prog',t:'Welches Programm danach?',s:'Der Weg nach dem Intro-Zyklus',ic:'route',items:[
  {q:'Fast alle starten mit der Intro-Phase – danach das Candito 8 Week',a:[
   'Die Intro-Phase soll aktuelle Informationen über deine Kraft liefern, statt sich auf alte Maxima zu verlassen, und einen eher konservativen Zyklus (in Volumen und Last) bieten, der mit AMRAP-Rekorden endet.',
   'Zwei Gruppen sollten die Intro-Phase <b>nicht</b> machen:',
   '<b>1.</b> Wer gerade erst maximal getestet hat – besonders nach einem Wettkampf mit geprüften Standards. Dann direkt ins Candito-8-Wochen-Programm.',
   '<b>2.</b> Wer sehr häufig Bank drückt. V5 des 8-Wochen-Programms hat 6× Bankfrequenz (fast täglich). Für diesen Stil passt das Intro nicht – überspringen.',
   'Alle anderen machen zuerst das Intro. Vermutlich über 90 %. Also nicht aus Ungeduld überspringen – das Eisen belohnt Geduld.']},
  {q:'Alle Versionen des Candito 8 Week',a:[
   '<table class="wtab"><tr><th>Version</th><th>Tage</th><th>Gesamt</th><th>KB</th><th>Bank</th><th>KH</th></tr><tr><td><b>V1</b></td><td>Mo/Di/Do/Sa/So</td><td>5×</td><td>3×</td><td>3×</td><td>2×</td></tr><tr><td><b>V2</b></td><td>Mo/Mi/Fr/Sa</td><td>4×</td><td>2×</td><td>3×</td><td>2×</td></tr><tr><td><b>V3</b></td><td>Mo/Mi/Fr</td><td>3×</td><td>2×</td><td>3×</td><td>1+1</td></tr><tr><td><b>V4</b></td><td>Mo/Di/Mi/Do/Sa/So</td><td>6×</td><td>3×</td><td>6×</td><td>2×</td></tr><tr><td><b>V5</b></td><td>Mo/Mi/Do/Fr/Sa</td><td>5×</td><td>3×</td><td>3×</td><td>2×</td></tr><tr><td><b>V6</b></td><td>Mo/Di/Mi/Fr/Sa/So</td><td>6×</td><td>3×</td><td>0×</td><td>2×</td></tr></table>',
   '<b>V1</b> – die Hauptversion des Programms.',
   '<b>V2</b> – das zweithäufigste Setup, das Candito für Klienten programmiert.',
   '<b>V3</b> – Kreuzheben 1× Wettkampf + 1× Variante. Das meiste Ergebnis pro Trainingsminute.',
   '<b>V4</b> – fast täglich Bankdrücken, kann extrem effektiv sein.',
   '<b>V5</b> – Version mit wenigen Wiederholungen für schwerere oder fortgeschrittene Athleten, die empfindlich auf hohe Wiederholungszahlen reagieren.',
   '<b>V6</b> – Unterkörper wie V1 + Oberkörper zu 100 % Bodybuilding. Diese Version läuft Candito selbst.']},
  {q:'An welchem Wochentag endet welche 8-Wochen-Version?',a:[
   '<div class="wchips"><span>V1 · Freitag</span><span>V2 · Samstag</span><span>V3 · Freitag</span><span>V4 · Freitag</span><span>V5 · Samstag</span><span>V6 · Sonntag</span></div>',
   'Wichtig: Wähle das Programm <b>nicht</b> nach dem Endtag. Wähle es nach deinen Bedürfnissen bei Frequenz und Art der Lifts – der Endtag ist nur ein Hinweis zum Timing.',
   'Bereitest du dich auf einen Wettkampf am Samstag vor und passt deine Version nicht dazu, verschiebe einfach den Start so, dass die Abstände gleich bleiben.',
   'Ohne Wettkampf musst du dir über den Endtag keine Gedanken machen. Lass es, wie es ist.']},
  {q:'Wer sollte nach dem 8 Week die 10RM-Phase machen?',a:[
   '<b>Jeder.</b>',
   'Das 8-Wochen-Programm ist die Hauptkraftphase. Als früher Fortgeschrittener kannst du es erfolgreich wiederholen, würdest aber für die meisten etwas zu schnell Richtung 1RM drücken.',
   'Die 10RM-Phase ist ein 5-Wochen-Block, der <b>nach</b> dem ursprünglichen 8-Wochen-Programm kommt. Danach geht es direkt zurück ins 8-Wochen-Programm – zusammen ein <b>13-Wochen-Makrozyklus</b>. 13 Wochen sind oft der Sweet Spot, um 1RMs konstant aufzubauen: 4 Gelegenheiten pro Jahr, maximal zu testen.',
   'Die 10RM-Phase ist für Powerlifter gemacht – eine Hypertrophiephase im Kontext eines Kraftsportlers. Sie baut eine große Basis mit Volumen auf Bank und Kniebeuge, während Kreuzheben in Erhaltung mit wenig Volumen und mehr Abwechslung bei Kreuzheben-Isolationsübungen läuft.',
   '<b>Kniebeugen-Volumen ist König.</b>',
   'Nicht vermeiden – du wirst froh sein, geduldig dein 10RM aufgebaut zu haben. Das ist langfristig auch selbst ein spaßiges Ziel.']},
  {q:'Alle Versionen der 10RM-Phase',a:[
   '<b>V1 – 5× pro Woche.</b> Die Hauptversion. Im Zweifel diese.',
   '<b>V2 – 3× pro Woche.</b> Die Zeitspar-Version.',
   '<b>V3 – 6× pro Woche.</b> Fast täglich Bank. Wenn du 5–6× pro Woche Bank drücken kannst, diese.',
   '<b>V4 – 5× pro Woche.</b> Bodybuilding Oberkörper + Powerlifting Unterkörper.',
   'Im Vergleich zum 8-Wochen-Programm fehlen zwei Versionen: Es gibt keine Low-Rep-Version und keine Version mit 3× Kniebeuge. Hochwiederholungs-Kniebeugen programmiert Candito in bestimmten Phasen des Jahres grundsätzlich – unabhängig von Gewicht oder Größe. 3× Kniebeuge gibt es in Volumenphasen nicht, weil motorische Kontrolle dort nicht im Fokus steht.']},
  {q:'Wer sollte das 3RM-Programm machen?',a:[
   '<b>Nicht jeder.</b> Hier ist es differenzierter – es gibt 5 mögliche Wege:',
   '<ol class="wol"><li><b>8 Week + 10RM</b> und wiederholen (wie oben beschrieben).</li><li><b>8 Week + 10RM + 3RM</b> und wiederholen – 18 Wochen zwischen Maximalversuchen.</li><li>Die 10RM-Phase künftig auslassen (mindestens einmal aber machen!) und <b>3RM + die kommende 2. Version des 8 Week</b> als 13-Wochen-Paket.</li><li>Der einfachste Weg: <b>3RM + 10-Wochen-Programm</b> als 15-Wochen-Phase.</li><li>Der längste Weg: <b>10RM + 3RM + 10 Week</b> – der ultimative 20-Wochen-Makrozyklus.</li></ol>',
   'Im Zweifel Option 1 – solange du in 13 Wochen <b>15–25 lbs (ca. 7–11 kg)</b> pro Lift zulegst.',
   'Optionen 2–5 sind für alle, die längerfristige Periodisierung brauchen. Das wird irgendwann für fast jeden sinnvoll – aber erst, wenn es sich als nötig erwiesen hat.']},
  {q:'Alle Versionen der 3RM-Phase',a:[
   '<b>V1 – 5× pro Woche.</b> Die Hauptversion, 3× Kniebeuge pro Woche. Im Zweifel diese.',
   '<b>V2 – 4× pro Woche.</b> Wie V1, nur mit 2× Kniebeuge; einige Zubehör-Slots fallen weg, damit es in 4 Tage passt.',
   '<b>V3 – 3× pro Woche.</b> Die Zeitspar-Version.',
   '<b>V4 – 6× pro Woche.</b> Fast täglich Bank. Wenn du 5–6× pro Woche Bank drücken kannst, diese.',
   '<b>V5 – 5× pro Woche.</b> Bodybuilding Oberkörper + Powerlifting Unterkörper.']},
  {q:'Wer sollte das 10-Wochen-Programm machen?',a:[
   'Das 10-Wochen-Programm sollte das <b>zweithäufigste</b> sein: nicht so universell wie das 8-Wochen-Programm, aber nötiger als das 3RM-Programm.',
   'Es richtet sich an etwas weiter fortgeschrittene Athleten (spätes Intermediate bis frühes Advanced) und arbeitet mit Blockperiodisierung und steigendem RPE, um Schwung aufzubauen. Die Ermüdung schwankt weniger als im 8-Wochen-Programm, und die Wiederholungen sind im Schnitt etwas niedriger.',
   'Stagnierst du beim 8-Wochen-Programm als Peak, probiere als Nächstes dieses.',
   'Es besteht aus 2 Blöcken à 5 Wochen, braucht also mindestens einen dritten Block für einen vollständigen Makrozyklus. Drei Wege:',
   '<ol class="wol"><li><b>3RM-Phase + 10 Week</b> – saubere 15 Wochen mit 3RM, 2RM und 1RM.</li><li><b>10RM-Phase + 10 Week</b> – ebenfalls 15 Wochen; passt, wenn du mehr hohe Kniebeugen-Wiederholungen brauchst.</li><li><b>10RM + 3RM + 10 Week</b> – eine komplette 20-Wochen-Phase.</li></ol>']},
  {q:'Alle Versionen des 10-Wochen-Programms',a:[
   'Exakt dieselbe Aufteilung wie bei der 3RM-Phase:',
   '<b>V1 – 5× pro Woche.</b> Hauptversion, 3× Kniebeuge. Im Zweifel diese.',
   '<b>V2 – 4× pro Woche.</b> Wie V1 mit 2× Kniebeuge, einige Zubehör-Slots entfallen.',
   '<b>V3 – 3× pro Woche.</b> Zeitspar-Version.',
   '<b>V4 – 6× pro Woche.</b> Fast täglich Bank.',
   '<b>V5 – 5× pro Woche.</b> Bodybuilding Oberkörper + Powerlifting Unterkörper.']},
  {q:'An welchem Wochentag endet das 10-Wochen-Programm?',a:[
   '<b>Alle Versionen enden am Samstag.</b>',
   'Anders als beim 8-Wochen-Programm gibt es keine Abweichung – ein Vorteil der Blockperiodisierung. Der Peak ist einfacher, und das Programm ist der verlässlichste Weg in die Wettkampfvorbereitung (abgesehen von individuellem Coaching).',
   'Als Intermediate kannst du dich trotzdem gut mit dem 8-Wochen-Programm auf einen Wettkampf vorbereiten.',
   'Das 10-Wochen-Programm entspricht aber eher dem, wie Candito für einen großen Wettkampf mit geringem Risiko programmieren würde: Das Tapering ist weniger drastisch, das letzte schwere Kreuzheben liegt in allen Versionen 1,5 Wochen vor dem Wettkampf, und der Reiz ist insgesamt vorhersehbar und stabil.']}]},
 {id:'faq',t:'Häufige Fragen',s:'RPE, Hype, Pausen & Planung',ic:'faq',items:[
  {q:'Wie tracke ich Sätze, Wiederholungen und Gewicht?',a:[
   'Ganz einfach – Gewichte notieren und den gesamten Verlauf einer Übung ansehen. In dieser App: Satz im Training oder Gym-Modus eintragen und abhaken; den Verlauf siehst du über „Technik & Verlauf“ oder einen Tipp auf die Übung im Progress-Tab.',
   'Original-Erklärvideo: <a href="https://www.youtube.com/watch?v=Q4Mzo6NcnYI" target="_blank" rel="noopener">YouTube öffnen</a>']},
  {q:'Was ist RPE?',a:[
   'RPE gibt an, wie viele Wiederholungen du noch im Tank hattest – rückwärts von 10 gezählt.',
   '<div class="wchips"><span>RPE 10 = 0 Wdh. Reserve</span><span>RPE 9 = 1 Wdh. Reserve</span><span>RPE 8 = 2 Wdh. Reserve</span></div>',
   'In diesen Programmen basiert RPE <b>nicht</b> darauf, wie sich das Gewicht subjektiv angefühlt hat. Manche sagen, RPE 6 sei ein Aufwärmsatz – eine seltsame subjektive Definition. Hier bedeutet es wörtlich 4 Wiederholungen Reserve. Selbst RPE 5 kann ein Arbeitssatz sein.',
   'Zeigt das Video, dass sich der Satz besser bewegt hat, als er sich anfühlte, zählt das objektive RPE nach tatsächlicher Reserve.',
   'Ein halbes RPE wie 8,5 heißt: vielleicht noch 2 Wiederholungen übrig, aber etwas unsicherer als bei einem echten RPE 8.',
   'RPE wird mit Übung besser. Es ist okay, nicht perfekt zu sein – deshalb nutzt das Anfängerprogramm grobe Reserve-Bereiche, während das 8-Wochen-Programm auf halbe RPE-Stufen genau wird.']},
  {q:'Was ist ein RPE-Cap – begrenzt es Wiederholungen oder Last?',a:[
   'RPE-Caps sind ein großer Teil von Canditos Programmierung. Er setzt darauf, vergangene Zyklen leicht zu übertreffen: Schaffst du 2–5 kg mehr in einem Wiederholungsbereich bei ähnlicher Ermüdung, weißt du, dass du im Plan liegst – ohne ein impulsives Single außerhalb des Programms.',
   'Reine offene RPE-Arbeit lässt manchmal zu viel Spielraum für Fehler. Ein Lastziel aus vergangenem Training + RPE-Cap ist das Beste aus beiden Welten: Du kannst nicht überziehen, aber auch nicht übermäßig unterschätzen.',
   '<b>Es begrenzt die LAST.</b> Das kann nicht genug betont werden. Überziehst du bei einem Lift mit RPE-Cap, brich die Wiederholungen <b>niemals</b> ab. Immer die vorgegebenen Wiederholungen schaffen. Aufgeben soll gar nicht erst im Kopf sein – und das objektive RPE ist manchmal anders, als es sich im Moment anfühlt.',
   'Auf den RPE-Cap schaust du erst <b>nach</b> dem Satz. Dann wird die Last für den nächsten Satz gegebenenfalls reduziert, um wieder darunter zu liegen.']},
  {q:'Was ist „Hype“ – und warum taucht es ständig auf?',a:[
   'Das ist typisch für Canditos Coaching-Stil. Hype bedeutet Aufregung, mehr nicht. <b>Niedrig, moderat und hoch</b> sind die drei Kategorien.',
   'Der wissenschaftlich korrekte Begriff wäre „Arousal“ (Erregung) – aber den verwenden wir aus naheliegenden Gründen nicht.',
   'Hype ist wichtig, weil die psychische Erregung einen großen Einfluss auf die bewegte Last hat. Ein RPE-6-Satz mit hohem Hype kann leicht schwerer sein als ein RPE-7-Satz mit niedrigem Hype. Warum das also nicht berücksichtigen?',
   'Hoher Hype bei Zubehörübungen kann ebenfalls viel bewirken – dort lassen es viele Powerlifter schleifen. Gleichzeitig ist hoher Hype bei jedem Satz jeder Übung nicht nachhaltig. Deshalb wird er geplant und gesteuert wie jede andere Variable. Und es macht einfach Spaß, mit „niedrigem Hype“ RPE-8-Rekorde aufzustellen und zu wissen, dass man nächste Woche aufdrehen darf.',
   'Wir wählen unsere Momente mit Bedacht.']},
  {q:'Was ist ein moderater vs. ein weiter Bankdrück-Griff?',a:[
   'Ein „Weitgriff-Drücker“ ist nach zwei Definitionen:',
   '<b>1.</b> Jeder, der mit irgendeinem Teil des <b>Zeigefingers auf den Ringen</b> drückt – eindeutig Weitgriff.',
   '<b>2.</b> Jeder, der <b>1,70 m oder kleiner</b> ist und mit dem <b>Mittelfinger auf den Ringen</b> oder weiter drückt. Etwas subjektiver, aber im Verhältnis zur Statur meist ein Weitgriff.',
   'Liegst du genau an der Grenze – etwa 1,73–1,75 m mit dem Mittelfinger auf den Ringen – frag dich: Stehen die Unterarme im unteren Punkt senkrecht über den Handgelenken?',
   'Sind die Gelenke gestapelt, zählst du als moderater Griff. Beim Weitgriff sind sie nicht gestapelt, deshalb übertragen sich weniger Varianten.',
   'Die Griffbreite hat großen Einfluss auf Volumentoleranz und Übungsauswahl – nach Candito sogar mehr als Sumo vs. konventionell beim Kreuzheben.']},
  {q:'RPE im ersten Satz, im Schnitt, im letzten Satz oder in jedem Satz – wichtig!',a:[
   'Das ist eine der wichtigsten Feinheiten. Die meisten Programme nennen nur ein RPE, ohne zu sagen, was gemeint ist. Ist 3 × 8 @ RPE 8 ein Durchschnitt? Soll jeder Satz angepasst werden? Das führt zu sehr unterschiedlichen Ergebnissen.',
   'Steht im Programm etwas anderes als <b>„in jedem Satz“</b>, gilt für alle Sätze <b>die gleiche Last</b>. Der Unterschied zwischen erstem Satz, Durchschnitt und letztem Satz erklärt sich dann von selbst.',
   'RPE 7 im letzten Satz entspricht im ersten Satz meist etwa RPE 6 oder sogar 5,5 – je nach Übung und Wiederholungsbereich.',
   'Bei Hypertrophiearbeit steht meist „in jedem Satz“, weil effektive Wiederholungen entscheidend sind. Bei manchen Double-Progression-Slots steht RPE 7 im letzten Satz, damit in der Folgewoche ein großes AMRAP (oft bis RPE 9) möglich ist.',
   'Alles hat einen Kontext – und den muss ein gutes Programm benennen. Die App setzt das automatisch um: „in jedem Satz“ passt die Last nach jedem Satz an, alle anderen Angaben übernehmen die Last aus Satz 1.']},
  {q:'Bin ich Anfänger oder Fortgeschrittener?',a:[
   'Außer dem universellen Anfängerprogramm sind alle Programme Intermediate-Programme – die Frage ist also für das gesamte Candito-Forever-System relevant.',
   '<b>Anfänger:</b> Du kannst dein 1RM zuverlässig innerhalb einer Woche steigern.',
   '<b>Intermediate:</b> Du brauchst 4–8 Wochen, um dein 1RM zu steigern.',
   'Wie weit du darüber hinaus bist, spielt kaum eine Rolle – es verändert nur, wie oft du eine 1RM-Phase machst. Deshalb bekommst du alle Werkzeuge, um die passende Kombination für dein Fortschrittstempo zusammenzustellen.',
   'Candito hat früher angenommen, Training führe automatisch zu mehr Volumen oder Frequenz. Oft ist es umgekehrt, weil die absolute Last mit wachsender Kraft steigt. Intermediates und Fortgeschrittene trainieren weitgehend gleich.']},
  {q:'Darf ich die Wochentage des Programms ändern?',a:[
   '<b>Ja und nein.</b>',
   'Idealerweise änderst du die Abstände zwischen den Tagen gar nicht. Sie sind sorgfältig geplant, um bestimmte Tage zu priorisieren und andere gezielt für weniger Volumen zu nutzen.',
   'Alles um ein paar Tage nach hinten zu verschieben und die Abstände <b>exakt</b> gleich zu lassen, ist aber zu 100 % in Ordnung – zum Beispiel Tag 1 am Montag statt am Sonntag und jeder weitere Tag einen Tag später.',
   'Teilweise ist das sogar nötig, etwa für einen Wettkampf am Samstag, wenn ein Programm am Donnerstag oder Freitag peakt. Das muss aber von Anfang an geschehen, damit kein verfrühter Peak entsteht.',
   'In dieser App ist dein Rhythmus Sa / So / Di / Do fest hinterlegt – den Startsamstag stellst du in den Einstellungen ein.']},
  {q:'Krank – Programm neu starten oder Einheiten nachholen?',a:[
   'Ein häufiges Dilemma, kein Grund zur Sorge. Verpasst du ein paar Tage, mach einfach weiter und verschiebe die restlichen Tage gleichmäßig nach hinten.',
   '<b>Packe NICHT Einheiten zusammen</b>, um Zeit aufzuholen. Krank oder stressig heißt: leicht abtrainiert und wahrscheinlich zusätzlicher Stress im Leben – der schlechteste Zeitpunkt, die Trainingsdichte zu erhöhen. Versuch nicht, perfekt zu sein.',
   'Manchmal ist ein Neustart richtig:',
   '<ul class="wul2"><li>Du verpasst <b>1,5 Wochen oder mehr</b> am Stück → komplett neu starten.</li><li>Du bist in den <b>ersten 2 Wochen</b> und wirst <b>3 oder mehr Einheiten</b> verpassen → neu starten, der Nachteil ist gering.</li><li>Du bist in den <b>letzten 2 Wochen</b>, das Volumen sinkt bereits, und du wirst krank → neu starten, weil das Timing des Taperings sonst zerstört ist.</li></ul>',
   'Es gibt gute Gründe für einen Neustart – aber sie sind selten.']},
  {q:'Wie lange soll ich zwischen den Sätzen pausieren?',a:[
   'Es gibt keine Pausenvorgabe, weil Candito <b>VOLLE Erholung</b> empfiehlt.',
   'Meist sind das rund <b>4 Minuten</b>. In manchen Fällen können es <b>5–10 Minuten</b> sein, damit Kopf und Körper für den nächsten Satz wieder voll da sind.',
   'Das ist wichtig, weil 1–2 Minuten Pause nachweislich den Volumenbedarf erhöhen, da die neuronale Aktivierung leidet. In fast allen Fällen – selbst bei Hypertrophie – ist eine kurze Pause schlechter als eine volle.',
   'Deshalb steht der Pausen-Timer der App für Grundübungen standardmäßig auf 4 Minuten und beim High Bar Squat auf 8 Minuten.']}]}];

 w6:{t:'6 Week Version 2',sub:'Candito 6 Week · Version 2 (2025)',c:'#e8484f',ic:'kraft',badge:'6 Wochen · % vom 1RM',pct:['SQ','BP','DL'],
  blurb:'Komplett prozentbasiert auf die großen Drei – 1RMs eintragen, trainieren, wiederholen. Für frühe Fortgeschrittene.',
  sec:[
   {t:'Canditos Beschreibung',items:[
    'Das lang erwartete Update des 6-Wochen-Programms.',
    'Ein feiner Punkt, der im Video nicht erwähnt wird: Beim Bankdrücken gibt es im Gegensatz zum 8-Week-Programm kein Close Grip, kein Feet Up und kein langsam-exzentrisches Bankdrücken. Das ist bewusst so, damit das 6-Wochen-Programm etwas einfacher bleibt – zusätzlich zum prozentbasierten Schema und den Unterschieden im Unterkörper.',
    'Insgesamt hebt sich das Programm sowohl vom alten 6-Week als auch von allen anderen Programmen ab – alle sind gut, haben aber unterschiedliche Rollen.',
    'Alle Programme haben eine Rolle – praktisch jeder wird irgendwann den nächsten Schritt wollen.']},
   {t:'Zusammenfassung aus Canditos Video',items:[
    '<b>Für wen:</b> frühe Fortgeschrittene. 100 % prozentbasiert auf Kniebeuge, Bank und Kreuzheben – Maxima (oder eine grobe Schätzung) eintragen, die App rechnet alles aus. Ideal auch für Athleten aus anderen Sportarten (z. B. Football-Offseason), Bodybuilder, die Powerlifting ausprobieren wollen, und alle, die noch keine RPE-Steuerung und keine Jahresplanung brauchen.',
    '<b>Die Idee:</b> Ein 6-Wochen-Zyklus, der immer wieder wiederholt wird – dein Mesozyklus ist dein Makrozyklus. Du durchläufst in 6 Wochen alle Anpassungen und kannst alle 6 Wochen einen PR erwarten. Kurze 2–3-Wochen-Abschnitte im Zyklus sorgen dafür, dass du gleichzeitig Muskeln und Kraft aufbaust und das Programm ohne Verschleiß wiederholen kannst.',
    '<b>Einordnung:</b> Anfänger machen jede Einheit gleich und steigern linear. Danach kommt eine Woche mit Wellen, dann 4–6-Wochen-Phasen wie dieses Programm – und erst danach das 8-Week-Programm mit gestapelten Zyklen und Blockperiodisierung.',
    '<b>Was am alten 6-Week falsch war:</b> zu große Unterschiede zwischen den Wochen – Kniebeuge mit 8 Sätzen in Woche 1, 15–17 Sätzen in der berüchtigten Woche 2 und danach ab Woche 3 nur noch 5 Sätze oder weniger. Zu lange zu wenig Volumen mit einer Spitze in Woche 2.',
    '<b>Was neu ist:</b> Der Geist der alten Woche 2 bleibt – ein harter Satz auf ein 8er-Maximum und danach ein Backoff von 7×3 mit 80 % oder mehr –, wird aber auf 2–3 Wochen verteilt. In den ersten drei Wochen kommen 11–12 harte Kniebeuge-Sätze pro Woche, dazu ein klarer zweiter Kniebeuge-Tag mit vielen 4×6.',
    '<b>Keine unnötige Variation:</b> High-Bar-Lifter beugen an beiden Tagen High Bar, Low-Bar-Lifter an beiden Tagen Low Bar. Dazu Bodybuilding-Zubehör zum Muskelaufbau.',
    '<b>Sanfterer Peak:</b> Nur die Taper-Woche ist wirklich leicht. Das Zubehör läuft als 4-Wochen-Block, wird in Woche 5 leichter und fällt in Woche 6 weg – du baust deutlich länger Muskeln auf als im alten Programm.',
    '<b>Bankdrücken komplett neu:</b> 3× pro Woche mit logischeren Prozenten und kleineren Sprüngen. Bank ist die einzige Übung mit Singles im Programm, weil sie mehr Intensität und mehr Volumen braucht.',
    '<b>Kreuzheben:</b> Comp Deadlift wird am zweiten Kniebeuge-Tag hart trainiert, dazu ein eigener zweiter Tag mit SLDL als 3×6 mit Top-Satz.',
    '<b>Top-Sätze überall:</b> Auch am Sekundärtag gibt es einen Top-Satz (z. B. 77,5 % × 6) und danach Backoffs (3×6 mit 72,5 %) statt stumpfer 4×6.',
    '<b>Bewusst keine Singles</b> bei Kniebeuge und Kreuzheben – so bleibt mehr Raum für die Volumen-Top-Sätze (basierend auf echten Kunden-Daten). Das Ergebnis: ein schwerer Triple im Kreuzheben und ein schwerer Double in der Kniebeuge in Woche 5. Wer Singles braucht, nimmt das 8-Week-Programm.',
    '<b>Der härteste Kniebeuge-Tag</b> in Woche 3 erinnert an die alte Woche 2 – aber gezügelt: 7×3 statt 10×3 und ein 8er-Maximum statt eines 10er-Maximums.']},
   {t:'Hinweise aus der Tabelle',items:'SQ6INFO'},
   {t:'So ist es in der App umgesetzt',items:[
    'Alle Gewichte der Hauptübungen sind Prozente deiner 1RMs und werden als <b>Vorgabe</b> angezeigt, gerundet auf deine Rundung (2,5 kg).',
    'Formelfehler in der Original-Tabelle: Am Kniebeuge-Tag (Tag 4, Wochen 1–5) und beim Bank-Single in Woche 6 prüft die Tabelle eine leere Zelle auf „kg“ und rechnet deshalb immer im lb-Modus – auf 5 gerundet und mit lb-Zuschlägen (+5/+10), selbst wenn du kg eingestellt hast. Der kg-Zweig wäre zudem fehlerhaft (er greift auf das Kreuzheben-1RM zu). Die App rechnet diese Sätze als saubere kg-Version: gleiche Prozente vom Kniebeuge- bzw. Bank-1RM, Zuschläge in kg, auf 2,5 kg gerundet. Dadurch können einzelne Sätze 2,5–5 kg unter dem Wert liegen, den die Tabelle anzeigen würde.',
    'Zubehör-Auswahl wie in der Tabelle voreingestellt: <b>Barbell Row</b> (Alternativen: Dumbbell Row, Machine Row) und <b>Seated Dumbbell OHP</b> (Alternativen: Standing Dumbbell OHP, Military Press, Lateral Dumbbell Raise).',
    'Nach dem Test empfiehlt Candito, das Programm direkt in der nächsten Woche erneut zu starten – ein Deload ist nur bei Bedarf als Woche 7 vorgesehen.']}]},
 pk8:{t:'8 Week Peak',sub:'Candito 8 Week Peak · Patriot Signature',c:'#7fa8ff',ic:'test',badge:'8 Wochen · 2 Blöcke',pct:['SQ'],
  blurb:'Zwei 4-Wochen-Blöcke mit großen Intensitäts-Drop-offs, Block 1 endet bei RPE 8, Block 2 ohne Limit.',
  sec:[
   {t:'Canditos Beschreibung',items:['Ein lang erwartetes Programm. Die Aufschlüsselung der Besonderheiten steht in der Tabelle selbst. Die Hauptrolle hier: 4-Wochen-Blöcke – ein Format, das keins seiner anderen Programme hat. Viel Erfolg.']},
   {t:'Mission Objectives',items:[
    '<b>1.</b> Im Vergleich zu allen anderen Programmen von Candito hat dieses die größten Intensitäts-Drop-offs bei der Volumenarbeit. Außerdem startet die RPE ungewöhnlich niedrig. Insgesamt ergibt das einen submaximalen RPE-Schnitt – für viele Lifter ideal.',
    '<b>2.</b> Woche 2 ist fast komplett vorgegeben, Woche 3 und 4 öffnen wieder mit RPE-Top-Sätzen. Das hält es einfach.',
    '<b>3.</b> Gleichmäßiger verteiltes Volumen. Seine Intermediate-Programme stapeln oft schwere Langhantelarbeit und Zubehör an einem Primärtag – je stärker du wirst, desto klüger ist moderates Volumen über die ganze Woche.',
    '<b>4.</b> Stärkere Polarisierung der Last zwischen den Tagen: statt 3×3 @ RPE 6 + 3×5 @ RPE 7–8 genau umgekehrt – höhere RPE bei wenigen Wiederholungen, niedrigere RPE bei mehr Wiederholungen.',
    '<b>5.</b> Fast kein Fokus auf Tier-2-Übungen: keine Hack Squats, keine Leg Press, kein Feet Up Bench. Stattdessen Tier 1 (Wettkampfübungen) oder Tier 3 (Bodybuilding) für maximale Erholung.',
    '<b>6.</b> Vier Versionen, um das Programm an deine Bedürfnisse anzupassen. Für jeden Zubehör-Slot gibt es Home-Gym-Alternativen – keine Ausreden.',
    '<b>7.</b> Der erste 4-Wochen-Block endet bei RPE 8 statt RPE 9–10 – das einzige Programm von Candito, das das macht. Dieser Stil braucht Geduld und Fokus. Lock in.']},
   {t:'Kontext der Mission',items:['Das Programm ist für zwei Makropläne gemacht:','<b>Option 1:</b> Nach dem 5-RM-Programm (Side Quest) laufen lassen.','<b>Option 2:</b> Nach dem 3RM-Programm – funktioniert sehr gut für alle, die gut auf niedrige Wiederholungen reagieren.']},
   {t:'Was Candito von dir braucht',items:['<b>Ehrliche RPE-Angaben</b> – mit Demut und Ehrlichkeit bewerten.','<b>Fokus und Geduld</b> – nichts kommt leicht, aber Momentum baut sich stärker auf, als du denkst.','<b>Keine Ausreden.</b>','<b>Begeisterung und Leidenschaft</b> – der perfekte Plan bringt nichts, wenn du nicht mit Herz dabei bist. Hype dich und stell neue Allzeit-Rekorde auf!']},
   {t:'So ist es in der App umgesetzt',items:['Die Prozent-Vorgaben der Kniebeuge rechnen mit deinem Kniebeuge-1RM. Bank- und Kreuzheben-1RM werden laut Tabelle nicht gebraucht – dort steuern RPE-Top-Sätze und Prozent-Backoffs.','Lasten, die die Tabelle aus Vorwochen oder Top-Sätzen ableitet (z. B. +4 % zur Vorwoche, 96 % vom Top-Satz), rechnet die App genauso und zeigt sie als Vorgabe.']}]},
 rm5:{t:'5 RM Program',sub:'Candito 5 RM Phase',c:'#43c08a',ic:'zyklen',badge:'4 Wochen · 5RM-Test',pct:['SQ'],
  blurb:'4-Wochen-Block Richtung 5RM – Hauptübungen plus leichteres Zubehör, keine gestapelten Primärtage.',
  sec:[
   {t:'Canditos Beschreibung',items:[
    'Das Programm hat 4 Hauptziele:',
    '<b>1.</b> Das einzige Programm mit einem 4-Wochen-Block. Es folgen 8 weitere Wochen mit ähnlichen Tabellen, die in 2 weiteren Phasen bis zum 1RM führen.',
    '<b>2.</b> Weniger mittlere Übungen: Feet Up Bench, Close Grip Bench und Pendulum Squats tauchen seltener auf. Bewusst Hauptübung plus leichteres Zubehör für bessere Erholung (Tier 1 und Tier 3, weniger Tier 2).',
    '<b>3.</b> Keine gestapelten Primärtage: Der Primär-Kreuzheben-Tag liegt nie auf dem Primär-Kniebeuge-Tag – anders als beim 8-Week-Programm.',
    '<b>4.</b> Nutzbar als komplett neuer Pfad (für die kommenden 4-Wochen-Phasen), als Brücke zwischen Phasen (z. B. 10RM + 5RM + 3RM + 10-Wochen-Programm) oder – wohl am häufigsten – als Ersatz für das 10RM-Programm mit dem 10-Wochen-Programm direkt danach. Alle Optionen sind in Ordnung.']},

 {const a=sqActive();if(a){const pd=phaseDone(a),r=sqRange(a);const e=r.b?new Date(r.b):null;if(e)e.setHours(23,59,0,0);if(pd.n<pd.t&&(!e||e>=today))return a}}

 S.meta.pause={since:isoD2(new Date()),prog:id,nd:n&&n.dt?isoD2(n.dt):isoD2(new Date()),w:n?n.w:0,d:n?n.d:0};saveMeta();render();window.scrollTo({top:0});toast('Pause aktiv – gute Besserung!')}
function pauseInfo(){const p=S.meta.pause;if(!p)return null;const today=d0(new Date()),since=d0(p.since+'T12:00:00'),nd=d0(p.nd+'T12:00:00');
 const days=Math.round((today-since)/DAYMS);const weeks=today>nd?Math.ceil((today-nd)/DAYMS/7):0;
 const nw=withProg(p.prog,()=>NW());const missed=withProg(p.prog,()=>{let c=0;for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){if(dayStatus(w,d)==='done')continue;const dt=d0(dayDate(w,d));if(dt>=nd&&dt<today)c++}return c});
 const why=[];if(days>=11)why.push('du 1,5 Wochen oder länger raus warst');if(p.w<2&&missed>=3)why.push('du in den ersten 2 Wochen 3 oder mehr Einheiten verpasst hast');if(p.w>=nw-2&&missed>0)why.push('du in den letzten 2 Wochen (Tapering) ausgefallen bist');
 return {p,days,weeks,missed,why,nw}}

 const today=d0(new Date());const sat=new Date(today);sat.setDate(sat.getDate()+((6-sat.getDay()+7)%7));const old=d0(withProg(id,progStart)+'T12:00:00');const wk=Math.round((sat-old)/DAYMS/7);
 withProg(id,()=>{for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const k=key(w,d);if(S.logs[k]){S.logs[k]={b:P[w][d].b.map(bl=>Array.from({length:bl.s},()=>({}))),note:'',u:0,resetAt:Date.now()+1};saveLog(k)}}});
 delete S.meta.pause;if(wk)shiftFrom(id,wk);else{saveMeta();render()}cache();toast(`${PROGS[id].name} startet neu am ${sat.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})}`)}

 const nd=new Date(p.nd+'T12:00:00');nd.setDate(nd.getDate()+weeks*7);
 return `<section class="card pzcard"><p class="eyebrow">Pause aktiv · seit ${fm(p.since)}</p><h1 class="disp">Erhol dich <span>gut.</span></h1>

  <div class="pzst"><span><b>${days}</b><small>Tag${days===1?'':'e'} Pause</small></span><span><b>${missed}</b><small>Einheiten verschoben</small></span><span><b>${weeks?'+'+weeks:'0'}</b><small>Woche${weeks===1?'':'n'} Verschiebung</small></span></div>

 const ten=o.slice(0,i+1).some(x=>PTYPE(x)==='10rm'&&(x!==cur||t==='10rm'));if(!ten&&t==='8w')return null; // 10RM mindestens einmal

function phaseLift(id){return withProg(id,()=>{const A=allSets();const r={};['sq','bp','dl'].forEach(g=>{
  let best=null;A.forEach(s=>{if(EX[s.e].g===g&&EX[s.e].m&&s.e1&&(best==null||s.e1>best))best=s.e1});
  const ti=AMI(g);let test=null;if(ti>=0){const s=setOf(TWg(g),TDg(g),ti,0);const kg=pnum(s.kg),rr=pnum(s.r);if(kg&&rr)test=e1rm(kg,rr,pnum(s.rpe)??(rr===1?10:9))}
  r[g]={best,test,val:test||best}});r.tot=['sq','bp','dl'].every(g=>r[g].val)?r.sq.val+r.bp.val+r.dl.val:null;return r})}

  ['sq','bp','dl'].forEach(g=>{const x=a.L[g].val,y=b.L[g].test||b.L[g].val;if(x&&y)amp.push({from:a.id,to:b.id,g,d:y-x})})}

const PDC={year:'#e2b04a',kraft:'#e8484f',treue:'#43c08a',volumen:'#5ad1e6',rpe:'#b48cff',whoop:'#f0a066',backoff:'#ff7a59',punkte:'#f3c969',rekorde:'#e2b04a',zyklen:'#7fa8ff',test:'#e8484f',verlauf:'#9aa0a8'};
function spark(v,c,W=120,H=34){const x=v.map((y,i)=>[i,y]).filter(p=>p[1]!=null);if(x.length<2)return `<svg class="tsp" viewBox="0 0 ${W} ${H}"><line x1="0" x2="${W}" y1="${H-4}" y2="${H-4}" stroke="rgba(255,255,255,.12)" stroke-dasharray="3 4"/></svg>`;
 const lo=Math.min(...x.map(p=>p[1])),hi=Math.max(...x.map(p=>p[1])),n=v.length-1||1;const pt=x.map(([i,y])=>[(i/n)*(W-4)+2,H-4-((y-lo)/((hi-lo)||1))*(H-10)]);
 const d=pt.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<svg class="tsp" viewBox="0 0 ${W} ${H}"><path d="${d} L${pt[pt.length-1][0]} ${H} L${pt[0][0]} ${H}Z" fill="${c}" opacity=".14"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${pt[pt.length-1][0]}" cy="${pt[pt.length-1][1]}" r="3" fill="${c}"/></svg>`}
function minibars(v,c){const m=Math.max(1,...v);return `<div class="tmb">${v.map(x=>`<i style="height:${Math.max(6,x/m*100)}%;background:${x?c:'rgba(255,255,255,.08)'}"></i>`).join('')}</div>`}
function renderProg(){const D=progData(),{A}=D;
 const pd=S.ui.pd;if(pd&&D.sec[pd]){const [t,sub]=PDT[pd];return `<div class="pdh" style="--pc:${PDC[pd]}"><button type="button" class="pdb" data-pdback aria-label="Zurück zur Übersicht"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><div><p class="eyebrow">Progress · ${esc(PROGS[PROG].short)}</p><h2 class="pdt">${t}</h2></div><span class="pdi"><svg viewBox="0 0 24 24">${PDI[pd]}</svg></span></div><div class="pdbody">${D.sec[pd]()}</div>`}
 const T=(k,val,unit,sub,viz,wide)=>`<button type="button" class="ptile ${wide?'wide':''}" data-pd="${k}" style="--pc:${PDC[k]}"><span class="ptl"><svg viewBox="0 0 24 24">${PDI[k]}</svg>${PDT[k][0]}</span><span class="ptv"><b>${val}</b>${unit?`<small>${unit}</small>`:''}</span>${viz||''}<span class="pts">${sub}</span><svg class="ptc" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>`;
 // Jahresplan
 const o=ORD();const today=new Date();today.setHours(12,0,0,0);let cur=o.indexOf(PROG);const pstart=id=>new Date(withProg(id,progStart)+'T12:00:00');
 const t0=pstart(o[0]),t1=new Date('2027-12-31T12:00:00');const yp=Math.max(0,Math.min(1,(today-t0)/(t1-t0)));
 const segs=o.map(id=>{const a=pstart(id),dn=phaseDone(id);const ty=PTYPE(id);return `<i class="ty-${ty} ${id===PROG?'cur':''}" style="flex:${withProg(id,NW)}" title="${esc(PROGS[id].short)}"><em style="width:${Math.round(dn.n/dn.t*100)}%"></em></i>`}).join('');
 const year=`<button type="button" class="ptile wide year" data-pd="year" style="--pc:${PDC.year}"><span class="ptl"><svg viewBox="0 0 24 24">${PDI.year}</svg>Jahresplan</span><span class="ptv"><b>${esc(PROGS[PROG].short)}</b><small>Phase ${cur+1} / ${o.length}</small></span><div class="yseg">${segs}</div><span class="pts">${Math.round(yp*100)} % des Weges bis 31.12.2027 · ${o[cur+1]?'danach '+esc(PROGS[o[cur+1]].short):'letzte Phase'}</span><svg class="ptc" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>`;
 // Kraft
 const tot=[...Array(NW()).keys()].map(w=>{const v=D.series.map(s=>s.v[w]);return v.every(x=>x!=null)?v.reduce((a,b)=>a+b,0):null});
 const anyB=['sq','bp','dl'].filter(k=>D.best[k]);
 const kraft=T('kraft',D.total?nf(D.total,0):anyB.length?nf(anyB.reduce((a,k)=>a+D.best[k],0),0):'–',D.total?'kg Total':anyB.length?'kg (Teil)':'',D.total?`SQ ${nf(D.best.sq,0)} · BP ${nf(D.best.bp,0)} · DL ${nf(D.best.dl,0)}`:'e1RM aus deinen Wettkampf-Lifts',spark(tot,PDC.kraft));
 // Treue
 const R=adhAll(),t=R.tot,hp=t.ev?t.hit/t.ev:null,vp=t.plan?t.done/t.plan:null;
 const treue=T('treue',hp!=null?Math.round(hp*100):'–',hp!=null?'%':'',hp!=null?`Umfang ${Math.round((vp||0)*100)} % · ${t.hit}/${t.ev} Vorgaben`:'erscheint nach den ersten Sätzen',`<span class="tring">${ringSVG(hp||0,PDC.treue,46,6)}</span>`);
 // Volumen
 const wt=D.tw.map(x=>Object.values(x.vals).reduce((a,b)=>a+b,0));
 const vol=T('volumen',nf(D.tonnage/1000,1),'t',`${D.doneSets} / ${D.plannedSets} Sätze`,minibars(wt,PDC.volumen));
 // RPE
 const dv=D.dev;const rpeTxt=dv==null?'RPE eintragen':Math.abs(dv)<=.25?'Treffsicher':dv>0?'Härter als geplant':'Leichter als geplant';
 const pos=dv==null?50:50+Math.max(-1.5,Math.min(1.5,dv))/1.5*50;
 const rpe=T('rpe',dv==null?'–':(dv>0?'+':'')+nf(dv,2),dv==null?'':'Ist − Soll',rpeTxt,`<span class="tgauge"><i style="left:${pos}%"></i></span>`);
 // WHOOP
 const ws=[];for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const L=log(w,d);if(L&&L.whoop&&L.whoop.rec!=null)ws.push(L.whoop)}
 const ar=ws.length?ws.reduce((a,x)=>a+x.rec,0)/ws.length:null,hrv=ws.filter(x=>x.hrv!=null);
 const wh=T('whoop',ar!=null?nf(ar,0):'–',ar!=null?'% Ø Recovery':'',ws.length?`${ws.length} Einheit${ws.length===1?'':'en'}${hrv.length?' · Ø HRV '+nf(hrv.reduce((a,x)=>a+x.hrv,0)/hrv.length,0)+' ms':''}`:'WHOOP-Werte zu Einheiten eintragen',spark(ws.map(x=>x.rec),PDC.whoop));
 // Top & Backoff
 const bp2=backoffPairs();const bdr=bp2.map(x=>x.drop).filter(v=>v!=null);const bdm=bdr.length?bdr.reduce((a,c)=>a+c,0)/bdr.length:null;const bhit=bp2.filter(x=>x.dPct!=null);
 const bo=T('backoff',bdm==null?'–':(bdm>0?'+':bdm<0?'−':'')+nf(Math.abs(bdm),1),bdm==null?'':'% Ø Abfall',bp2.length?`${bp2.length} Backoff-Blöcke${bhit.length?' · '+bhit.filter(x=>Math.abs(x.dPct)<=1.5).length+'/'+bhit.length+' Last getroffen':''}`:'erscheint nach Top-Satz + Backoffs');
 // Punkte
 const bw=curBw(),f=S.meta.sex==='w';const gl=D.total&&bw?ipfgl(D.total,bw,f):null;
 const pk=T('punkte',gl!=null?nf(gl,1):'–',gl!=null?'IPF GL':'',gl!=null?`DOTS ${nf(dots(D.total,bw,f),1)} · ${nf(bw,1)} kg KG`:!bw?'Körpergewicht eintragen':'braucht alle drei Lifts');
 // Rekorde
 const pr=Object.values(D.prs).filter(x=>EX[x.e].m);const top=pr.sort((a,b)=>b.e1-a.e1)[0];
 const rek=T('rekorde',pr.length||'–',pr.length?'Übungen':'',top?`Top: ${esc(EX[top.e].n)} ${nf(top.e1,0)} kg`:'Bestwerte erscheinen nach den ersten Sätzen');
 // Zyklen
 const doneP=o.filter(id=>{const x=phaseDone(id);return x.n>=x.t}).length;
 const zy=T('zyklen',doneP,'/ '+o.length,`Phasen abgeschlossen`);
 // Test
 const td=dayDate(TW(),TD());const dd=td?Math.round((new Date(td).setHours(12,0,0,0)-today)/864e5):null;
 const te=T('test',dd==null?'–':dd>0?dd:dd===0?'Heute':'✓',dd>0?'Tage':'',td?`${DAYS[TD()].wdl}, ${new Date(td).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})} · W${TW()+1}`:'');
 // Verlauf
 const ver=T('verlauf',D.sessions.length,'/ '+NS(),D.sessions.length?(()=>{const [w,d]=D.sessions[D.sessions.length-1];const L=log(w,d);return 'Zuletzt '+(L.date?new Date(L.date).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}):'W'+(w+1)+' '+DAYS[d].tag)})():'noch keine Einheit abgeschlossen',`<div class="tdots">${[...Array(NS()).keys()].map(i=>`<i class="${dayStatus(Math.floor(i/ND()),i%ND())==='done'?'on':''}"></i>`).join('')}</div>`);
 return `<div class="phead"><h2 class="sect" style="margin:0">Progress</h2><span class="phs">${esc(PROGS[PROG].name)}</span></div>
  <div class="pgrid">${year}${kraft}${treue}${vol}${rpe}${bo}${wh}${pk}${rek}${zy}${te}${ver}</div>`}

const GSORD=BASEORD;
const gsNum=v=>{const n=pnum(v);return n==null?'':String(n).replace('.',',')};
function gsExport(){const rows=[['Schlüssel','kg','Wdh','RPE','Erledigt']];
 GSORD.forEach(pid=>withProg(pid,()=>{for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const L=log(w,d);if(!L)continue;P[w][d].b.forEach((bl,b)=>(L.b[b]||[]).forEach((x,i)=>{if(i>=bl.s)return;const kg=gsNum(x.kg),r=gsNum(x.r),rp=gsNum(x.rpe);if(!kg&&!r&&!rp&&!x.ok)return;rows.push([`${pid}|${w+1}|${d+1}|${b+1}|${i+1}`,kg,r,rp,x.ok?'✓':''])}))}}));
 const tsv=rows.map(r=>r.join('\t')).join('\n');const n=rows.length-1;
 const done=()=>{S.ui.gsMsg=`${n} Sätze kopiert – jetzt im Sheet „App-Import“ in A1 einfügen.`;toast(`${n} Sätze kopiert`);render()};
 const fb=()=>{const t=$('#gsin');if(t){t.value=tsv;t.focus();t.select();try{document.execCommand('copy');done();return}catch(_){}}S.ui.gsMsg='Kopieren wurde blockiert – der Text steht im Feld, bitte markieren und kopieren.';render();setTimeout(()=>{const t2=$('#gsin');if(t2){t2.value=tsv;t2.select()}},50)};
 try{navigator.clipboard.writeText(tsv).then(done,fb)}catch(_){fb()}}
function gsImport(){const t=$('#gsin');const txt=(t&&t.value||'').trim();if(!txt){toast('Erst die Daten aus dem Sheet einfügen');return}
 let n=0,skip=0;const touched=new Set();
 txt.split(/\r?\n/).forEach(line=>{const c=line.split('\t').map(x=>x.trim());const m=(c[0]||'').match(/^(intro|p8b?|p10b?|p8c|p10c|p3|p10w|p10d)\|(\d+)\|(\d+)\|(\d+)\|(\d+)$/);if(!m)return;
  const [,pid,W,D,B,I]=m;const w=+W-1,d=+D-1,b=+B-1,i=+I-1;
  withProg(pid,()=>{if(!P[w]||!P[w][d]||!P[w][d].b[b]||i>=P[w][d].b[b].s){skip++;return}
   const kg=pnum(c[1]),r=pnum(c[2]),rp=pnum(c[3]),ok=/✓|x|ja|true|1/i.test(c[4]||'');if(kg==null&&r==null&&rp==null&&!ok)return;
   const L=log(w,d,true);const x=L.b[b][i]||(L.b[b][i]={});let ch=false;
   if(kg!=null&&pnum(x.kg)!==kg){x.kg=nf(kg,2);ch=true}if(r!=null&&pnum(x.r)!==r){x.r=nf(r,0);ch=true}if(rp!=null&&pnum(x.rpe)!==rp){x.rpe=nf(rp,1);ch=true}
   if(ok&&!x.ok){x.ok=true;x.t=x.t||Date.now();ch=true}
   if(ch){n++;touched.add(pid+'|'+key(w,d))}})});
 touched.forEach(t=>{const [pid,k]=t.split('|');withProg(pid,()=>{const L=S.logs[k];if(!L)return;
  const m=k.match(/w(\d+)d(\d+)$/);const w=+m[1]-1,d=+m[2]-1;const all=P[w][d].b.every((bl,b)=>bl.opt||L.b[b].slice(0,bl.s).every(x=>x.ok));
  if(all&&!L.done){L.done=true;if(!L.date)L.date=dayDate(w,d)?.toISOString()}if(!L.u)L.u=Date.now();saveLog(k)})});
 cache();if(t)t.value='';S.ui.gsMsg=n?`${n} Sätze aus dem Sheet übernommen${skip?` · ${skip} unbekannte Zeilen übersprungen`:''}.`:'Keine Änderungen – App und Sheet sind schon gleich.';toast(n?`${n} Sätze übernommen`:'Schon aktuell');render()}
function exportCsv(){const rows=[['Woche','Tag','Wochentag','Übung','Satz','kg','Wdh','RPE','Soll-RPE','erledigt','Pause (s)','e1RM']];
 for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const L=log(w,d);if(!L)continue;P[w][d].b.forEach((bl,b)=>(L.b[b]||[]).forEach((s,i)=>{if(!pnum(s.kg)&&!pnum(s.r))return;
  const e=e1rm(pnum(s.kg),pnum(s.r),pnum(s.rpe));rows.push(['W'+(w+1),DAYS[d].tag,DAYS[d].wdl,EX[bl.e].n,i+1,s.kg??'',s.r??'',s.rpe??'',bl.rpe!=null?nf(bl.rpe):'',s.ok?'ja':'nein',s.rest??'',e?nf(e,1):''])}))}

 o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+delay;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+ms/1000);o.start(t0);o.stop(t0+ms/1000+.03)}catch(e){}}

function firstOpenBlock(w,d){const L=log(w,d);const day=P[w][d];for(let b=0;b<day.b.length;b++){if(!(L&&L.b[b].slice(0,day.b[b].s).every(s=>s.ok)))return b}return -1}
function blockHTML(w,d,b){const k=key(w,d);const open=S.ui.openB&&S.ui.openB[k]!=null?S.ui.openB[k]:-1;const nextB=firstOpenBlock(w,d);
 const bl=P[w][d].b[b],ex=EX[bl.e],L=log(w,d),sets=L?L.b[b].slice(0,bl.s):[];
 if(b===open){const h=blockHTMLFull(w,d,b);return h.replace('<span class="plate" aria-hidden="true"></span>',icoX(bl.e,'lg')).replace('class="card blk ','class="card blk open ')}
 const done=sets.filter(s=>s.ok).length,all=done===bl.s;const sg=sugg(w,d,b,Math.min(done,bl.s-1));
 return `<button type="button" class="card blk mini ${all?'done':''} ${b===nextB?'next':''}" data-openb="${b}" style="--c:${GC[ex.g]}"><span class="bn">${b+1}</span>${icoX(bl.e)}

const fmtHMS=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const fmtHM=ms=>{const m=Math.round(ms/60000);return m>=60?`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')} h`:`${m} min`};
function lastAct(L){return Math.max(L.start||0,L.pausedAt||0,...(L.b||[]).flat().map(s=>s.t||0))}
const isLive=L=>!!(L&&L.start&&!L.done&&Date.now()-lastAct(L)<4*3600e3);
function cleanStale(){if(!S.synced)return;const now=Date.now();for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const L=log(w,d);if(L&&L.start&&!L.done&&!L.b.flat().some(x=>x.ok)&&now-lastAct(L)>3*3600e3){delete L.start;delete L.pausedAt;delete L.end;L.pauseMs=0;saveLog(key(w,d))}}}
function sessEl(L,now=Date.now()){if(!L||!L.start)return 0;if(L.done&&L.dur!=null)return L.dur;const end=L.end||(isLive(L)?now:lastAct(L));return Math.max(0,end-L.start-(L.pauseMs||0)-(L.pausedAt?now-L.pausedAt:0))}
function runningSession(){let r=null;for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const L=log(w,d);if(isLive(L)&&(!r||L.start>r.L.start))r={w,d,L}}return r}
function startSession(w,d){const L=log(w,d,true);if(L.done)return;if(L.start&&!L.b.flat().some(s=>s.ok)&&Date.now()-L.start>3*3600e3){delete L.start;delete L.pausedAt;L.pauseMs=0}if(!L.start){L.start=Date.now();L.pauseMs=0;if(!L.date)L.date=new Date().toISOString();saveLog(key(w,d));toast('Trainings-Timer läuft')}}
function toggleSessPause(w,d){const L=log(w,d,true);if(!L.start||L.done)return;const now=Date.now();if(L.pausedAt){L.pauseMs=(L.pauseMs||0)+(now-L.pausedAt);delete L.pausedAt}else L.pausedAt=now;saveLog(key(w,d));render();if(!$('#gym').hidden)gymRefresh()}
function finishSession(w,d){const L=log(w,d,true);const now=Date.now();delete L.reopened;if(L.pausedAt){L.pauseMs=(L.pauseMs||0)+(now-L.pausedAt);delete L.pausedAt}
 if(!L.start)L.start=now;L.end=now;L.dur=Math.max(0,now-L.start-(L.pauseMs||0));L.done=true;if(!L.date)L.date=new Date().toISOString();saveLog(key(w,d));queueOutbox(w,d,true);stopRest();showSummary(w,d)}
function reopenSession(w,d){const L=log(w,d,true);const now=Date.now();if(L.end)L.pauseMs=(L.pauseMs||0)+(now-L.end);delete L.end;delete L.dur;L.done=false;L.reopened=now;saveLog(key(w,d))}
