<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..104,500..900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Gestaltung angelehnt an das Powerlifting Coach Cockpit: ein dunkles Erscheinungsbild, Karten mit 20px Radius,
   Archivo (kondensiert) für Leistungszahlen, Manrope für Text, JetBrains Mono für Technik.
   Layout: Phone = Kopf (Woche/Tag), Inhalt, Tab-Leiste unten; ab 960px Seitenleiste. Jeder Trainingstag hat eine eigene Farbe. */
:root{
  --bg:#090a0e; --bg2:#1c1f27; --card:#15171d; --raise:#242833;
  --line:#262a35; --line2:#3a3f4d;
  --ink:#f5f5f6; --ink2:#a6a9b4; --mut:#8a8f9b;
  --brand:#ed2438; --action:#d21c2f; --hi:#ff5a5f; --brand-soft:rgba(237,36,56,.12);
  --ok:#43c08a; --ok-soft:rgba(67,192,138,.12); --warn:#e39150; --warn-soft:rgba(227,145,80,.13); --cyan:#57c7d4;
  --sq:#f0625d; --bp:#e3b34c; --dl:#6e9fd6; --acc:#8e93a1;
  --day:#f0625d; --day-soft:rgba(240,98,93,.14);
  --d:"Archivo","Manrope",-apple-system,system-ui,sans-serif;
  --f:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-s:10px; --r-m:14px; --r-l:20px; --tab:64px;
  --sh:inset 0 1px 0 rgba(255,255,255,.04),0 12px 28px -20px rgba(0,0,0,.9);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(90% 50% at 85% -10%,color-mix(in srgb,var(--day) 14%,transparent),transparent 60%),radial-gradient(70% 40% at -10% 0%,rgba(87,199,212,.05),transparent 60%);transition:background .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--bg)}
body{padding-top:env(safe-area-inset-top,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mut)}
.disp{font-family:var(--d);font-stretch:64%;font-weight:900;line-height:.95;letter-spacing:0;text-wrap:balance}
.zahl{font-family:var(--d);font-stretch:72%;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.zahl small{font-family:var(--f);font-size:.4em;font-weight:600;color:var(--mut);margin-left:3px}

/* ---------- Rahmen ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(9,10,14,.86);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:grid;gap:10px}
.marke{display:flex;align-items:center;gap:12px;min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:50%;background:var(--day);display:grid;place-items:center;box-shadow:inset 0 0 0 4px rgba(0,0,0,.25);transition:background .3s}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--bg)}
.marke .mt{display:flex;flex-direction:column;min-width:0;flex:1}
.marke b{font-family:var(--d);font-stretch:80%;font-weight:900;font-size:19px;line-height:1.1;white-space:nowrap}
.marke span{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--warn)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line)}
.seg button{min-height:44px;border:0;border-radius:var(--r-s);background:transparent;color:var(--ink2);font-weight:800;font-size:13.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 2px;transition:background .2s}
.seg button small{font-size:11.5px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line2) inset}
.seg button[aria-pressed="true"] small{color:var(--ink2)}
.tgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tcell{--c:var(--sq);position:relative;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--ink);transition:background .2s,border-color .2s}
.tcell::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--c);opacity:.55}
.tcell b{font-size:14px;font-weight:800}
.tcell small{font-size:12px;color:var(--mut)}
.tcell[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.tcell[aria-pressed="true"]::before{display:none}
.tcell[aria-pressed="true"] b,.tcell[aria-pressed="true"] small{color:#0b0c10}
.tcell .st{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%}
.st.done{background:var(--ok)} .st.part{background:var(--warn)}
.tcell[aria-pressed="true"] .st{box-shadow:0 0 0 2px #0b0c10}

body.tmr main{padding-bottom:calc(var(--tab) + 120px + env(safe-area-inset-bottom,0px))}
main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(var(--tab) + 40px + env(safe-area-inset-bottom,0px))}
#view{display:grid;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--tab) + env(safe-area-inset-bottom,0px));padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px));background:rgba(12,13,18,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav button{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--mut);transition:color .2s var(--ease),background .2s}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--ink);background:linear-gradient(180deg,var(--day-soft),transparent 80%)}
.nav button[aria-current="page"] svg{stroke:var(--day)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--day)}
@media (min-width:960px){
  .nav{top:0;right:auto;width:224px;height:auto;display:flex;flex-direction:column;gap:4px;padding:calc(150px + env(safe-area-inset-top,0px)) 14px 20px max(14px,env(safe-area-inset-left,0px));border-top:0;border-right:1px solid var(--line);background:rgba(12,16,22,.96)}
  .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;border-radius:12px;font-size:14px}
  .nav button[aria-current="page"]{background:var(--card)}
  .nav button[aria-current="page"]::before{top:12px;bottom:12px;left:0;right:auto;width:3px;height:auto;border-radius:0 3px 3px 0}
  .top{padding-left:224px} main{padding-left:calc(224px + 36px);padding-right:36px;max-width:calc(1180px + 224px)}
  .tbar{left:224px!important}
}

/* ---------- Karten ---------- */
.card{position:relative;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);padding:18px}
.ct{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.h2{font-family:var(--d);font-stretch:104%;font-weight:750;font-size:17px;line-height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.chip.plain::before{display:none}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.red{background:var(--brand-soft);border-color:transparent;color:var(--hi)}
.chip.day{background:var(--day-soft);border-color:transparent;color:var(--day)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--bg2);font-weight:700;font-size:14px;color:var(--ink);transition:border-color .2s,background .2s,transform .12s}
.btn:hover{border-color:var(--mut)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--action);border-color:transparent;color:#fff}
.btn.klein{min-height:36px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.aktionen{display:flex;flex-wrap:wrap;gap:8px}
.aktionen .primary{flex:1 1 220px}

/* Tageskopf */
.hero{padding:20px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--day) 22%,transparent),transparent);pointer-events:none}
.hero .disp{font-size:clamp(34px,10vw,52px);margin-top:6px}
.hero .disp span{color:var(--day)}
.fort{display:grid;gap:6px;margin:16px 0}
.fort-bar{display:flex;gap:3px}
.fort-bar i{flex:1;height:8px;border-radius:3px;background:var(--raise);transition:background .2s}
.fort-bar i.d{background:var(--day)}
.fort-leg{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--mut)}
.kzz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.kzz>div{padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);min-width:0}
.kzz span{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.kzz .zahl{display:block;font-size:24px;margin-top:4px}

/* Tagesinfo */
details.info>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.info>summary::-webkit-details-marker{display:none}
details.info>summary::after{content:"";margin-left:auto;flex:none;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s var(--ease)}
details.info[open]>summary::after{transform:rotate(-135deg)}
.lead{font-size:14.5px;color:var(--ink);max-width:68ch;margin-top:12px}
.hinw{display:grid;gap:10px;margin-top:14px;counter-reset:h}
.hinw li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:13.5px;color:var(--ink2);max-width:72ch}
.hinw li::before{counter-increment:h;content:counter(h);width:24px;height:24px;border-radius:50%;background:var(--day-soft);color:var(--day);font-weight:800;font-size:12px;display:grid;place-items:center}
.sec{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--mut);margin:18px 0 6px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.prows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pk{width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--c)}
.pn{min-width:0;display:flex;flex-direction:column;gap:2px}
.pn b{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.pn small{font-size:12.5px;color:var(--ink2)}
.pl{text-align:right;font-family:var(--d);font-stretch:90%;font-size:16px;font-weight:800;white-space:nowrap;line-height:1.2}
.pl small{display:block;font-family:var(--f);font-size:12px;font-weight:500;color:var(--mut)}
.pl.ok{color:var(--ok)}

/* Übungsblock */
.blk{display:grid;gap:12px}
.blk.opt{border-style:dashed}
.bh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.plate{width:30px;height:30px;border-radius:50%;background:var(--c);position:relative;flex:none;margin-top:2px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.25)}
.plate::after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--card)}
.bh h3{font-family:var(--d);font-stretch:78%;font-weight:900;font-size:22px;line-height:1.05}
.rx{font-size:13.5px;color:var(--ink2);margin-top:4px}
.bh .chips{margin-top:8px}
.ziel{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.ziel b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.auto{display:grid;gap:3px;flex:1 1 100%;min-width:0}
.auto small{font-size:12px;font-weight:800;color:var(--day)}
.auto b{font-size:17px}
.auto em{font-style:normal;font-size:12.5px;color:var(--ink2)}
.sets{display:grid;gap:6px}
.srow{display:grid;grid-template-columns:30px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) 46px;gap:6px;align-items:center}
.srow.hd{font-size:12px;font-weight:700;color:var(--mut)}
.srow.hd span{text-align:center}
.srow .ix{font-family:var(--mono);font-size:13px;color:var(--mut);text-align:center}
.srow input{width:100%;min-width:0;min-height:44px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:0 6px;font-family:var(--mono);font-size:16px;text-align:center;color:var(--ink)}
.srow input:focus{outline:0;border-color:var(--day);box-shadow:0 0 0 3px var(--day-soft)}
.srow input::placeholder{color:#5d6270}
.ck{width:46px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--bg2);display:grid;place-items:center;color:var(--mut)}
.ck svg{width:20px;height:20px}
.srow.ok .ck{background:var(--ok);border-color:var(--ok);color:#0b0c10}
.srow.ok input{border-color:rgba(67,192,138,.45)}
.bfoot{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.tip summary{font-size:12.5px;color:var(--ink2);cursor:pointer;list-style:none;font-weight:600}
.tip summary::-webkit-details-marker{display:none}
.tip summary::before{content:"+ "} .tip[open] summary::before{content:"– "}
.tip p{font-size:13px;color:var(--ink2);margin-top:6px;max-width:68ch}
details.wu{border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:10px 12px}
details.wu>summary{cursor:pointer;list-style:none;font-size:13px;font-weight:700;color:var(--ink2)}
details.wu>summary::-webkit-details-marker{display:none}
.wul{display:grid;gap:6px;margin-top:10px}
.wur{display:grid;grid-template-columns:minmax(0,1fr) auto 26px;align-items:center;gap:10px;min-height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--card);text-align:left;color:var(--ink)}
.wur .num{font-weight:700;font-size:14px}
.wur small{font-size:12px;color:var(--mut);white-space:nowrap}
.wur svg{width:20px;height:20px;color:var(--line2)}
.wur.ok{border-color:rgba(67,192,138,.45);background:var(--ok-soft)}.wur.ok svg{color:var(--ok)}.wur.ok .num{color:var(--ok)}
.ana{margin-top:14px;display:grid;gap:8px;font-size:14px;color:var(--ink2);max-width:72ch}
.ana h3{color:var(--ink);margin-top:10px}
.ana ul{display:grid;gap:5px;padding-left:18px;list-style:disc}
.ana b{color:var(--ink)}
.wgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.wring{position:relative;width:112px;height:112px}
.wring svg{width:100%;height:100%;transform:rotate(-90deg)}
.wring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.wring .zahl{font-size:34px;color:var(--wz)}
.wring small{font-size:11.5px;color:var(--mut);font-weight:700}
.wvals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wvals>div{padding:8px 10px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);min-width:0}
.wvals span{display:block;font-size:11.5px;font-weight:700;color:var(--mut)}
.wvals .zahl{font-size:20px;display:block;margin-top:2px}
.whint{font-size:13.5px;color:var(--ink);padding:10px 12px;border-radius:12px;background:var(--bg2);border-left:3px solid var(--wz,var(--day));margin-top:12px}
label.btn{cursor:pointer}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.wthumbs{display:flex;gap:8px;margin:0 0 12px;overflow-x:auto}
.wthumbs img{height:110px;width:auto;border-radius:10px;border:1px solid var(--line2);flex:none}
@media (max-width:380px){.wgrid{grid-template-columns:minmax(0,1fr);justify-items:center}.wvals{width:100%}}
textarea.note{width:100%;min-height:80px;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;padding:12px;resize:vertical;color:var(--ink)}

/* ---------- Timer: Leiste ---------- */
.tbar{position:fixed;left:0;right:0;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px));z-index:35;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.gymopen .tbar{bottom:env(safe-area-inset-bottom,0px);z-index:60}
.tbar-in{max-width:620px;margin:0 auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;padding:10px 10px 12px 14px;border-radius:16px;background:#1d2029;border:1px solid var(--line2);box-shadow:0 16px 40px -12px rgba(0,0,0,.9)}
.tbar-in .lin{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);transition:width .25s linear}
.tbar.over .tbar-in{border-color:var(--brand)} .tbar.over .lin{background:var(--brand)}
.tbar-open{flex:1;min-width:0;border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:0}
.tbar-t{font-family:var(--d);font-stretch:72%;font-weight:900;font-size:30px;line-height:1;min-width:66px;font-variant-numeric:tabular-nums}
.tbar.over .tbar-t{color:var(--hi)}
.tbar-l{display:flex;flex-direction:column;min-width:0}
.tbar-l small{font-size:11.5px;color:var(--mut);font-weight:700}
.tbar-l span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtn{flex:none;min-width:44px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);font-weight:800;font-size:13px}

/* ---------- Timer: Sheet ---------- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,5,8,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet-in{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:#121419;border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px}
@media (prefers-reduced-motion:no-preference){.sheet-in{animation:hoch .28s var(--ease)}@keyframes hoch{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto}
.sh-k{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bigring{position:relative;width:min(72vw,270px);aspect-ratio:1;margin:0 auto;max-width:100%}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.bigring .tt{font-family:var(--d);font-stretch:68%;font-weight:900;font-size:clamp(64px,19vw,84px);line-height:.9;font-variant-numeric:tabular-nums}
.bigring .of{font-size:13px;color:var(--mut);font-weight:600}
.bigring .state{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.bigring .state.p{background:var(--warn-soft);color:var(--warn)} .bigring .state.o{background:var(--brand-soft);color:var(--hi)}
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;justify-items:center}
.ctrl .rbtn{width:100%;max-width:120px;height:52px;font-size:16px}
.play{width:72px;height:72px;border-radius:50%;border:0;background:var(--ink);color:#0b0c10;display:grid;place-items:center}
.play svg{width:28px;height:28px;fill:currentColor}
.presets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.presets button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink2)}
.presets button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#0b0c10}
.merk{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--ink2)}
.merk input{width:18px;height:18px;accent-color:var(--day)}
.next{border-radius:16px;background:var(--card);border:1px solid var(--line);padding:14px;display:grid;gap:6px}
.next b.n{font-family:var(--d);font-stretch:78%;font-weight:900;font-size:22px;line-height:1.05}
.next .w{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.next .w .zahl{font-size:32px}
.next .psum{font-size:12.5px;color:var(--mut)}
.skip{height:56px;border-radius:14px;border:0;background:var(--action);color:#fff;font-family:var(--d);font-stretch:85%;font-weight:900;font-size:19px;width:100%}
.toggles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tog{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:12.5px;font-weight:700;color:var(--mut)}
.tog[aria-pressed="true"]{color:var(--ink);border-color:var(--ink2)}

/* ---------- Gym-Modus ---------- */
.gym{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 90px)}
.gym-in{max-width:620px;margin:0 auto;display:grid;gap:14px;padding:12px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gtop .lbl{font-size:13px;font-weight:700;text-align:center}
.gtop .el{font-family:var(--mono);font-size:14px;color:var(--ink2);min-width:56px;text-align:right}
.strip{display:flex;gap:3px}
.strip span{flex:1;height:5px;border-radius:3px;background:var(--raise)}
.strip span.d{background:var(--ok)} .strip span.c{background:var(--day)}
.gex h2{font-size:clamp(40px,12vw,60px);margin-top:4px}
.gex .rx{font-size:15px}
.gziel{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.gziel .zahl{font-size:44px}
.platevis{display:flex;align-items:center;gap:2px;height:64px}
.platevis .bar{width:26px;height:8px;background:#6b7080;border-radius:2px}
.platevis .sl{width:10px;height:14px;background:#6b7080;border-radius:2px}
.platevis i{display:block;border-radius:3px;width:12px}
.gsets{display:flex;gap:8px;flex-wrap:wrap}
.gsets button{min-width:48px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-family:var(--mono);font-weight:700}
.gsets button.ok{background:var(--ok);border-color:var(--ok);color:#0b0c10}
.gsets button.cur{outline:2px solid var(--day);outline-offset:2px}
.stp{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:8px;padding:8px}
.stp>button{height:58px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);font-size:28px;font-weight:600}
.stp .mid{display:grid;justify-items:center}
.stp .mid small{font-size:12px;font-weight:700;color:var(--mut)}
.stp input{width:100%;background:transparent;border:0;text-align:center;font-family:var(--d);font-stretch:72%;font-size:48px;font-weight:900;line-height:1;padding:0;color:var(--ink)}
.stp input:focus{outline:0}
.rpechips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.rpechips button.soll{box-shadow:0 0 0 2px var(--day) inset}
.rpedesc{text-align:center;font-size:13px;color:var(--ink2);margin-top:10px;min-height:18px}
.rpedesc b{color:var(--ink)}
/* Hype */
.hype{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 9px;border-radius:999px;font-weight:800;font-size:12.5px;white-space:nowrap;line-height:1}
.hype .bars{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.hype .bars i{width:4px;border-radius:1px;background:currentColor;opacity:.28}
.hype .bars i:nth-child(1){height:6px}.hype .bars i:nth-child(2){height:10px}.hype .bars i:nth-child(3){height:14px}
.hype.l .bars i:nth-child(1),.hype.m .bars i:nth-child(-n+2),.hype.h .bars i{opacity:1}
.hype.h{background:var(--brand);color:#fff;box-shadow:0 0 0 3px var(--brand-soft),0 0 18px -4px var(--brand)}
.hype.m{background:var(--warn-soft);color:var(--warn);box-shadow:0 0 0 1px rgba(227,145,80,.35) inset}
.hype.l{background:rgba(87,199,212,.12);color:var(--cyan);box-shadow:0 0 0 1px rgba(87,199,212,.3) inset}
.bh-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.blk.hy-h{border-color:rgba(237,36,56,.45)}
.hyban{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:16px}
.hyban .hype{font-size:15px;padding:8px 14px 8px 11px}
.hyban .hype .bars{height:18px}.hyban .hype .bars i{width:5px}
.hyban .hype .bars i:nth-child(1){height:8px}.hyban .hype .bars i:nth-child(2){height:13px}.hyban .hype .bars i:nth-child(3){height:18px}
.hyban p{font-size:13.5px;color:var(--ink2)}
.hyban.h{background:linear-gradient(90deg,rgba(237,36,56,.22),rgba(237,36,56,.05));border:1px solid rgba(237,36,56,.5)}
.hyban.m{background:var(--warn-soft);border:1px solid rgba(227,145,80,.3)}
.hyban.l{background:rgba(87,199,212,.08);border:1px solid rgba(87,199,212,.25)}
@media (prefers-reduced-motion:no-preference){.hyban.h .hype{animation:glow 1.6s ease-in-out 3}@keyframes glow{50%{box-shadow:0 0 0 5px var(--brand-soft),0 0 26px -2px var(--brand)}}}
/* Gym-Timer */
.gtimer{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.gtimer.on{border-color:rgba(67,192,138,.45)}
.gtimer.over{border-color:var(--brand)}
.gring{position:relative;width:132px;height:132px}
.gring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gring .tt{font-family:var(--d);font-stretch:68%;font-weight:900;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.gring small{font-size:11.5px;color:var(--mut);font-weight:700}
.gt-c{display:grid;gap:8px;min-width:0}
.gt-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gt-row .rbtn{width:100%;height:44px}
.gt-row .rbtn.go{background:var(--ink);color:#0b0c10;border-color:var(--ink)}
.gt-pre{display:flex;flex-wrap:wrap;gap:5px}
.gt-pre button{min-height:32px;padding:0 9px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--ink2)}
.gt-pre button[aria-pressed="true"]{background:var(--ink);color:#0b0c10;border-color:var(--ink)}
@media (max-width:400px){.gtimer{grid-template-columns:minmax(0,1fr);justify-items:center}.gt-c{width:100%}}
select.rpe{width:100%;min-width:0;min-height:44px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:0 4px;font-family:var(--mono);font-size:16px;text-align:center;text-align-last:center;color:var(--ink);appearance:none;-webkit-appearance:none}
select.rpe:focus{outline:0;border-color:var(--day);box-shadow:0 0 0 3px var(--day-soft)}
select.rpe.empty{color:#5d6270}
.srow.ok select.rpe{border-color:rgba(67,192,138,.45)}
.rpechips button{min-width:44px;min-height:38px;border:1px solid var(--line2);background:var(--bg2);border-radius:10px;font-family:var(--mono);font-size:13px;font-weight:700}
.rpechips button[aria-pressed="true"]{background:var(--day);color:#0b0c10;border-color:var(--day)}
.bigbtn{height:66px;border-radius:16px;border:0;background:var(--action);color:#fff;font-family:var(--d);font-stretch:85%;font-size:24px;font-weight:900;width:100%}
.bigbtn.okb{background:var(--ok);color:#0b0c10}
.gnav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lastline{font-size:13px;color:var(--ink2)}

/* ---------- Progress ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.kpis>div{padding:14px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);min-width:0}
.kpis span{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.kpis .zahl{display:block;font-size:32px;margin-top:6px}
.kr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.kr>div{padding:4px 10px;border-left:1px solid var(--line);min-width:0}
.kr>div:first-child{border-left:0;padding-left:0}
.kr>div::before{content:"";display:block;width:24px;height:3px;border-radius:2px;background:var(--c);margin-bottom:8px}
.kr .zahl{display:block;font-size:clamp(28px,9vw,44px);margin-top:6px;white-space:nowrap}
.kr .s{font-size:12px;color:var(--mut);margin-top:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-family:var(--mono);font-size:12.5px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.tw{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:13.5px}
.tab th{font-size:12px;font-weight:700;color:var(--mut);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line2);white-space:nowrap}
.tab td:first-child{white-space:nowrap}
.tab td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.tab .r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;margin-right:8px;vertical-align:0}
.leer{padding:22px 14px;text-align:center;color:var(--mut);font-size:14px;border:1px dashed var(--line2);border-radius:var(--r-m)}
.note2{font-size:12.5px;color:var(--mut);margin-top:10px;max-width:72ch}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}

/* ---------- Setup ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2);min-width:0}
.in{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2)}
.in:focus-within{border-color:var(--day);box-shadow:0 0 0 3px var(--day-soft)}
.in input{flex:1;min-width:0;width:100%;min-height:44px;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);color-scheme:dark}
.in i{flex:none;font-style:normal;font-size:12.5px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 92px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:#0b0c10;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:700;white-space:nowrap}

/* ===================== Premium-Ebene ===================== */
.top{background:rgba(9,10,14,.72);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 -1px 0 rgba(255,255,255,.03)}
.gear{width:38px;height:38px}
.tl{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:2px max(16px,env(safe-area-inset-left,0px)) 4px}
.tl::-webkit-scrollbar{display:none}
.tlw{flex:none;display:grid;gap:5px;scroll-snap-align:start}
.tlh{font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.02em;white-space:nowrap}
.tlr{display:flex;gap:6px}
.tlc{position:relative;width:52px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--ink);transition:transform .2s var(--ease),background .2s,border-color .2s}
.tlc small{font-size:11px;font-weight:700;color:var(--mut)}
.tlc b{font-family:var(--d);font-stretch:80%;font-weight:900;font-size:19px;line-height:1.05}
.tlc i{position:absolute;bottom:6px;width:16px;height:3px;border-radius:2px;background:var(--c);opacity:.45}
.tlc.done{background:linear-gradient(180deg,rgba(67,192,138,.16),var(--card))}.tlc.done i{background:var(--ok);opacity:1;width:6px;height:6px;border-radius:50%}
.tlc.part i{background:var(--warn);opacity:1}
.tlc.today{border-color:var(--ink2)}.tlc.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--hi);box-shadow:0 0 8px var(--hi)}
.tlc.sel{background:var(--c);border-color:var(--c);transform:translateY(-2px);box-shadow:0 10px 24px -12px var(--c)}
.tlc.sel small,.tlc.sel b{color:#0b0c10}.tlc.sel i{background:#0b0c10;opacity:.5}
.nav{background:rgba(12,13,18,.78);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);grid-template-columns:repeat(5,1fr)}
.nav .fab{color:var(--ink)}
.nav .fab span{width:56px;height:56px;margin-top:-26px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#ff6b6f,var(--action) 60%,#8f0f1c);box-shadow:0 10px 26px -8px rgba(237,36,56,.75),0 0 0 4px var(--bg);color:#fff}
.nav .fab span svg{stroke:#fff;width:24px;height:24px}
.nav .fab[aria-current="page"]::before{display:none}
.nav .fab[aria-current="page"]{background:none}
@media (min-width:960px){.nav .fab span{width:auto;height:auto;margin:0;background:none;box-shadow:none;color:inherit}.nav .fab span svg{stroke:var(--hi)}}
.iconbtn svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Heute */
.home{padding-bottom:22px}
.home-k{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.home-t{font-size:clamp(40px,12vw,62px)!important;margin-top:8px}
.home-t span,.hero .disp span{color:var(--c,var(--day))}
.bb3d{position:relative;height:clamp(150px,46vw,240px);margin:6px -18px 0}
.bb3d .bbc{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.bb3d .bbc:active{cursor:grabbing}
.bb3d .bbsvg{width:100%;height:100%;display:block}
.bb3d.sm{flex:1 1 100%;height:clamp(170px,52vw,250px);margin:4px -18px -6px}.bb3d.sm .bbc{cursor:default;touch-action:auto}
.bbline{font-size:12.5px;color:var(--ink2);text-align:center;margin-top:-4px}
.bbcap{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:4px}
.bbcap b{font-size:15px}.bbcap small{display:block;font-size:12px;margin-top:2px}
.bbcap .r{text-align:right;max-width:52vw}.bbcap .r small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bbcap .r .zahl{font-size:42px;display:block}
.hstats{display:grid;grid-template-columns:1.5fr repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.hs{min-width:0;padding:10px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px;color:var(--ink);text-align:left}
.hs small{font-size:11.5px;font-weight:700;color:var(--mut)}.hs .zahl{font-size:24px}
.hsw{flex-direction:row;align-items:center;gap:10px}
.hring{position:relative;flex:none;width:46px;height:46px}.hring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--d);font-stretch:72%;font-weight:900;font-size:17px;color:var(--wz)}
.hsw b{font-size:13px}
.hsw>span:last-child{display:flex;flex-direction:column;min-width:0}
@media (max-width:400px){.hstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cta{position:relative;overflow:hidden;width:100%;height:64px;border:0;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;font-family:var(--d);font-stretch:85%;font-weight:900;font-size:22px;letter-spacing:.01em;
 background:linear-gradient(135deg,#ff4d55,var(--action) 55%,#a3101f);box-shadow:0 18px 36px -16px rgba(237,36,56,.9),inset 0 1px 0 rgba(255,255,255,.25)}
.cta svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-100%)}
@media (prefers-reduced-motion:no-preference){.cta::after{animation:shine 3.2s ease-in-out 2}@keyframes shine{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}}
.lnk{border:0;background:none;padding:6px 0;min-height:32px;font:inherit;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px}
.lnk.center{display:block;margin:10px auto 0}
.cyc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.cring,.lab-ring{position:relative;flex:none;display:grid;place-items:center}

/* ================= Feinschliff ================= */
:root{--hair:rgba(255,255,255,.075);--hair2:rgba(255,255,255,.12);--goldline:rgba(226,176,74,.34);--ease2:cubic-bezier(.2,.8,.2,1)}

body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

.zahl,.num,.mono,[data-count],.tt,.gtm-t b,.stp input{font-variant-numeric:tabular-nums}
/* Karten: ruhiger, edler */
.card{border-radius:20px!important;border:1px solid var(--hair)!important;background:linear-gradient(180deg,#14130f 0%,#0c0b09 55%,#0a0908 100%)!important;box-shadow:inset 0 1px 0 rgba(255,236,200,.05),0 1px 0 rgba(0,0,0,.6),0 22px 44px -30px rgba(0,0,0,.95)!important}
.card:not(.hero)::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,220,150,.035),transparent 38%)}
.lt-only>.card::after,.gym .gdock .card::after{display:none}
.hero.card,.card.hero,.techbtn,.rcard,.card.rep{border-color:var(--goldline)!important}
/* Überschriften */
.eyebrow{text-transform:uppercase;font-size:10.5px!important;letter-spacing:.12em!important;font-weight:800!important;color:#a39a88}
.h2{letter-spacing:-.005em}
.sect{display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.sect::before{content:"";width:4px;height:20px;border-radius:3px;background:linear-gradient(180deg,#ff5a68,#c4121f);box-shadow:0 0 12px rgba(237,36,56,.5)}
/* Interaktion */
button,.btn,.cta,.prow,.tlc,.iconbtn{transition:transform .14s var(--ease2),background-color .2s,border-color .2s,box-shadow .2s,opacity .2s}
button:active:not(:disabled),.btn:active,.cta:active{transform:scale(.975)}
:focus-visible{outline:2px solid #e2b04a!important;outline-offset:2px}
button:disabled{opacity:.42}
/* Bottom-Navigation */
.nav{background:linear-gradient(180deg,rgba(12,11,9,.72),rgba(6,6,6,.94))!important;-webkit-backdrop-filter:blur(20px) saturate(160%)!important;backdrop-filter:blur(20px) saturate(160%)!important;border-top:0!important;box-shadow:0 -1px 0 rgba(255,255,255,.06),0 -20px 40px -20px rgba(0,0,0,.9)}
.nav::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(226,176,74,.45),transparent)}
.nav button{letter-spacing:.01em}
.nav button:not([aria-current="page"]){color:#8d8a84}

.prow{border-radius:14px}

<script>
const $=s=>document.querySelector(s);
/*__DATA__*/
const HYPETXT={h:'Voll aufdrehen: Musik, Fokus, maximale Spannung – dieser Satz zählt.',m:'Konzentriert und fokussiert, aber kontrolliert – Energie dosieren.',l:'Ruhig bleiben, Technik im Fokus, Energie für die wichtigen Sätze sparen.'};
const HYIC={h:'<path d="M12 2.5c.6 3.2 4.8 5.6 4.8 10.4A4.8 4.8 0 0 1 12 17.7a4.8 4.8 0 0 1-4.8-4.8c0-2 1-3.4 2-4.4.2 1.5 1 2.6 2.1 2.6 0-3.1-.6-5.6.7-8.6z"/><path d="M12 21.5c-1.9 0-3.3-1.3-3.3-3 0-1.4.9-2.3 1.7-3 .2.9.8 1.5 1.5 1.5.1-1.2.1-2.2.6-3.3 1.4 1.4 2.8 2.7 2.8 4.8 0 1.7-1.4 3-3.3 3z" opacity=".55"/>',m:'<path d="M13.5 2 5 13.2h5.6L9.4 22 19 10.3h-5.8z"/>',l:'<path d="M3 9.5c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 5 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 15c2.2-2 4.3-2 6.5 0s4.3 2 6.5 0 4.3-2 5 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".55"/>'};
const HYLV={h:'Hoch',m:'Moderat',l:'Niedrig'};
const hypeB=h=>h?`<span class="hype ${h}" role="img" aria-label="${HYPE[h]}"><span class="hic"><svg viewBox="0 0 24 24" aria-hidden="true">${HYIC[h]}</svg></span><span class="htx"><small>Hype</small><b>${HYLV[h]}</b></span><span class="hmt" aria-hidden="true"><i></i><i></i><i></i></span></span>`:'';
const RPES=[5,5.5,6,6.5,7,7.5,8,8.5,9,9.5,10];
const RPED={10:'Maximal – keine Wdh mehr möglich',9.5:'Keine Wdh mehr, evtl. etwas mehr Gewicht',9:'1 Wdh im Tank',8.5:'1–2 Wdh im Tank',8:'2 Wdh im Tank',7.5:'2–3 Wdh im Tank',7:'3 Wdh im Tank – schnell und sauber',6.5:'3–4 Wdh im Tank',6:'4 Wdh im Tank',5.5:'4–5 Wdh im Tank',5:'5+ Wdh im Tank – sehr leicht'};
/* ===================== Tagesinfos (aus den Programm-Beschreibungen) ===================== */
let ORIG=['Day 1 – Monday','Day 2 – Tuesday','Day 3 – Thursday','Day 4 – Saturday'];
const DAYCOL=['var(--sq)','var(--bp)','var(--dl)','var(--cyan)','#b48cff','#f0a066','#7fa8ff'];
const DAYSOFT=['rgba(240,98,93,.14)','rgba(227,179,76,.14)','rgba(110,159,214,.15)','rgba(87,199,212,.14)'];
let INFO={
'0-0':['Bewerte bei geraden Sätzen das RPE des letzten Satzes und trag es ein – das wird später wichtig.','Start mit aktuellen Daten: Variations-Maxima, die bewusst submaximal, aber sehr aussagekräftig sind – Paused Squat, Paused Deadlift und an Tag 2 der 3 s Pause Bench. Diese Singles sind die Referenz für alle %-Vorgaben des Zyklus.','Platz Squat kann durch Belt Squat, Leg Press oder Pendulum Squat ersetzt werden. Der Platz Squat bringt meist einen starken Start, weil die Langhantel-Variante viel Übertrag hat. Wer schon eng und tief (ATG) als Comp-Squat beugt, differenziert besser mit dem Belt Squat.','Wenn du den Belt Squat nimmst: nur, wenn du ihn den ganzen Monat zur Verfügung hast.'],
'0-1':['Mach entweder Feet-Up Bench ODER Close-Grip Bench – nicht beides.','Weitgriff = Mittelfinger auf den Ringen oder weiter außen. Moderater Griff = Ringfinger oder enger.','Kabel-Brustdrücken nur mit stabilem Setup – sonst Maschine oder Kabel-Fly. Progressive Überlastung ist immer Faktor Nr. 1.','Cable Chest Press-Around: nach vorn und leicht quer drücken, unten tief dehnen – freie Hand immer stabil festhalten.'],
'0-2':['Wer High Bar schon als Comp-Squat beugt, nimmt heute den High Bar Constant Tension Squat – das Satz-/Wdh-Schema bleibt gleich.','Sumo-Heber: Snatch Grip Deadlift im weiten Stand. Konventionelle Heber: konventioneller Stand. Nicht beides.','Das Workout ist bewusst kurz. Trotz niedriger RPEs viel Pause zwischen den Sätzen (8–10+ Minuten), damit jeder Satz sauber sitzt.','Ein RPE-6-3×7 mit 8–10 Minuten Pause ist etwas völlig anderes als ein halbherziges mit 2–5 Minuten – das macht einen großen Unterschied in der Last.'],
'0-3':['Zweiter 12er-Satz Feet-Up: gleiche Last, wenn der erste 12er bei RPE 7 oder leichter lief – mental darauf zielen.','Lief der erste 12er bei RPE 7,5 oder härter: im zweiten Satz 5 kg weniger.'],
'1-0':['Jetzt geht es in den 80–85 %-Bereich – das Brot-und-Butter-Training. Hier wird der Großteil der Kraft aufgebaut.','Das 3×3 Kreuzheben ist Technikpraxis unter moderater Last. Es macht das Workout etwa wiederholungsgleich zum 2×8 der Vorwoche – bei höherer Durchschnittsintensität, ohne das RPE zu hoch zu treiben.','Der 1×8 ist der eigentliche Kreuzheben-Fokus; das 3×3 soll eher Schwung geben (Greasing the Groove).'],
'1-1':['Trizeps: „Ein Inkrement mehr als letzte Woche“ heißt die kleinste mögliche Laststufe an deinem Gerät.','Meist bleibst du damit unter RPE 8. Wird es doch härter, Gewicht zurücknehmen, um bei RPE 8 oder darunter zu bleiben – vermutlich auf die Vorwochenlast.','Cable Chest Press-Around (optional): erst 1×14 mit der Last aus dem 3×13, dann ein AMRAP bis RPE 9 – Ziel 17+ Wdh. Das Ergebnis entscheidet nächste Woche über 3×9 oder 3×13.'],
'1-2':['Lange Pausen zwischen den Sätzen beim 3×9 High Bar Squat.','Das ist die härteste Einheit dieser Variante im 4-Wochen-Zyklus.','Nächste Woche wird die Last deutlich gesteigert, die Gesamt-Wiederholungen sinken aber.'],
'1-3':['Top-Satz Bankdrücken: 87,5 % oder 90 % des 3 s Pause Singles – nimm, was näher an RPE 7 liegt.','Back-off-Sätze mit 5 % weniger als der Top-Satz (also 82,5 % bzw. 85 %).','Incline Curls: +2,5 kg pro Kurzhantel gegenüber der Vorwoche.'],
'2-0':['Letzter harter Tag der Intro-Phase. Ab der nächsten Einheit sinkt das Volumen, die Intensität pro Satz bleibt hoch.','Das ist die letzte Einheit mit moderatem Volumen UND relativ hoher Intensität – stark beenden!','Künftige Programme haben etwas mehr Kreuzheben-Volumen. In diesem Intro geht es um hohen Hype pro Satz und maximales Momentum; später kommen mehr 3×5-Tage zum langsameren Aufbau.'],
'2-1':['Cable Chest Press-Around: Unter 18 Wdh beim AMRAP der Vorwoche → 3×9. Bei 18 oder mehr → 3×13.','In jedem Fall das schwerste Gewicht des Zyklus auf diesem Slot.','Lief das AMRAP sehr gut, kannst du Last erhöhen UND die 13er schneller bewegen als in Woche 1 – trotz gleichem Schema mit mehr Last.'],
'2-2':['Der 3 s Eccentric Bench Triple wird ein Variations-PR für die Zukunft. Über das Jahr bauen wir darauf konservative 3RM- und 2RM-Progressionen auf.','Variations-PRs sorgen dafür, dass du auf allen Slots pushst – den Triple deshalb streng ausführen, als unbestreitbare Basis für die nächsten Monate.','Damit enden alle Progressionen der Nicht-Wettkampf-Lifts in diesem Zyklus.','Leichter Volumen-Taper, aber kein Intensitäts-Taper – es ist kein Wettkampf-Peak.'],
'2-3':['Bankdrücken wechselt von 5×5 auf 6×3: Die Gesamt-Wdh sinken von 25 auf 18, aber 6 Sätze halten den Trainingseffekt problemlos.','Beim Bankdrücken das Volumen nie zu drastisch senken.','Typischerweise peakt Kreuzheben zuerst, dann Kniebeuge und Bankdrücken zuletzt.'],
'3-0':['Mehr ist heute nicht nötig – ein lockerer Taper-Tag für den Unterkörper, bevor am Dienstag (Tag 3) die großen AMRAPs kommen.','Optional danach: Bauch oder leichtes Cardio. NICHTS, was die Hauptmuskeln von Kniebeuge und Kreuzheben trifft – kein intensives Sprinten oder Radfahren (lockeres Radeln ist okay), kein Unterkörper-Bodybuilding.','Im 8-Wochen-Programm gibt es Zeit für eine längere Phase. Diese Phase heißt: sofort hart rangehen und dann schnell in eine frische Testwoche abkühlen.'],
'3-1':['Optional zum Auffüllen: Bizeps, hintere Schulter oder Unterarme.','Nichts, was mit den Hauptmuskeln des Bankdrückens überlappt – keine Brust, kein Trizeps, keine vordere Schulter.','Lockerer Tag, um Körper und Kopf auf den großen Testsatz vorzubereiten. Alle Pflicht-Zubehörübungen entfallen.'],
'3-2':['Wähle zwischen 90, 95 und 100 % die schwerste Last, mit der du sicher mindestens 5 Wdh schaffst. 90 % ist ein gutes Minimum, 95 % ein sehr gutes Ziel, 100 % nur, wenn sich der Zyklus richtig gut anfühlt.','Kniebeuge mit RPE-9-Deckel, damit du vor dem Kreuzheben nicht zu erschöpft bist – nicht 100 % frisch, aber frisch genug.','Bank und Kreuzheben dürfen bis echtes RPE 10 gehen, notfalls bis zum Fehlversuch – aber nicht gezielt bis zum Fehlversuch, sondern bis keine weitere Wiederholung mehr ginge.','High Hype bei allen Sätzen!'],
'3-3':['Pivot-Workout: Die Übungen dienen als Deload mit moderatem Volumen und bringen Abwechslung. Diese Progressionen werden in der nächsten Phase nicht fortgesetzt.','Vorteil: etwas höhere RPEs als bei einem klassischen Deload, ohne bei der absoluten Last eine ähnlich große Pause zu machen.']
};

/* ===================== Zustand & Speicher ===================== */
const LS='intro-zyklus-v1', LST='intro-zyklus-timer';
const S={logs:{},meta:{start:'2026-10-17',restMain:300,restAcc:120,bar:20,round:2.5,sound:true,vibe:true,autoSheet:true,restEx:{}},ui:{w:0,d:0,tab:'home'},out:{},ana:{}};
try{const c=JSON.parse(localStorage.getItem(LS)||'null');if(c){Object.assign(S.logs,c.logs||{});Object.keys(S.logs).forEach(k=>remember(k,S.logs[k]));Object.assign(S.meta,c.meta||{});if(c.ui){S.ui.w=c.ui.w||0;S.ui.d=c.ui.d||0}}}catch(e){}

function canon(x){if(Array.isArray(x))return '['+x.map(canon).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).filter(k=>x[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(x[k])).join(',')+'}';return JSON.stringify(x)}

function mergeLog(l,r){const base=(r.u||0)>=(l.u||0)?r:l,oth=base===r?l:r;const out=JSON.parse(JSON.stringify(base));

  for(let i=0;i<n;i++){const a=A[i]||{},c=C[i]||{};const ma=a.m||0,mc=c.m||0;let v;

const nf=(n,d=1)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('de-DE',{maximumFractionDigits:d,useGrouping:false});

const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const restFor=ex=>S.meta.restEx[ex]??(ex==='hbs'?480:EX[ex].m?S.meta.restMain:S.meta.restAcc);
function nextOpen(w,d,b,i){const L=log(w,d);const bls=P[w][d].b;
 for(let B=b;B<bls.length;B++)for(let I=(B===b?i+1:0);I<bls[B].s;I++){if(!(L&&L.b[B][I].ok))return{b:B,i:I}}
 for(let B=0;B<bls.length;B++)for(let I=0;I<bls[B].s;I++){if(!(L&&L.b[B][I].ok))return{b:B,i:I}}return null}

/* ===================== Automatische Satz-Berechnung ===================== */
const PICK={'1-3-0':{r:5,rpe:7,m:'closest'},'2-3-0':{r:3,rpe:7.5,m:'closest'},'3-2-0':{r:5,rpe:9,m:'max'},'3-2-1':{r:5,rpe:10,m:'max'},'3-2-2':{r:5,rpe:10,m:'max'}};
const kgFor=(e1,r,rpe)=>e1/e1rm(1,r,rpe);
function kindOf(bl){if(bl.s===1||/in jedem Satz/.test(bl.x))return 'each';if(/ersten Satz/.test(bl.x))return 'first';if(/im Schnitt/.test(bl.x))return 'avg';if(/(letzten|\d\.) Satz/.test(bl.x))return 'last';return 'same'}
function repsFor(w,d,b){const bl=P[w][d].b[b];
 if(/^\d+$/.test(bl.r))return {r:+bl.r,disp:bl.r};
 if(/^\d+-\d+$/.test(bl.r)){const [a,c]=bl.r.split('-').map(Number);return {r:Math.round((a+c)/2),disp:a+'–'+c}}
 if(bl.r==='9/13'){const r=pnum(setOf(1,1,5,0).r);if(r==null)return {r:9,disp:'9',why:'W2-AMRAP fehlt → 3×9 angesetzt'};return r<18?{r:9,disp:'9',why:`W2-AMRAP ${r} Wdh (unter 18) → 3×9`}:{r:13,disp:'13',why:`W2-AMRAP ${r} Wdh (18+) → 3×13`}}
 if(bl.r==='AMRAP')return {r:null,disp:'max',amrap:true,calc:bl.e==='idc'&&w===0?12:null};
 return {r:null,disp:bl.r}}
function e1Of(s,bl){const kg=pnum(s.kg),r=pnum(s.r);if(!kg||!r)return null;return e1rm(kg,r,pnum(s.rpe)??bl.rpe??(r===1?9:10))}
function estE1(ex,w,d,b,i){const L=log(w,d);
 if(L){let best=null;P[w][d].b.forEach((bl,B)=>{if(bl.e!==ex)return;(L.b[B]||[]).forEach((s,I)=>{if(B>b||(B===b&&I>=i))return;const e=e1Of(s,bl);if(e)best={e1:e,src:'heute, Satz davor'}})});if(best)return best}
 for(let x=w*ND()+d-1;x>=0;x--){const W=Math.floor(x/ND()),D=x%ND();const L2=log(W,D);if(!L2)continue;let mx=null;
  P[W][D].b.forEach((bl,B)=>{if(bl.e!==ex)return;(L2.b[B]||[]).forEach(s=>{const e=e1Of(s,bl);if(e&&(!mx||e>mx.e1))mx={e1:e,src:`W${W+1} ${DAYS[D].tag}`}})});
  if(mx)return mx}
 if(PROG!=='intro'&&!estE1.px){estE1.px=1;try{for(const pid of prevOf(PROG)){const r=withProg(pid,()=>estE1(ex,NW(),0,99,0));if(r)return {e1:r.e1,src:PROGS[pid].short+', '+r.src}}}finally{estE1.px=0}}
 const rel=REL[ex];if(rel&&!estE1.busy){estE1.busy=true;try{for(const [rx,f] of rel){const e=estE1(rx,w,d,99,0);if(e){return {e1:e.e1*f,src:`${EX[rx].n}, ${e.src}`}}}}finally{estE1.busy=false}}
 return null}
const REL={cgb:[['pbb',.9]],sgdl:[['cdl',.75],['pdl',.75]],rdle:[['cdl',.65]],rdlt:[['cdl',.65]],mach:[['csq',.85]],fub:[['pbb',.85],['pb3',.85]],ecc:[['pbb',.85],['pb3',.85]],hbs:[['csq',.85],['psq',.85]],sgdl:[['cdl',.7],['pdl',.7]],platz:[['csq',.7],['psq',.7]],pbb:[['pb3',1]],csq:[['psq',1]],cdl:[['pdl',1]],psq:[['csq',.95]],pdl:[['cdl',.95]],pb3:[['pbb',.97]]};
function maxKg(ex,w,d){let m=null;for(let x=w*ND()+d;x>=0;x--){const W=Math.floor(x/ND()),D=x%ND();const L=log(W,D);if(!L)continue;P[W][D].b.forEach((bl,B)=>{if(bl.e!==ex)return;(L.b[B]||[]).forEach(s=>{const k=pnum(s.kg);if(k&&(m==null||k>m))m=k})})}return m}
const SG=new Map();
function sugg(w,d,b,i){const k=`${w}-${d}-${b}-${i}`;if(SG.has(k))return SG.get(k);const v=suggCalc(w,d,b,i);SG.set(k,v);return v}
function suggCalc(w,d,b,i){const bl=P[w][d].b[b],L=log(w,d),k3=(PROG==='intro'?'':PROG+':')+w+'-'+d+'-'+b,R=repsFor(w,d,b),kind=kindOf(bl),inc=S.meta.inc||2.5;
 const out=(kg,why,t='e')=>({kg:kg!=null&&kg>0?rnd(kg):null,t,r:R.r,rdisp:R.disp,rpe:bl.rpe,why:[why,R.why].filter(Boolean).join(' · ')});
 const tIn=(entered,sgf)=>entered!=null?'v':(sgf()||{}).t||'e';
 const prevSet=i>0&&L?L.b[b][i-1]:null;
 const prevKg=i>0?(pnum(prevSet&&prevSet.kg)??sugg(w,d,b,i-1).kg):null;
 const prevT=i>0?tIn(pnum(prevSet&&prevSet.kg),()=>sugg(w,d,b,i-1)):'e';
 // 1) %-Vorgaben
 if(bl.ref){
  if(bl.ref==='TOP'){const bb=b-(bl.back||1);const top=firstKg(w,d,bb)??sugg(w,d,bb,0).kg;if(!top)return out(null,'Erst den Satz davor eintragen');const tt=tIn(firstKg(w,d,bb),()=>sugg(w,d,bb,0));
   if(k3==='0-3-2'){const rp=pnum(setOf(w,d,b-1,0).rpe);return rp!=null&&rp>=7.5?out(top-5,`erster 12er @ ${nf(rp)} → 5 kg weniger`,tt):out(top,rp!=null?`erster 12er @ ${nf(rp)} → gleiche Last`:'gleiche Last wie der erste 12er (bei RPE 7,5+ −5 kg)',tt)}
   if(bl.minus)return out(top-bl.minus,`Top-Satz ${nf(top,2)} kg − ${bl.minus} kg`,tt);
   if(bl.plus)return out(top+bl.plus,`Satz davor ${nf(top,2)} kg + ${nf(bl.plus,2)} kg`,tt);
   const p=bl.pct??100;return out(top*p/100,p===100?`gleiche Last wie ${nf(top,2)} kg`:`${nf(p)} % vom Top-Satz (${nf(top,2)} kg)`,tt)}
  const base=refKg(bl.ref);if(!base&&isSQ(PROG))return out(null,`${REFS[bl.ref]?REFS[bl.ref].n:'1RM'} fehlt – im Side-Quest-Tab eintragen`);if(!base)return out(null,`Referenz fehlt: ${REFS[bl.ref].n} aus W1`);
  if(Array.isArray(bl.pct)){const pk=PICK[k3];const opts=bl.pct.map(p=>({p,kg:rnd(base*p/100)}));let ch=opts[0],why=`${nf(ch.p)} %`;
   const e=pk?estE1(bl.e,w,d,b,i):null;
   if(pk&&e){const ideal=kgFor(e.e1,pk.r,pk.rpe);
    if(pk.m==='closest'){ch=opts.reduce((a,o)=>Math.abs(o.kg-ideal)<Math.abs(a.kg-ideal)?o:a);why=`${nf(ch.p)} % – näher an RPE ${nf(pk.rpe)} (e1RM ${nf(e.e1,0)} aus ${e.src})`}
    else{const ok=opts.filter(o=>o.kg<=ideal);ch=ok.length?ok[ok.length-1]:opts[0];why=`${nf(ch.p)} % – schwerste Option für mind. ${pk.r} Wdh (e1RM ${nf(e.e1,0)} aus ${e.src})`}}
   else if(pk)why=`${nf(ch.p)} % – sichere Option, noch keine Vergleichswerte`;
   return out(ch.kg,why,'v')}
  return out(base*bl.pct/100+(bl.add||0),`${nf(bl.pct)} % von ${nf(base,2)} kg (${REFS[bl.ref].n})${bl.add?' + '+nf(bl.add,2)+' kg':''}`,'v')}
 // 2) Folgesätze im selben Block
 if(i>0){
  if(R.amrap||kind!=='each'||bl.rpe==null||!R.r)return out(prevKg,`gleiche Last wie Satz ${i}`,prevT);
  const kgp=pnum(prevSet&&prevSet.kg),rp=pnum(prevSet&&prevSet.rpe),r=pnum(prevSet&&prevSet.r)??R.r;
  if(kgp&&rp!=null){const e=e1rm(kgp,r,rp);return out(kgFor(e,R.r,bl.rpe),`Satz ${i}: ${nf(kgp,2)} × ${r} @ ${nf(rp)} → angepasst auf RPE ${nf(bl.rpe)}`)}
  return out(prevKg,`gleiche Last wie Satz ${i} – RPE eintragen, dann passt die App an`)}
 // 3) erster Satz: Sonderregeln aus dem Plan
 const lt=lastTime(w,d,b);
 if(k3==='1-1-6')return out(lt?lt.kg+inc:null,lt?`Vorwoche ${nf(lt.kg,2)} kg + ${nf(inc,2)} kg (1 Inkrement)`:'Vorwoche fehlt','v');
 if(k3==='1-3-7')return out(lt?lt.kg+2.5:null,lt?`Vorwoche ${nf(lt.kg,2)} kg + 2,5 kg pro Kurzhantel`:'Vorwoche fehlt','v');
 if(k3==='2-3-6'||k3==='2-1-5'){const m=maxKg(bl.e,w,d);return out(m,m?`schwerste Last des Zyklus (${nf(m,2)} kg)`:'schwerste Last des Zyklus wählen','v')}
 if(k3==='2-1-3'){const e=estE1(bl.e,w,d,b,i);return e?out(kgFor(e.e1,10,9),`konservatives 10RM aus e1RM ${nf(e.e1,0)} (${e.src})`):out(lt&&lt.kg,'Vorwoche')}
 if(bl.src){const [sw,sd,sb]=bl.src;const base=firstKg(sw,sd,sb)??((sw*ND()+sd)<(w*ND()+d)?sugg(sw,sd,sb,0).kg:null);
  if(!base)return out(null,`Last aus W${sw+1} ${DAYS[sd].tag} fehlt noch`);const ts=tIn(firstKg(sw,sd,sb),()=>sugg(sw,sd,sb,0));
  let kg=base,why=`W${sw+1} ${DAYS[sd].tag}: ${nf(base,2)} kg`;
  if(bl.pct){kg=base*bl.pct/100;why+=` · ${bl.pct>100?'+':''}${nf(bl.pct-100)} %`}
  if(bl.add){kg+=bl.add;why+=` + ${nf(bl.add,2)} kg`}
  if(bl.inc){kg+=inc*bl.inc;why+=` + ${bl.inc} Inkrement`}
  return out(kg,why,ts)}
 if(bl.test1){const e=estE1(bl.e,w,d,b,i);return out(e?e.e1:null,e?`Orientierung: geschätztes 1RM ${nf(e.e1,0)} kg (${e.src}) – Tagesform entscheidet`:'Bis zum Tages-1RM steigern')}
 if(bl.same)return out(lt&&lt.kg,lt?`gleiche Last wie W${lt.W+1} ${DAYS[lt.D].tag}`:'Vorwert fehlt – Last frei wählen','v');
 // 4) RPE-Vorgabe → aus geschätztem 1RM
 const rc=R.r??R.calc;
 if(bl.rpe!=null&&rc){const e=estE1(bl.e,w,d,b,i);
  if(e){let rpe=bl.rpe;if(kind==='last')rpe=Math.max(5,bl.rpe-0.5*(bl.s-1));else if(kind==='avg')rpe=Math.max(5,bl.rpe-0.25*(bl.s-1));
   return out(kgFor(e.e1,rc,rpe),`${rc} Wdh @ RPE ${nf(rpe)} aus e1RM ${nf(e.e1,0)} (${e.src})`)}}
 if(lt)return out(lt.kg,`Last von W${lt.W+1} ${DAYS[lt.D].tag}`);
 return out(null,'Erster Satz: Last nach Gefühl wählen – danach rechnet die App')}
function zielHTML(w,d,b){const bl=P[w][d].b[b],L=log(w,d),lt=lastTime(w,d,b);let i=-1;for(let k=0;k<bl.s;k++){if(!(L&&L.b[b][k].ok)){i=k;break}}
 let h='';
 if(i>=0){const sg=sugg(w,d,b,i);const em=sg.kg!=null&&sg.t!=='v';h+=em?`<span class="auto emp"><small>Satz ${i+1} · Plan: ${esc(sg.rdisp)}${bl.rpe!=null?' @ RPE '+nf(bl.rpe):''} – Last frei</small><b><i class="et">Empfehlung</i> ≈ ${nf(sg.kg,2)} kg</b><em>nur Orientierung · ${esc(sg.why)}</em></span>`:`<span class="auto"><small>${sg.kg!=null?'Vorgabe laut Plan':'Automatisch berechnet'} · Satz ${i+1}</small><b>${sg.kg!=null?nf(sg.kg,2)+' kg':'– kg'} × ${esc(sg.rdisp)}${bl.rpe!=null?' @ RPE '+nf(bl.rpe):''}</b><em>${esc(sg.why)}</em></span>`}
 else h+=`<span class="auto"><small>Alle Sätze erledigt</small></span>`;
 if(lt)h+=`<span class="mut">Zuletzt W${lt.W+1} ${DAYS[lt.D].tag}: <b>${nf(lt.kg,2)} kg × ${nf(lt.r)}${lt.rpe!=null?' @'+nf(lt.rpe):''}</b></span>`;
 return h}

 P[w][d].b.forEach((bl,b)=>{for(let i=0;i<bl.s;i++){const sg=sugg(w,d,b,i);const k=document.getElementById(`k-${w}-${d}-${b}-${i}`),r=document.getElementById(`r-${w}-${d}-${b}-${i}`);
  if(k)k.placeholder=sg.kg!=null?(sg.t!=='v'?'≈'+nf(sg.kg,2):nf(sg.kg,2)):'kg';if(r)r.placeholder=sg.rdisp}const z=document.getElementById('ziel-'+b);if(z)z.innerHTML=zielHTML(w,d,b)})},250)}

/* ===================== Aufwärmen ===================== */
const WU=['psq','csq','pdl','cdl','platz','pb3','pbb','hbs','sgdl','ecc','fub','rdle','rdlt','mach','cgb'];
const isWU=e=>WU.includes(e)||!!(EX[e]&&EX[e].m&&EX[e].eq==='bb'&&['sq','bp','dl'].includes(EX[e].g));
function warmups(w,d,b,Wo){const bl=P[w][d].b[b];if(!isWU(bl.e))return null;const g=EX[bl.e].g;
 for(let B=0;B<b;B++){const x=P[w][d].b[B];if(isWU(x.e)&&EX[x.e].g===g)return null}
 const L=log(w,d);const W=Wo??pnum(L&&L.b[b][0].kg)??sugg(w,d,b,0).kg;if(!W)return [];
 const bar=S.meta.bar||20,R=/^\d+$/.test(bl.r)?+bl.r:5;
 const st=g==='dl'?[[.4,5],[.55,3],[.7,2]]:[[0,10],[.4,5],[.55,3],[.7,2]];
 if(R<=6)st.push([.8,1]);if(R<=3)st.push([.9,1]);
 const out=[];for(const [p,r] of st){let kg=p===0?bar:Math.round(W*p/5)*5;if(g==='dl'&&kg<60&&W>100)kg=60;if(p>0&&kg<=bar)continue;if(kg>=W-1)continue;if(out.some(o=>o.kg===kg))continue;out.push({kg,r})}
 return out}
function wuHTML(w,d,b){const list=warmups(w,d,b);if(list===null)return '';const L=log(w,d);const done=(L&&L.wu&&L.wu[b])||[];
 if(!list.length)return `<details class="wu"><summary>Aufwärmen</summary><p class="note2">Erscheint, sobald ein Zielgewicht feststeht.</p></details>`;
 const n=list.filter((_,j)=>done[j]).length;
 return `<details class="wu" ${n<list.length?'open':''}><summary>Aufwärmen <i class="wuemp">Empfehlung</i> · ${n}/${list.length} · bis ${nf(pnum(L&&L.b[b][0].kg)??sugg(w,d,b,0).kg,2)} kg</summary><div class="wul">${list.map((x,j)=>{const pl=plates(x.kg);
  return `<button type="button" class="wur ${done[j]?'ok':''}" data-wu="${b}:${j}" aria-pressed="${!!done[j]}"><span class="num">${x.kg===(S.meta.bar||20)?'Stange':nf(x.kg,2)+' kg'} × ${x.r}</span><small>${pl.length?pl.map(p=>nf(p,2)).join(' + ')+' pro Seite':'nur Stange'}</small>${CHECK}</button>`}).join('')}</div></details>`}
function toggleWu(w,d,b,j){const L=log(w,d,true);if(!L.wu)L.wu={};if(!L.wu[b])L.wu[b]=[];L.wu[b][j]=!L.wu[b][j];saveLog(key(w,d))}

/* ===================== Körpergewicht & Punkte ===================== */
const poly=(c,x)=>c.reduce((a,k,i)=>a+k*x**i,0);
function wilks(t,bw,f){return t*500/poly(f?[594.31747775582,-27.23842536447,0.82112226871,-0.00930733913,4.731582e-5,-9.054e-8]:[-216.0475144,16.2606339,-0.002388645,-0.00113732,7.01863e-6,-1.291e-8],bw)}
function dots(t,bw,f){return t*500/poly(f?[-57.96288,13.6175032,-0.1126655495,0.0005158568,-0.0000010706]:[-307.75076,24.0900756,-0.1918759221,0.0007391293,-0.000001093],bw)}
function ipfgl(t,bw,f){const [A,B,C]=f?[610.32796,1045.59282,0.03048]:[1199.72839,1025.18162,0.00921];return t*100/(A-B*Math.exp(-C*bw))}
function bwSeries(){const out=[];for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const L=log(w,d);const v=L&&pnum(L.bw);if(v)out.push({w,d,v})}return out}
function curBw(){const s=bwSeries();return s.length?s[s.length-1].v:pnum(S.meta.bw)}

function pkgFor(w,d){const L=log(w,d,true);const sets=[];
 P[w][d].b.forEach((bl,b)=>(L.b[b]||[]).forEach((s,i)=>{const kg=pnum(s.kg),r=pnum(s.r),rp=pnum(s.rpe);if(!s.ok&&!kg)return;const e=e1rm(kg,r,rp);
  sets.push({block:b+1,satz:i+1,uebung:EX[bl.e].n,uebung_id:bl.e,lift:EX[bl.e].g,vorgabe:bl.x,soll_rpe:bl.rpe??null,hype:bl.h||null,kg,wdh:r,rpe:rp,erledigt:!!s.ok,pause_s:s.rest??null,e1rm:e?Math.round(e*10)/10:null})}));

function anaPrompt(w){const lines=[];

// Belastbarkeit einer Kennzahl: n = Anzahl Datenpunkte, kind = 'sets' | 'ses'
function evid(n,kind){const L=kind==='ses'?[3,6]:[5,15];const u=kind==='ses'?(n===1?'Einheit':'Einheiten'):(n===1?'Satz':'Sätze');
 const c=n<L[0]?'lo':n<L[1]?'mid':'hi';const t=n<L[0]?'zu wenig Daten':n<L[1]?'vorläufig':'belastbar';
 return `<span class="evid ${c}" title="Belastbarkeit: ${t}"><i></i>${n} ${u} · ${t}</span>`}
// Paare Top-Satz → Backoff im aktuellen Programm
function backoffPairs(){const out=[];
 for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const day=P[w][d];const L=log(w,d);if(!L||!day.b.length)continue;
  day.b.forEach((bl,b)=>{let t=null;
   if(bl.ref==='TOP')t=b-(bl.back||1);
   else if(bl.src&&bl.src[0]===w&&bl.src[1]===d)t=bl.src[2];
   else if(b>0&&day.b[b-1].e===bl.e&&EX[bl.e]&&EX[bl.e].m&&!(day.b[b-1].ref==='TOP'||(day.b[b-1].src&&day.b[b-1].src[0]===w)))t=b-1;
   if(!(EX[bl.e]&&EX[bl.e].m&&GN[EX[bl.e].g]))return;
   if(t==null||t<0||!day.b[t]||day.b[t].e!==bl.e&&!(EX[day.b[t].e]&&EX[bl.e]&&EX[day.b[t].e].g===EX[bl.e].g))return;
   const ts=(L.b[t]||[]).find(z=>z&&z.ok&&pnum(z.kg)&&pnum(z.r));if(!ts)return;
   const bs=(L.b[b]||[]).filter(z=>z&&z.ok&&pnum(z.kg)&&pnum(z.r));if(!bs.length)return;
   const tkg=pnum(ts.kg),tr=pnum(ts.r),trp=pnum(ts.rpe),te=e1rm(tkg,tr,trp);
   let soll=null;if(bl.ref==='TOP')soll=bl.minus?(tkg-bl.minus)/tkg*100:bl.plus?(tkg+bl.plus)/tkg*100:(bl.pct??100);else if(bl.src)soll=bl.pct??100;else{const g0=sugg(w,d,b,0);if(g0&&g0.kg&&g0.t==='v'){const gt=sugg(w,d,t,0);if(gt&&gt.kg&&gt.t==='v')soll=g0.kg/gt.kg*100}}
   const ist=bs.reduce((a,z)=>a+pnum(z.kg),0)/bs.length/tkg*100;
   const rp=bs.map(z=>pnum(z.rpe)).filter(v=>v!=null);const be=bs.map(z=>e1rm(pnum(z.kg),pnum(z.r),pnum(z.rpe))).filter(Boolean);
   const R=repsFor(w,d,b);const repSoll=R&&R.r!=null&&!R.amrap?R.r:null;const repHit=repSoll?bs.filter(z=>pnum(z.r)>=repSoll).length:null;
   out.push({w,d,b,t,e:bl.e,g:EX[bl.e].g,tkg,tr,trp,te,n:bs.length,soll,ist,dPct:soll!=null?ist-soll:null,
    rpeSoll:bl.rpe??null,rpeAvg:rp.length?rp.reduce((a,c)=>a+c,0)/rp.length:null,drift:rp.length>1?rp[rp.length-1]-rp[0]:null,
    drop:te&&be.length?(be.reduce((a,c)=>a+c,0)/be.length/te-1)*100:null,repSoll,repHit})})}
 return out}
function backoffHTML(){const pr=backoffPairs();const N={sq:'Kniebeuge',bp:'Bankdrücken',dl:'Kreuzheben',acc:'Weitere'};
 const head=`<div class="ct"><div><p class="eyebrow">${esc(PROGS[PROG].name)}</p><h2 class="h2">Top-Satz & Backoffs</h2></div>${evid(pr.reduce((a,x)=>a+x.n,0),'sets')}</div>`;
 if(!pr.length)return `<section class="card">${head}<div class="leer">Sobald du einen Top-Satz und die zugehörigen Backoff-Sätze abhakst, siehst du hier, ob die Backoffs Prozent, RPE und Wiederholungen getroffen haben und wie stark deine Leistung über die Sätze abfällt.</div></section>`;
 const mean=a=>{const x=a.filter(v=>v!=null);return x.length?x.reduce((p,q)=>p+q,0)/x.length:null};const sg=(v,d=1)=>{if(v==null)return '–';const r=Math.round(v*10**d)/10**d;return (r>0?'+':r<0?'−':'±')+nf(Math.abs(r),d)};
 const gs=['sq','bp','dl','acc'].filter(g=>pr.some(x=>(GN[x.g]?x.g:'acc')===g));
 const card=g=>{const L=pr.filter(x=>(GN[x.g]?x.g:'acc')===g);const n=L.reduce((a,x)=>a+x.n,0);const dp=mean(L.map(x=>x.dPct)),dr=mean(L.map(x=>x.drop)),df=mean(L.map(x=>x.drift)),rv=mean(L.map(x=>x.rpeAvg!=null&&x.rpeSoll!=null?x.rpeAvg-x.rpeSoll:null));
  const rh=L.filter(x=>x.repSoll);const rq=rh.length?rh.reduce((a,x)=>a+x.repHit,0)/rh.reduce((a,x)=>a+x.n,0)*100:null;
  return `<div class="bo-c" style="--c:${GC[g]||'var(--acc)'}"><div class="bo-h"><b>${N[g]}</b>${evid(n,'sets')}</div>
   <div class="bo-k"><span><small>Last Ist vs. Soll</small><b>${dp==null?'–':sg(dp)+' %'}</b></span><span><small>Leistungsabfall</small><b>${dr==null?'–':sg(dr)+' %'}</b></span><span><small>RPE Ist − Soll</small><b>${sg(rv,2)}</b></span><span><small>RPE-Anstieg</small><b>${sg(df,2)}</b></span><span><small>Wdh. erreicht</small><b>${rq==null?'–':Math.round(rq)+' %'}</b></span></div></div>`};

  <p class="note2"><b>Last Ist vs. Soll:</b> Backoff-Gewicht in % vom Top-Satz, verglichen mit der Vorgabe. <b>Leistungsabfall:</b> e1RM der Backoffs gegenüber dem Top-Satz – stark negative Werte zeigen hohe Ermüdung. <b>RPE-Anstieg:</b> letzter minus erster Backoff-Satz. Reine Auswertung, keine Änderung an Vorgaben.</p></section>`}
// Fairer Kraft-Trend: nur Wettkampf-Lifts, abgehakt, 1–6 Wdh., RPE ≥ 8 – über alle Programme
function fairTrend(){const comp={sq:'csq',bp:'pbb',dl:'cdl'};const pts={sq:[],bp:[],dl:[]};
 ORD().concat(Object.keys(PROGS).filter(id=>isSQ(id))).forEach(pid=>{if(!PROGS[pid])return;withProg(pid,()=>{const A=allSets();const by={};
  A.forEach(x=>{const g=Object.keys(comp).find(k=>comp[k]===x.e);if(!g||!x.ok||!x.e1||x.rpe==null||x.rpe<8||x.r<1||x.r>6)return;const k=g+'|'+x.w+'|'+x.d;if(!by[k]||x.e1>by[k].e1)by[k]={g,e1:x.e1,kg:x.kg,r:x.r,rpe:x.rpe,w:x.w,d:x.d}});

function allSets(){const out=[];for(let w=0;w<NW();w++)for(let d=0;d<ND();d++){const L=log(w,d);if(!L)continue;

function sollReps(w,d,b){const bl=P[w][d].b[b],R=repsFor(w,d,b);if(R.amrap||R.r==null)return null;
 if(/^\d+-\d+$/.test(bl.r)){const [a,c]=bl.r.split('-').map(Number);return {lo:a,hi:c,disp:a+'–'+c}}

 if(k==='each')return true;if(k==='first')return i===0;if(k==='avg')return false;return i===bl.s-1}
// Bewertung eines erledigten Satzes gegen die Vorgabe
function setAdh(w,d,b,i){const bl=P[w][d].b[b],L=log(w,d);if(!L||!L.b[b])return null;const s=L.b[b][i];
 if(!s||!s.ok)return null;const kg=pnum(s.kg),r=pnum(s.r),rpe=pnum(s.rpe);const o={parts:[]};
 const SR=sollReps(w,d,b);if(SR&&r!=null){const hit=r>=SR.lo&&r<=SR.hi;o.reps={soll:SR.disp,ist:r,hit,diff:r<SR.lo?r-SR.lo:r>SR.hi?r-SR.hi:0};o.parts.push(hit)}
 if(rpeApplies(bl,i)){if(rpe!=null){const df=rpe-bl.rpe;o.rpe={soll:bl.rpe,ist:rpe,diff:df,hit:Math.abs(df)<=.5};o.parts.push(o.rpe.hit)}else{o.rpe={soll:bl.rpe,ist:null,hit:false,miss:true};o.parts.push(false)}}
 if(kindOf(bl)==='avg'&&bl.rpe!=null&&i===bl.s-1){const v=L.b[b].slice(0,bl.s).map(x=>pnum(x.rpe)).filter(x=>x!=null);
  if(v.length){const av=v.reduce((a,x)=>a+x,0)/v.length,df=av-bl.rpe;o.rpe={soll:bl.rpe,ist:Math.round(av*10)/10,diff:df,hit:Math.abs(df)<=.5,avg:true};o.parts.push(o.rpe.hit)}}
 if((bl.ref||bl.pct!=null)&&kg){const sg=sugg(w,d,b,i);if(sg&&sg.kg){const tol=Math.max(2.5,sg.kg*.02),df=kg-sg.kg;o.kg={soll:sg.kg,ist:kg,diff:df,hit:Math.abs(df)<=tol+1e-9};o.parts.push(o.kg.hit)}}
 o.hit=o.parts.length?o.parts.every(Boolean):null;return o}
function dayAdh(w,d){const L=log(w,d);const day=P[w][d];let plan=0,done=0,ev=0,hit=0;const dev=[];
 day.b.forEach((bl,b)=>{if(!bl.opt)plan+=bl.s;for(let i=0;i<bl.s;i++){const s=L&&L.b[b]&&L.b[b][i];if(s&&s.ok){if(!bl.opt||true)done+=bl.opt?0:1;const a=setAdh(w,d,b,i);

/* ---------- RPE-Kalibrierung ---------- */
function repsAtPct(p){if(p>=100)return 1;for(let lo=1;lo<12;lo++){if(p>=RTS[lo]){return lo+(RTS[lo-1]-p)/(RTS[lo-1]-RTS[lo])}}return 12+Math.max(0,(68-p)/2.9)}
function calib(){const A=allSets().filter(s=>EX[s.e].m&&s.rpe!=null&&s.r>=1&&s.r<=12);const out={sq:[],bp:[],dl:[]};
 const anchors={};A.forEach(s=>{if(s.rpe<8.5)return;const k=s.e+'|'+s.w;if(!anchors[k]||s.e1>anchors[k])anchors[k]=s.e1});
 const anc=(e,w)=>anchors[e+'|'+w]??anchors[e+'|'+(w-1)]??anchors[e+'|'+(w+1)]??null;
 A.forEach(s=>{if(s.rpe>8||!out[s.g])return;const a=anc(s.e,s.w);if(!a)return;const p=s.kg/a*100;const n=repsAtPct(p);const exp=Math.max(4,Math.min(10,10-(n-s.r)));
  out[s.g].push({diff:s.rpe-exp,s,exp})});
 const res={};Object.keys(out).forEach(g=>{const v=out[g];if(!v.length){res[g]={n:0};return}const m=v.reduce((a,x)=>a+x.diff,0)/v.length;res[g]={n:v.length,m:Math.round(m*4)/4,list:v}});return res}
function calibVerdict(c){if(!c||c.n<3)return {t:'Noch zu wenig Daten',sub:`${c?c.n:0}/3 Sätze mit RPE ≤ 8 und Referenz`,cls:''};
 if(Math.abs(c.m)<.5)return {t:'Präzise',sub:`Ø Abweichung ${c.m>0?'+':''}${nf(c.m,2)} RPE`,cls:'ok'};
 return c.m>0?{t:'Du schätzt zu hoch',sub:`Ø +${nf(c.m,2)} RPE – du hattest mehr Reserve als angegeben`,cls:'warn'}:{t:'Du schätzt zu niedrig',sub:`Ø ${nf(c.m,2)} RPE – der Satz war härter als angegeben`,cls:'warn'}}
function calibHint(g,soll){if(!soll||soll>8.5||!GN[g])return '';const C=calib()[g];if(!C||C.n<3||Math.abs(C.m)<.5)return '';
 const fx=Math.min(10,soll+C.m);return `<p class="calh"><b>Kalibrierung ${GN[g]}:</b> Deine Angaben lagen bisher im Schnitt ${C.m>0?'um +'+nf(C.m,2)+' zu hoch':'um '+nf(C.m,2)+' zu niedrig'}. Für echtes <b>RPE ${nf(soll)}</b> sollte es sich eher wie <b>${nf(Math.round(fx*2)/2)}</b> anfühlen.</p>`}

const RB=[1,3,5,8];
function repBest(ex,N,excl){let m=null;allSets().forEach(s=>{if(s.e!==ex||s.r<N)return;if(excl&&s.w===excl.w&&s.d===excl.d&&s.b===excl.b&&s.i===excl.i)return;if(!m||s.kg>m.kg)m=s});return m}
function repPRof(w,d,b,i){const bl=P[w][d].b[b];if(!EX[bl.e].m)return null;const s=log(w,d).b[b][i];const kg=pnum(s.kg),r=pnum(s.r);if(!kg||!r)return null;
 for(const N of RB.slice().reverse()){if(r<N)continue;const prev=repBest(bl.e,N,{w,d,b,i});if(prev&&kg>prev.kg+.01)return {N,kg,prev:prev.kg,ex:EX[bl.e].n,r}}return null}
function showRepPR(o){const f=$('#fx');f.className='fx pr';f.innerHTML=`<div class="fx-in"><p class="eyebrow">Neuer ${o.N===1?'Single':o.N+'er'}-Rekord</p><b class="disp">${esc(o.ex)}</b>
 <div class="prv"><b class="zahl">${nf(o.kg,2)}<small>kg × ${o.r}</small></b><span class="chip ok">+${nf(o.kg-o.prev,2)} kg</span></div>
 <small>bisher ${nf(o.prev,2)} kg für ${o.N===1?'1 Wdh':'mind. '+o.N+' Wdh'}</small><button type="button" class="btn primary">Weiter</button></div>`;
 f.hidden=false;sfx('pr');hap([20,60,20,60,40]);confetti();clearTimeout(f._t);f._t=setTimeout(()=>{f.hidden=true},6000)}
function recordsHTML(A){const exs=[...new Set(A.filter(s=>EX[s.e].m).map(s=>s.e))];
 if(!exs.length)return `<section class="card"><div class="ct"><h2 class="h2">Rekordtafel</h2></div><div class="leer">Erscheint, sobald Sätze der Grundübungen eingetragen sind.</div></section>`;
 const ord={sq:0,bp:1,dl:2};exs.sort((a,b)=>(ord[EX[a].g]??9)-(ord[EX[b].g]??9)||EX[a].n.localeCompare(EX[b].n));
 const rows=exs.map(e=>{const ss=A.filter(s=>s.e===e);const e1=Math.max(...ss.map(s=>s.e1||0));
  const cells=RB.map(N=>{const b=ss.filter(s=>s.r>=N).sort((x,y)=>y.kg-x.kg)[0];return b?`<td class="r" data-tip="${esc(`${EX[e].n}: ${nf(b.kg,2)} kg × ${b.r} · W${b.w+1} ${DAYS[b.d].tag}`)}">${nf(b.kg,2)}</td>`:'<td class="r mut">–</td>'}).join('');
  return `<tr data-ex="${e}" style="cursor:pointer"><td><span class="dot" style="--c:${GC[EX[e].g]}"></span>${esc(EX[e].n)}</td>${cells}<td class="r"><b>${e1?nf(e1,0):'–'}</b></td></tr>`}).join('');
 return `<section class="card"><div class="ct"><h2 class="h2">Rekordtafel</h2></div><div class="tw"><table class="tab rec">
  <thead><tr><th>Übung</th>${RB.map(N=>`<th class="r">${N}×</th>`).join('')}<th class="r">e1RM</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="note2">Spalten 1× bis 8×: schwerstes Gewicht, das du für mindestens so viele Wiederholungen bewegt hast (kg). Neue Rekorde werden direkt im Satz gefeiert.</p></section>`}

/* ---------- Plan-Treue & Kalibrierung (Progress) ---------- */
function adhHTML(){const R=adhAll();const t=R.tot;
 if(!t.done)return `<section class="card"><div class="ct"><h2 class="h2">Plan-Treue</h2></div><div class="leer">Sobald du Sätze abhakst, siehst du hier, wie genau du die Programmvorgaben triffst.</div></section>`;
 const hp=t.ev?t.hit/t.ev:0,vp=t.plan?t.done/t.plan:0;
 const bar=(v,c)=>`<i style="--v:${Math.round(v*100)}%;--c:${c}"></i>`;
 const wk=R.wk.map((W,w)=>W.days?`<div class="adw"><b>W${w+1}</b><div class="adb"><span>Umfang</span>${bar(W.plan?W.done/W.plan:0,'var(--cyan)')}<em>${pctTxt(W.done,W.plan)}</em></div><div class="adb"><span>Vorgaben</span>${bar(W.ev?W.hit/W.ev:0,'var(--ok)')}<em>${pctTxt(W.hit,W.ev)}</em></div></div>`:`<div class="adw dim"><b>W${w+1}</b><small>noch nicht trainiert</small></div>`).join('');
 const dv=R.dev.slice(-6).reverse().map(x=>{const a=x.a,why=[];if(a.reps&&!a.reps.hit)why.push(`${a.reps.ist} statt ${a.reps.soll} Wdh`);if(a.rpe&&!a.rpe.hit)why.push(a.rpe.miss?'RPE nicht eingetragen':`RPE ${nf(a.rpe.ist)} statt ${nf(a.rpe.soll)}`);if(a.kg&&!a.kg.hit)why.push(`${nf(a.kg.ist,2)} statt ${nf(a.kg.soll,2)} kg`);
  return `<li><span class="dot" style="--c:${GC[EX[x.bl.e].g]}"></span><span><b>W${x.w+1} ${DAYS[x.d].tag} · ${esc(EX[x.bl.e].n)}</b> Satz ${x.i+1}<small>${why.join(' · ')}</small></span></li>`}).join('');
 return `<section class="card adhc"><div class="ct"><h2 class="h2">Plan-Treue</h2></div>
  <div class="adk"><div class="adr">${ringSVG(hp,'var(--ok)',96,9)}<b class="zahl">${t.ev?Math.round(hp*100):'–'}<small>%</small></b></div>
   <div><p class="eyebrow">Vorgaben getroffen</p><p class="lead" style="margin:4px 0 0">${t.hit} von ${t.ev} bewerteten Sätzen trafen Wiederholungen, Soll-RPE (±0,5) und Prozent-Last (±2,5 kg).</p>
   <p class="mut" style="margin-top:6px;font-size:13px">Umfang erfüllt: <b style="color:var(--ink)">${pctTxt(t.done,t.plan)}</b> der Pflichtsätze an trainierten Tagen</p></div></div>
  <div class="adws">${wk}</div>
  ${dv?`<p class="eyebrow" style="margin-top:16px">Letzte Abweichungen</p><ul class="adl">${dv}</ul>`:'<p class="note2">Keine Abweichungen – alles exakt nach Plan.</p>'}</section>`}
function calibHTML(){const C=calib();
 return `<section class="card"><div class="ct"><h2 class="h2">RPE-Kalibrierung</h2></div><div class="cals">${['sq','bp','dl'].map(g=>{const c=C[g],v=calibVerdict(c);
  const pos=c&&c.n>=3?Math.max(-1.5,Math.min(1.5,c.m)):null;
  return `<div class="cal" style="--c:${GC[g]}"><p class="eyebrow">${GN[g]}</p><b class="${v.cls}">${v.t}</b><small>${v.sub}</small>
   <div class="calbar"><span>zu niedrig</span><i>${pos!=null?`<em style="left:${50+pos/1.5*50}%"></em>`:''}</i><span>zu hoch</span></div></div>`}).join('')}</div>
  <p class="note2">Vergleicht deine RPE-Angaben bei Sätzen bis RPE 8 mit dem, was deine schweren Sätze (RPE 8,5+) derselben Übung über deine Kraft verraten. Das Programm bleibt unverändert – der Hinweis hilft dir nur, die Soll-RPE genauer zu treffen, denn davon hängen die berechneten Gewichte ab.</p></section>`}
